  "upload_folder",
  "download_document",
  "download_range",
  "view_document",
  "move_document",
  "restore_document",
  "delete_document",
  "get_document_info",
  "get_backup_drive_status",
  "select_backup_destination",
  "start_manual_backup",
  "get_backup_progress",
