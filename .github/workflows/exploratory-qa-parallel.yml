name: Exploratory QA Parallel Wave

# The PARALLEL COMPLETION WAVE (directive 2026-09-16): after the patients
# focus reached definitive GREEN, ONE frozen GREEN product DMG is shared
# across all remaining shards. Each shard = clean macOS VM + clean app state
# + own synthetic DB + the SAME DMG (SHA-256 proven in every shard).
#
#   SHARD A  search + settings + persistence  (the three already-proven
#            harness focuses, one VM, sequential invocations with the
#            FRESH_STATE gateway between them)
#   SHARD B  documents + scan + file management   (new focus: documents)
#   SHARD C  clinical: visits + notes + prescriptions + reports (clinical)
#   SHARD D  data-io + backup + dashboard + analytics + notifications +
#            calendar + global actions + keyboard (dataio)
#   SHARD E  macOS save/print/desktop integration + error/recovery (desktop)
#
# fail-fast=false — every shard runs to its own honest first-red.
# Discipline identical to exploratory-qa.yml (P0 stop / P1-P2 first-red /
# P3 record / D harness / ENV / EXPECTED). The expensive product build
# happens exactly ONCE (in the SOURCE run); this workflow never rebuilds.
#
# OPT-IN PROVISIONAL MODE (directive 2026-09-18 — "artifact readiness and
# product acceptance are separate concepts"): the DEFAULT source gate stays
# strict (completed + success — never weakened globally). A dispatch may set
# allow_in_progress_source=true to start shards while the source run is STILL
# in_progress, but ONLY on proof that its immutable DMG is already built:
# exact expected head SHA, the named product build job completed SUCCESS,
# exactly ONE unexpired product-test-dmg-arm64 artifact, the DMG SHA-256
# verified, and no product build job still running. Evidence gathered this
# way is stamped PROVISIONAL — AWAITING SOURCE PATIENT REGRESSION and is
# promoted to ACCEPTED only if the source run later completes GREEN at the
# SAME DMG SHA-256 (a REAL product regression blocks promotion and triggers
# targeted reruns; a D-class harness finding preserves the evidence).

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'The source run that owns the frozen DMG artifact (normally the completed GREEN patients run; in_progress allowed ONLY with allow_in_progress_source=true)'
        required: true
        type: string
      source_sha:
        description: 'The expected public head SHA of the source run (stale-head guard)'
        required: true
        type: string
      arch:
        description: 'arm64 only'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
      shards:
        description: 'Comma-separated shards to run (default all; e.g. "B,C,D,E" to skip an already-green A)'
        required: false
        default: 'A,B,C,D,E'
        type: string
      sibling_run_ids:
        description: 'Optional comma-separated EARLIER wave runs whose qa-evidence-* artifacts the combined gallery should also include (e.g. a run that already greened shard A)'
        required: false
        default: ''
        type: string
      allow_in_progress_source:
        description: 'NARROW OPT-IN (default false keeps the strict gate: source run completed + success). true = additionally accept an in_progress source run whose immutable DMG is already proven: exact expected head SHA, the named build job completed SUCCESS, exactly ONE unexpired product-test-dmg-arm64 artifact, DMG SHA-256 verified, no product build job still running. Results are PROVISIONAL - AWAITING SOURCE PATIENT REGRESSION until the source run itself completes GREEN at the same DMG SHA-256.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  validate-source:
    name: "Validate the frozen source run + DMG"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      provisional: ${{ steps.gate.outputs.provisional }}
      frozen_dmg_sha: ${{ steps.dmg.outputs.sha256 }}
    env:
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
      SOURCE_SHA: ${{ github.event.inputs.source_sha }}
    steps:
      - name: "Source gate (strict default; opt-in narrow exception for an in_progress source with a proven immutable DMG)"
        id: gate
        shell: bash
        env:
          ALLOW_IN_PROGRESS: ${{ github.event.inputs.allow_in_progress_source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          STATUS="$(python3 -c "import json,sys; print(json.load(sys.stdin)['status'])" <<<"$RUN_JSON")"
          CONCL="$(python3 -c "import json,sys; print(json.load(sys.stdin)['conclusion'])" <<<"$RUN_JSON")"
          HEAD="$(python3 -c "import json,sys; print(json.load(sys.stdin)['head_sha'])" <<<"$RUN_JSON")"
          echo "source run ${SOURCE_RUN_ID}: status=${STATUS} conclusion=${CONCL} head=${HEAD} allow_in_progress_source=${ALLOW_IN_PROGRESS}"

          # the stale-head guard applies in BOTH modes (artifact identity follows the SHA)
          [ "$HEAD" = "${SOURCE_SHA}" ] || { echo "::error::source run head ${HEAD} != expected ${SOURCE_SHA} (stale-head guard)"; exit 1; }

          PROVISIONAL=false
          if [ "$STATUS" = "completed" ]; then
            # STRICT DEFAULT — unchanged behavior (also the only path when allow_in_progress_source=false)
            [ "$CONCL" = "success" ] || { echo "::error::source run is not GREEN — patients must be definitively GREEN first"; exit 1; }
            echo "source gate: STRICT PASS (run completed + success at the expected head)"
          elif [ "$STATUS" = "in_progress" ] && [ "${ALLOW_IN_PROGRESS}" = "true" ]; then
            echo "source gate: PROVISIONAL MODE (allow_in_progress_source=true, run in_progress) — proving immutable artifact readiness instead"
            JOBS_JSON="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
            BUILD_OK="$(REQUIRED_BUILD_JOB='Build the first-run-fix test DMG (arm64)' python3 -c '
          import json, os, sys
          required = os.environ["REQUIRED_BUILD_JOB"]
          jobs = json.load(sys.stdin).get("jobs", [])
          req = [j for j in jobs if j.get("name") == required]
          if not req:
              print("missing-required-build-job"); sys.exit(0)
          j = req[0]
          if j.get("status") != "completed" or j.get("conclusion") != "success":
              print("required-build-not-success:" + str(j.get("status")) + "/" + str(j.get("conclusion"))); sys.exit(0)
          still = [j.get("name") for j in jobs if (j.get("name") or "").startswith("Build") and j.get("status") != "completed"]
          if still:
              print("product-build-still-running:" + ",".join(still)); sys.exit(0)
          print("ok")
          ' <<<"$JOBS_JSON")"
            [ "$BUILD_OK" = "ok" ] || { echo "::error::PROVISIONAL GATE: immutable product artifact not proven (${BUILD_OK}) — the named build job must be completed SUCCESS with no product build still running"; exit 1; }
            echo "provisional gate: named build job completed SUCCESS; no product build job still running"
            ART_OK="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
              | python3 -c '
          import json, sys
          arts = [a for a in json.load(sys.stdin).get("artifacts", []) if a.get("name") == "product-test-dmg-arm64" and not a.get("expired")]
          print("ok" if len(arts) == 1 else "unexpired-count=%d" % len(arts))
          ' )"
            [ "$ART_OK" = "ok" ] || { echo "::error::PROVISIONAL GATE: expected exactly ONE unexpired product-test-dmg-arm64 artifact (${ART_OK})"; exit 1; }
            echo "provisional gate: exactly one unexpired product-test-dmg-arm64 artifact (its SHA-256 is verified by the following steps)"
            PROVISIONAL=true
          else
            echo "::error::source run status=${STATUS} is not completed+success (strict gate) and the in_progress opt-in is not enabled — wait for GREEN or dispatch with allow_in_progress_source=true"
            exit 1
          fi
          echo "provisional=${PROVISIONAL}" >> "$GITHUB_OUTPUT"

      - name: Download the frozen DMG from the source run
        uses: actions/download-artifact@v4
        with:
          name: product-test-dmg-arm64
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: dmg

      - name: Verify the DMG SHA-256 (the one frozen build for the whole wave)
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          cd dmg
          ls -la
          test -f MediVault-0.1.1-firstrun-arm64.dmg || { echo "::error::DMG missing"; exit 1; }
          test -f MediVault-0.1.1-firstrun-arm64.dmg.sha256 || { echo "::error::DMG sha256 file missing"; exit 1; }
          EXPECTED="$(awk '{print $1}' MediVault-0.1.1-firstrun-arm64.dmg.sha256)"
          ACTUAL="$(shasum -a 256 MediVault-0.1.1-firstrun-arm64.dmg | awk '{print $1}')"
          echo "expected=${EXPECTED}"
          echo "actual  =${ACTUAL}"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::DMG hash mismatch"; exit 1; }
          echo "FROZEN DMG VERIFIED: ${ACTUAL}" | tee frozen-dmg-sha256.txt
          echo "sha256=${ACTUAL}" >> "$GITHUB_OUTPUT"

      - name: Share the frozen DMG with all shards
        uses: actions/upload-artifact@v4
        with:
          name: product-dmg-frozen
          retention-days: 14
          path: dmg/

  prep-shards:
    name: "Prepare the shard matrix (filter per the shards input)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.set.outputs.include }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          FILTER="${{ github.event.inputs.shards || 'A,B,C,D,E' }}"
          INCLUDE="$(python3 - "$FILTER" <<'PYEOF'
          import json, sys
          filt = [s.strip().upper() for s in sys.argv[1].split(',') if s.strip()]
          ALL = [
              # Shard A = three CLEAN-VM jobs (the harness gateway demands a
              # pristine runner per invocation — sequential focuses on one VM
              # fail FRESH_STATE, proven by run 35157098933's settings ENV-RED)
              {"shard": "A", "label": "search", "focus_list": "search",
               "artifact": "search"},
              {"shard": "A", "label": "settings", "focus_list": "settings",
               "artifact": "settings"},
              {"shard": "A", "label": "persistence", "focus_list": "persistence",
               "artifact": "persistence"},
              {"shard": "B", "label": "documents + scan + file management",
               "focus_list": "documents", "artifact": "documents-scan"},
              {"shard": "C", "label": "clinical workflow (visits/notes/rx/reports)",
               "focus_list": "clinical", "artifact": "clinical"},
              {"shard": "D", "label": "data-io + dashboard + analytics + notifications + global",
               "focus_list": "dataio", "artifact": "data-io"},
              {"shard": "E", "label": "macOS save/print + error/recovery",
               "focus_list": "desktop", "artifact": "desktop-print"},
              # Shard P = the definitive patients regression WITHOUT a new
              # product build (directive 2026-09-18 §13: artifact readiness
              # and product acceptance are separate concepts). Opt-in only —
              # the default shards input (A,B,C,D,E) never selects it, and
              # the SOURCE patients run stays authoritative while it lives
              # (dispatch P only for a D-class rerun of the SAME frozen DMG)
              {"shard": "P", "label": "patients (the definitive regression, no rebuild)",
               "focus_list": "patients", "artifact": "patients"},
          ]
          # a filter token matches a job by SHARD LETTER ("A") or by exact
          # label ("settings") — so "settings,B,C,D,E" reruns only the
          # affected jobs, keeping already-green focuses frozen
          def matches(entry, tokens):
              if entry["shard"] in tokens:
                  return True
              return any(t.lower() == entry["label"].lower() for t in tokens)
          include = [e for e in ALL if matches(e, filt)]
          print(json.dumps(include))
          PYEOF
          )"
          echo "include=${INCLUDE}" >> "$GITHUB_OUTPUT"
          if [ "$INCLUDE" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  shard:
    name: "Shard ${{ matrix.shard }} — ${{ matrix.label }}"
    needs: [validate-source, prep-shards]
    # cross-shard fix discipline (directive §6): rerun only AFFECTED shards —
    # the `shards` input filters the matrix at prepare time (skipped shards
    # are simply absent from the matrix; no runner is ever allocated)
    if: needs.prep-shards.outputs.any == 'true'
    runs-on: macos-26
    # 240 = the P shard's patients battery needs ~175-185 min (run-24
    # measurement); the other shards finish in their own time — the cap
    # only bounds the worst case
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.prep-shards.outputs.include) }}
    env:
      EXPECTED_ARCH: arm64
      SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
      SHARD: ${{ matrix.shard }}
      PROVISIONAL: ${{ needs.validate-source.outputs.provisional }}
      FROZEN_DMG_SHA: ${{ needs.validate-source.outputs.frozen_dmg_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download the frozen DMG (the shared source build)
        uses: actions/download-artifact@v4
        with:
          name: product-dmg-frozen
          path: ${{ runner.temp }}/dmg

      - name: Prove the DMG SHA-256 in this shard too
        shell: bash
        env:
          DMG_PATH: ${{ runner.temp }}/dmg/MediVault-0.1.1-firstrun-arm64.dmg
          DMG_SHA256_FILE: ${{ runner.temp }}/dmg/MediVault-0.1.1-firstrun-arm64.dmg.sha256
        run: |
          set -euo pipefail
          EXPECTED="$(awk '{print $1}' "$DMG_SHA256_FILE")"
          ACTUAL="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "::error::shard ${SHARD}: DMG hash mismatch"; exit 1; }
          echo "shard ${SHARD} frozen DMG verified: ${ACTUAL}"

      - name: Run the shard battery (each focus = full clean gateway + honest first-red)
        shell: bash
        env:
          DMG_PATH: ${{ runner.temp }}/dmg/MediVault-0.1.1-firstrun-arm64.dmg
          DMG_SHA256_FILE: ${{ runner.temp }}/dmg/MediVault-0.1.1-firstrun-arm64.dmg.sha256
        run: |
          set -euo pipefail
          rc_all=0
          for focus in ${{ matrix.focus_list }}; do
            echo "=== SHARD ${SHARD}: focus ${focus} ==="
            if QA_FOCUS="$focus" bash macos/scripts/exploratory-qa.sh; then
              echo "focus ${focus}: completed"
            else
              rc=$?
              echo "focus ${focus}: exited ${rc} (first-red or recorded stop)"
              # first-red discipline: one shard red does not kill the others
              rc_all="$rc"
            fi
            # preserve EVERY focus's evidence under its own name — red or green
            # (the run-35157789388 lesson: first-red evidence must reach the
            # artifact, or the disposition has nothing to analyze)
            if [ -d gui-evidence ]; then
              if [ -d "gui-evidence-${focus}" ]; then
                cp -R gui-evidence/. "gui-evidence-${focus}/" || true
                rm -rf gui-evidence
              else
                mv gui-evidence "gui-evidence-${focus}"
              fi
            fi
            [ "$rc_all" -ne 0 ] && break
          done
          # provisional-mode marking (directive 2026-09-18 §3): evidence from an
          # in_progress source run is stamped before it can ever be mistaken
          # for accepted product evidence
          if [ "${PROVISIONAL}" = "true" ]; then
            for d in gui-evidence gui-evidence-*/; do
              [ -d "$d" ] || continue
              { echo "PROVISIONAL — AWAITING SOURCE PATIENT REGRESSION"
                echo ""
                echo "- shard: ${SHARD}"
                echo "- source run: ${SOURCE_RUN_ID} (still in_progress when this shard was dispatched — allow_in_progress_source=true)"
                echo "- frozen DMG SHA-256 (proved in-shard): ${FROZEN_DMG_SHA}"
                echo "- promotion rule: this evidence becomes ACCEPTED only if the source run later completes GREEN and used the SAME DMG SHA-256. A REAL product regression found by the source run blocks promotion and triggers targeted shard reruns after the fix; a D-class harness finding preserves this evidence."
              } > "$d/PROVISIONAL-MARKER.md"
            done
          fi
          exit "$rc_all"

      - name: Job summary — capability report
        if: always()
        shell: bash
        run: |
          for d in gui-evidence gui-evidence-*/; do
            [ -f "$d/qa-capability-report.md" ] || continue
            { echo "## Shard ${SHARD} (${d}) — capability report"; echo '```'; cat "$d/qa-capability-report.md"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Job summary — bug register
        if: always()
        shell: bash
        run: |
          for d in gui-evidence gui-evidence/*/; do
            [ -f "$d/BUG-REGISTER.md" ] || continue
            { echo "## Shard ${SHARD} — bug register (${d})"; echo '```'; cat "$d/BUG-REGISTER.md"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Job summary — provisional-mode banner
        if: always()
        shell: bash
        run: |
          if [ "${PROVISIONAL}" = "true" ]; then
            { echo "## PROVISIONAL — AWAITING SOURCE PATIENT REGRESSION"
              echo ""
              echo "Shard ${SHARD} ran against the immutable DMG (SHA-256 ${FROZEN_DMG_SHA}) of source run ${SOURCE_RUN_ID} while that run was still in_progress (allow_in_progress_source=true)."
              echo "Promote to ACCEPTED only if the source run completes GREEN at the SAME DMG SHA-256."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload shard evidence (always, directive §9 names)
        if: always()
        shell: bash
        env:
          ART: ${{ matrix.artifact }}
        run: |
          set -uo pipefail
          # the battery step renames gui-evidence -> gui-evidence-<focus> per
          # invocation (red or green); zip ALL focus dirs present into the
          # single §9 artifact for this job
          if ! ls -d gui-evidence-* >/dev/null 2>&1; then
            echo "(no focus evidence dir found — harness may have stopped before evidence; listing cwd)"
            ls -1 || true
          else
            for d in gui-evidence-*/; do
              [ -d "$d" ] || continue
              sub="${d#gui-evidence-}"; sub="${sub%/}"
              mkdir -p "staging/${sub}"
              cp -R "$d/." "staging/${sub}/" || true
            done
            (cd staging && zip -qr "$OLDPWD/qa-evidence-${ART}.zip" . ) || true
            echo "zipped $(ls -1 staging 2>/dev/null | tr '\n' ' ') -> qa-evidence-${ART}.zip"
          fi
          ls -1 qa-evidence-*.zip 2>/dev/null || echo "(no evidence zip this job)"

      - name: Upload shard evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ matrix.artifact }}
          retention-days: 14
          path: qa-evidence-${{ matrix.artifact }}.zip
          if-no-files-found: warn

  combined-gallery:
    name: "Combined post-run evidence gallery"
    needs: [validate-source, shard, prep-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all shard evidence (directive §9 artifact names)
        uses: actions/download-artifact@v4
        with:
          pattern: qa-evidence-*
          merge-multiple: false
          path: shards

      - name: Download sibling wave-run evidence (cross-shard aggregation)
        if: github.event.inputs.sibling_run_ids != ''
        shell: bash
        env:
          SIBLINGS: ${{ github.event.inputs.sibling_run_ids }}
        run: |
          set -euo pipefail
          for rid in $(printf '%s' "$SIBLINGS" | tr ',' ' '); do
            [ -n "$rid" ] || continue
            echo "pulling qa-evidence-* from sibling run $rid"
            # REST download of each qa-evidence-* artifact zip (expired/missing skipped)
            while read -r zid zname; do
              [ -n "$zid" ] || continue
              dest="shards/${zname}-sibling${rid}"
              mkdir -p "$dest"
              curl -sfL -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$zid/zip" -o "$dest/a.zip"
              (cd "$dest" && unzip -q a.zip && rm -f a.zip)
              echo "  staged $dest"
            done < <(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$rid/artifacts?per_page=100" \
                 | python3 -c "import json,sys; [print(a['id'], a['name']) for a in json.load(sys.stdin).get('artifacts',[]) if a['name'].startswith('qa-evidence-') and not a['expired']]")
          done
          ls -1 shards/ || true

      - name: Build the combined gallery (index.html + manifest + reports)
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          PARALLEL_RUN_ID: ${{ github.run_id }}
        run: bash macos/scripts/build-combined-gallery.sh

      - name: Stamp the provisional banner into the gallery (opt-in mode only)
        if: always() && needs.validate-source.outputs.provisional == 'true'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          set -euo pipefail
          [ -d combined-gallery ] || { echo "(no combined-gallery dir — nothing to stamp)"; exit 0; }
          { echo "# PROVISIONAL — AWAITING SOURCE PATIENT REGRESSION"
            echo ""
            echo "This wave was dispatched with allow_in_progress_source=true while source run ${SOURCE_RUN_ID} was still in_progress, against its already-built immutable DMG."
            echo "Promotion rule: every shard result below becomes ACCEPTED only when source run ${SOURCE_RUN_ID} completes GREEN and the DMG SHA-256 recorded in the shard evidence matches. A REAL product regression found by the source run blocks promotion and triggers targeted shard reruns after the fix."
          } > combined-gallery/PROVISIONAL-README.md
          if [ -f combined-gallery/index.html ]; then
            python3 - <<'PYEOF'
          import io
          p = "combined-gallery/index.html"
          html = io.open(p, encoding="utf-8").read()
          banner = ('<div style="background:#7c2d12;color:#fff;padding:12px 18px;font-weight:bold;'
                    'border-bottom:3px solid #c2410c">'
                    'PROVISIONAL — AWAITING SOURCE PATIENT REGRESSION '
                    '(source run still in_progress; promote only on source GREEN at the same DMG SHA-256)'
                    '</div>')
          if "PROVISIONAL" not in html:
              html = html.replace("<body>", "<body>" + banner, 1)
              io.open(p, "w", encoding="utf-8").write(html)
              print("index.html: provisional banner injected")
          else:
              print("index.html: already marked")
          PYEOF
          fi

      - name: Upload the combined gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-full-remaining-combined-gallery
          retention-days: 14
          path: combined-gallery/
          if-no-files-found: warn
