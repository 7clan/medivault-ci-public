        uses: actions/checkout@v4

      - name: Preflight — runner architecture proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          # cargo install tauri-cli provides the executable as `cargo-tauri`
          # (a cargo subcommand): invoke it as `cargo tauri ...`.
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      # ------------------------------------------------------------------
      # Frontend: the static export the WKWebView serves (frontendDist).
      # ------------------------------------------------------------------
      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      # ------------------------------------------------------------------
      # macOS app icon: tauri's bundler needs an .icns (the frozen icon set
      # has PNGs + .ico only — first-red run 34071656997: 'Failed to create
      # app icon: No matching IconType'). Generate it deterministically
      # from the committed PNGs with sips + iconutil.
      # ------------------------------------------------------------------
      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build (app bundle, per-arch)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/medivault-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/prisma-cli-stage"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # ------------------------------------------------------------------
      # Merge the backend into the TAURI-produced MediVault.app: the
      # desktop binary + Info.plist + icons stay; the supervisor, node
      # runtime, PG runtime, api, provision, prisma, config, plist are
      # added (stage-pg-bundle then stage-app-bundle — same frozen
      # contracts, applied to the Tauri bundle root).
      # ------------------------------------------------------------------
      - name: Merge the backend into the Tauri MediVault.app
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/tauri-app.env
          . /tmp/node-tarball.env
          . /tmp/api-stage.env
          . /tmp/prisma-stage.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            bash macos/scripts/stage-app-bundle.sh

          cat > "$APP/Contents/Resources/supervisor-config.json" <<EOF
          {
            "version": 1,
            "paths": {
              "pg_bundle": "$APP/Contents/Resources/runtime/postgresql/17",
              "node_binary": "$APP/Contents/Resources/runtime/nodejs/bin/node",
              "api_entry": "$APP/Contents/Resources/api/dist/index.js",
              "api_working_dir": "$APP/Contents/Resources/api",
              "app_support_dir": "$MV_APP_SUPPORT",
              "log_dir": "$MV_APP_SUPPORT/logs"
            },
            "postgres": {
              "host": "127.0.0.1",
              "port": $MV_PGPORT,
              "superuser": "postgres",
              "app_user": "medivault",
              "app_database": "medivault",
              "pgdata_rel": "PostgreSQL/17/data"
            },
            "api": { "host": "127.0.0.1", "port": $MV_API_PORT, "allowed_origins": "http://localhost:3000" },
            "secrets": { "source": "keychain" },
            "provisioner": {
              "entry": "$APP/Contents/Resources/provision/dist/index.js",
              "prisma_cli": "$APP/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js",
              "prisma_schema": "$APP/Contents/Resources/prisma/schema.prisma",
              "timeout_sec": 600
            },
            "limits": { "pg_start_timeout_sec": 120, "api_start_timeout_sec": 90, "health_interval_sec": 5 }
          }
          EOF
          echo "APP_ROOT=$APP" | tee /tmp/app-root.env
          echo "--- merged bundle (top level):"
          find "$APP" -maxdepth 3 -not -path "*/runtime/postgresql/17/*" | sed "s|$APP|<APP>|" | sort | sed -n '1,40p'
          echo "bundle size: $(du -sh "$APP" | cut -f1)"

      - name: Ad-hoc codesign + Mach-O gates (desktop, supervisor, node, PG)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          codesign --force --sign - "$APP/Contents/MacOS/MediVault"
          codesign --verify --strict "$APP/Contents/MacOS/MediVault"
          bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      # ------------------------------------------------------------------
      # DMG construction + verification (macos/scripts/build-dmg.sh):
      # hdiutil UDZO + drag layout + ad-hoc sign + mount/layout/sign checks.
      # ------------------------------------------------------------------
      - name: Build + verify the DMG
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          DMG_OUT="$RUNNER_TEMP/MediVault-macOS-${{ matrix.label }}.dmg"
          APP_ROOT="$APP" DMG_OUT="$DMG_OUT" bash macos/scripts/build-dmg.sh
          echo "DMG_OUT=$DMG_OUT" | tee /tmp/dmg.env
          test -f "$DMG_OUT.sha256"

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pkill -f 'MediVault.app/Contents/MacOS/MediVault' 2>/dev/null || true
          d="/Users/runner/work/_temp/mv-desktop/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            pg_ctl -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/macho-gate-records.txt
            /tmp/tauri-build.log
            /Users/runner/work/_temp/MediVault-macOS-${{ matrix.label }}.dmg.sha256
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # macos-26-smoke — Stage 6: the frozen product contracts re-run on the
  # newest macOS (Tahoe) on NATIVE public runners (no Rosetta).
  #
  # Lane order: integration (FROZEN) -> pg-bundle-verify (FROZEN) ->
  # supervisor-lifecycle (FROZEN) -> provision-lifecycle (FROZEN) ->
  # bundle-verify (FROZEN) -> desktop-build (FROZEN) -> dmg (FROZEN) ->
  # THIS JOB -> reinstall-acceptance.
  #
  # COMPATIBILITY VALIDATION ONLY: the dmg pipeline re-runs UNCHANGED (same
  # steps, same pinned versions, same dt13 PG cache keys — the frozen
  # macos-15-built artifacts run on Tahoe), plus the app-copy extraction
  # proof and the full supervisor lifecycle FROM THE INSTALLED APP. No
  # product changes for newer SDKs; every Mach-O gate re-validates on
  # macOS 26 (native arch, minOS <= 13.0, deps /usr/lib+/System only).
  # Contract: acceptance/macos-26-smoke-contract.md.
  # ---------------------------------------------------------------------------
  macos-26-smoke:
    name: "macos-26-smoke (${{ matrix.label }})"
    if: github.event.inputs.mode == 'macos-26-smoke'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'
      MV_APP_SUPPORT: '/Users/runner/work/_temp/mv-26smoke'
      MV_PGPORT: '55441'
      MV_API_PORT: '4583'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native runner architecture + macOS 26 proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion) ($(sw_vers -productName) $(sw_vers -buildVersion))"
          case "$(sw_vers -productVersion)" in
            26*) echo "runner OS is macOS 26 (Tahoe)" ;;
            *) echo "::error::expected macOS 26 on label ${{ matrix.runner }}, got $(sw_vers -productVersion)"; exit 1 ;;
          esac
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            # Native Apple Silicon: 0 = not running under Rosetta.
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          else
            echo "Intel lane: uname x86_64 is itself the native proof (no Rosetta on Intel)"
          fi
          echo "Xcode toolchain: $(xcodebuild -version 2>/dev/null | tr '\n' ' ')"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build (app bundle, per-arch)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/medivault-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/prisma-cli-stage"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Merge the backend into the Tauri MediVault.app
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/tauri-app.env
          . /tmp/node-tarball.env
          . /tmp/api-stage.env
          . /tmp/prisma-stage.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            bash macos/scripts/stage-app-bundle.sh

          cat > "$APP/Contents/Resources/supervisor-config.json" <<EOF
          {
            "version": 1,
            "paths": {
              "pg_bundle": "$APP/Contents/Resources/runtime/postgresql/17",
              "node_binary": "$APP/Contents/Resources/runtime/nodejs/bin/node",
              "api_entry": "$APP/Contents/Resources/api/dist/index.js",
              "api_working_dir": "$APP/Contents/Resources/api",
              "app_support_dir": "$MV_APP_SUPPORT",
              "log_dir": "$MV_APP_SUPPORT/logs"
            },
            "postgres": {
              "host": "127.0.0.1",
              "port": $MV_PGPORT,
              "superuser": "postgres",
              "app_user": "medivault",
              "app_database": "medivault",
              "pgdata_rel": "PostgreSQL/17/data"
            },
            "api": { "host": "127.0.0.1", "port": $MV_API_PORT, "allowed_origins": "http://localhost:3000" },
            "secrets": { "source": "keychain" },
            "provisioner": {
              "entry": "$APP/Contents/Resources/provision/dist/index.js",
              "prisma_cli": "$APP/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js",
              "prisma_schema": "$APP/Contents/Resources/prisma/schema.prisma",
              "timeout_sec": 600
            },
            "limits": { "pg_start_timeout_sec": 120, "api_start_timeout_sec": 90, "health_interval_sec": 5 }
          }
          EOF
          echo "APP_ROOT=$APP" | tee /tmp/app-root.env
          echo "bundle size: $(du -sh "$APP" | cut -f1)"

      - name: Ad-hoc codesign + Mach-O gates (desktop, supervisor, node, PG)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          codesign --force --sign - "$APP/Contents/MacOS/MediVault"
          codesign --verify --strict "$APP/Contents/MacOS/MediVault"
          MACHO_RECORDS=/tmp/macho-gate-26-1.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-26-2.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-26-3.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-26-4.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0
          cat /tmp/macho-gate-26-*.txt > /tmp/macho-gate-records.txt

      - name: Build + verify the DMG
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          DMG_OUT="$RUNNER_TEMP/MediVault-macos26-${{ matrix.label }}.dmg"
          APP_ROOT="$APP" DMG_OUT="$DMG_OUT" bash macos/scripts/build-dmg.sh
          echo "DMG_OUT=$DMG_OUT" | tee /tmp/dmg.env
          test -f "$DMG_OUT.sha256"

      # ------------------------------------------------------------------
      # macOS-26-SPECIFIC PROOFS beyond the frozen dmg mode.
      # ------------------------------------------------------------------

      - name: Generate CI keychain seed values (values never printed)
        shell: bash
        run: |
          set -euo pipefail
          # CI-only test credentials, seeded INTO the runner login keychain
          # by the supervisor's own bootstrap-secrets (proven SecItemAdd
          # path; shape-validated by the supervisor). Needed so the smoke
          # can additionally prove an INDEPENDENT authenticated SELECT 1
          # from the harness. Values are never echoed, never uploaded;
          # the runner is ephemeral. A doctor machine never sets these.
          {
            echo "export MV_KEYCHAIN_SEED_PG_APP_PASSWORD=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_PG_BOOTSTRAP=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_MASTER_KEY=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_JWT_SECRET=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_CSRF_SECRET=$(openssl rand -hex 32)"
          } > /tmp/26-seeds.env
          chmod 600 /tmp/26-seeds.env
          echo "seed file written (values never printed): /tmp/26-seeds.env"

      - name: Install the app from the mounted DMG (copy/extraction proof)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/dmg.env
          MOUNT="$(mktemp -d /tmp/mv-26-mount.XXXXXX)"
          hdiutil attach "$DMG_OUT" -mountpoint "$MOUNT" -nobrowse -readonly
          test -x "$MOUNT/MediVault.app/Contents/MacOS/MediVault"
          INSTALLED="$RUNNER_TEMP/MediVault-installed.app"
          rm -rf "$INSTALLED"
          cp -R "$MOUNT/MediVault.app" "$INSTALLED"
          hdiutil detach "$MOUNT" -force >/dev/null
          echo "INSTALLED=$INSTALLED" | tee /tmp/26-installed.env
          echo "installed app size: $(du -sh "$INSTALLED" | cut -f1)"
          # The copied tree must remain a valid ad-hoc-signed bundle with
          # native Mach-O on macOS 26 (same gate family as the build tree).
          codesign --verify --strict "$INSTALLED"
          codesign --verify --strict "$INSTALLED/Contents/MacOS/MediVault"
          codesign --verify --strict "$INSTALLED/Contents/MacOS/mediavault-supervisor"
          MACHO_RECORDS=/tmp/macho-gate-26-5.txt bash macos/scripts/macho-gate.sh "$INSTALLED/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-26-6.txt bash macos/scripts/macho-gate.sh "$INSTALLED/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-26-7.txt bash macos/scripts/macho-gate.sh "$INSTALLED/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-26-8.txt bash macos/scripts/macho-gate.sh "$INSTALLED/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0
          cat /tmp/macho-gate-26-*.txt > /tmp/macho-gate-records.txt
          echo "app version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INSTALLED/Contents/Info.plist" 2>/dev/null || echo '?')"

      - name: Re-point the installed app config (smoke app-support)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/26-installed.env
          python3 - "$INSTALLED/Contents/Resources/supervisor-config.json" "$INSTALLED" <<'PYEOF'
          import json, sys
          path, new_root = sys.argv[1], sys.argv[2]
          cfg = json.load(open(path))
          cfg["paths"]["pg_bundle"] = f"{new_root}/Contents/Resources/runtime/postgresql/17"
          cfg["paths"]["node_binary"] = f"{new_root}/Contents/Resources/runtime/nodejs/bin/node"
          cfg["paths"]["api_entry"] = f"{new_root}/Contents/Resources/api/dist/index.js"
          cfg["paths"]["api_working_dir"] = f"{new_root}/Contents/Resources/api"
          cfg["provisioner"]["entry"] = f"{new_root}/Contents/Resources/provision/dist/index.js"
          cfg["provisioner"]["prisma_cli"] = f"{new_root}/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js"
          cfg["provisioner"]["prisma_schema"] = f"{new_root}/Contents/Resources/prisma/schema.prisma"
          json.dump(cfg, open(path, "w"), indent=2)
          PYEOF
          CONFIG="$INSTALLED/Contents/Resources/supervisor-config.json"
          echo "CONFIG=$CONFIG" | tee /tmp/26-config.env
          cat "$CONFIG"

      - name: Keychain bootstrap (seeded CI values, REAL login keychain)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/26-config.env
          . /tmp/26-installed.env
          . /tmp/26-seeds.env
          rm -f /tmp/26-bootstrap-1.log /tmp/26-bootstrap-2.log
          "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets --config "$CONFIG" | tee /tmp/26-bootstrap-1.log
          [ "$(grep -c 'created keychain item' /tmp/26-bootstrap-1.log)" = "5" ] || {
            echo "::error::expected 5 created items (seeded first bootstrap)"; exit 1
          }
          # Idempotence: a second bootstrap must NEVER overwrite (the
          # no-overwrite contract — KEYCHAIN material stability).
          "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets --config "$CONFIG" | tee /tmp/26-bootstrap-2.log
          [ "$(grep -c 'already present' /tmp/26-bootstrap-2.log)" = "5" ] || {
            echo "::error::expected 5 already-present items (idempotence)"; exit 1
          }
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security find-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || {
              echo "::error::keychain item missing: $account"; exit 1
            }
          done
          echo "keychain: 5/5 items present on macOS 26 (existence-level proof; values never printed)"

      - name: Supervisor lifecycle from the installed app (CLEAN bootstrap to healthy)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/26-config.env
          . /tmp/26-installed.env
          . /tmp/26-seeds.env
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          rm -rf "$MV_APP_SUPPORT"
          rm -f /tmp/26-supervisor.exit
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" run --config "$CONFIG" \
              > "$RUNNER_TEMP/smoke-supervisor-stdout.log" 2>&1; echo $? > /tmp/26-supervisor.exit ) &

          echo "[poll] bounded wait (300s) for healthy on macOS 26"
          HEALTHY=0
          for i in $(seq 1 600); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            if [ "$S" = "failed" ]; then break; fi
            if [ -f /tmp/26-supervisor.exit ]; then break; fi
            sleep 0.5
          done
          echo "final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::installed app did not reach healthy on macOS 26"
            echo "--- supervisor.log:"; tail -30 "$MV_APP_SUPPORT/logs/supervisor.log" 2>/dev/null || true
            echo "--- provision.log:"; tail -30 "$MV_APP_SUPPORT/logs/provision.log" 2>/dev/null || true
            echo "--- supervisor-stdout.log:"; tail -40 "$RUNNER_TEMP/smoke-supervisor-stdout.log" 2>/dev/null || true
            exit 1
          fi

          PGBIN="$INSTALLED/Contents/Resources/runtime/postgresql/17/bin"
          echo "[proof] bundled PG starts + pg_isready (independent probe)"
          "$PGBIN/pg_isready" -h 127.0.0.1 -p "$MV_PGPORT"
          echo "[proof] authenticated SELECT 1 as the app role (independent probe, seeded credential)"
          ONE=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -t -A -c "SELECT 1")
          [ "$ONE" = "1" ] || { echo "::error::authenticated SELECT 1 failed on macOS 26"; exit 1; }
          echo "[proof] existing migrations/schema deployed through the packaged prisma closure"
          MIG=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -t -A -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          echo "applied migrations: $MIG (expect 8)"
          [ "$MIG" = "8" ] || { echo "::error::expected 8 applied migrations on macOS 26"; exit 1; }

          echo "[proof] the API runs on the PACKAGED node binary"
          pgrep -f "$INSTALLED/Contents/Resources/runtime/nodejs/bin/node" >/dev/null || {
            echo "::error::the API is not running on the packaged node binary"; exit 1
          }
          echo "[api] /health + /ready on macOS 26"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$MV_API_PORT/health" || echo 000)
          echo "/health -> $CODE"; test "$CODE" = "200"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$MV_API_PORT/ready" || echo 000)
          echo "/ready -> $CODE"; test "$CODE" = "200"
          test -f "$MV_APP_SUPPORT/config/provisioned.json"
          echo "provisioned marker present: $(jq -c '{pgMajor, appUser, appDatabase}' "$MV_APP_SUPPORT/config/provisioned.json")"

          echo "[shutdown] graceful SIGTERM ladder + zero owned orphans"
          kill -TERM "$(jq -r .pid "$STATUS")"
          for i in $(seq 1 180); do [ -f /tmp/26-supervisor.exit ] && break; sleep 0.5; done
          EXIT_CODE=$(cat /tmp/26-supervisor.exit 2>/dev/null || echo MISSING)
          echo "supervisor exit code: $EXIT_CODE"
          [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor did not exit 0 on macOS 26"; exit 1; }
          [ "$(jq -r .state "$STATUS")" = "stopped" ] || { echo "::error::status not stopped"; exit 1; }
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] || { echo "::error::orphans: $LEFT"; exit 1; }
          test ! -e "$MV_APP_SUPPORT/PostgreSQL/17/data/postmaster.pid"
          echo "26-SMOKE-LIFECYCLE-GREEN"

      - name: Launch smoke — the desktop binary from the INSTALLED app
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/26-installed.env
          rm -f /tmp/26-desktop.exit
          ( "$INSTALLED/Contents/MacOS/MediVault" > /tmp/26-desktop.log 2>&1; echo $? > /tmp/26-desktop.exit ) &
          DESKTOP_PID=$!
          echo "desktop pid: $DESKTOP_PID"
          sleep 15
          if ! kill -0 "$DESKTOP_PID" 2>/dev/null; then
            echo "::error::desktop binary did not stay alive for 15s on macOS 26"
            echo "--- desktop.log:"; tail -40 /tmp/26-desktop.log 2>/dev/null || true
            exit 1
          fi
          echo "alive after 15s: yes"
          ps -p "$DESKTOP_PID" -o pid,etime,comm
          echo "--- desktop.log (first 20 lines):"
          sed -n '1,20p' /tmp/26-desktop.log 2>/dev/null || true
          kill -TERM "$DESKTOP_PID"
          EXITED=0
          for i in $(seq 1 30); do
            [ -f /tmp/26-desktop.exit ] && { EXITED=1; break; }
            sleep 1
          done
          if [ "$EXITED" != "1" ]; then
            echo "::warning::desktop did not exit within 30s of SIGTERM — hard-stopping for the sweep"
            kill -9 "$DESKTOP_PID" 2>/dev/null || true
          else
            echo "desktop exited after SIGTERM (code $(cat /tmp/26-desktop.exit))"
          fi
          echo "26-LAUNCH-SMOKE-GREEN (binary starts, stays alive, terminates)"

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ -f /tmp/26-installed.env ]; then
            . /tmp/26-installed.env
            pkill -f "$INSTALLED/Contents/MacOS/MediVault" 2>/dev/null || true
          fi
          pkill -f 'MediVault-installed.app/Contents/MacOS/MediVault' 2>/dev/null || true
          d="/Users/runner/work/_temp/mv-26smoke/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            /Users/runner/work/_temp/MediVault-installed.app/Contents/Resources/runtime/postgresql/17/bin/pg_ctl -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-26-smoke-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/macho-gate-records.txt
            /tmp/tauri-build.log
            /tmp/26-bootstrap-1.log
            /tmp/26-bootstrap-2.log
            /tmp/26-desktop.log
            /tmp/26-desktop.exit
            /Users/runner/work/_temp/mv-26smoke/logs/
            /Users/runner/work/_temp/smoke-supervisor-stdout.log
            /Users/runner/work/_temp/MediVault-macos26-${{ matrix.label }}.dmg.sha256
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # reinstall-acceptance — Stage 7: the reinstall/uninstall acceptance matrix
  # on NATIVE macOS 26 runners (both arches), using the ACTUAL .app and .dmg
  # artifacts (never target/debug binaries).
  #
  # Cases (contract: acceptance/macos-reinstall-contract.md):
  #   1. FRESH INSTALL   — mount DMG A (v0.1.0) -> per-user install ->
  #      first-run provisioning (keychain bootstrap, CLEAN delegation) ->
  #      PG healthy + /health + /ready -> synthetic DB sentinel created.
  #   2. APP RESTART     — VALID_EXISTING; sentinel persists; cluster NOT
  #      re-initialized (PG_VERSION sha + provisioned createdAt unchanged).
  #   3. APP REPLACEMENT — graceful stop -> build B (CFBundleVersion 0.1.1,
  #      newly built) -> replace the app -> reconcile/migrate from the NEW
  #      app's packaged provisioner -> supervisor healthy -> sentinel
  #      present; Application Support, Logs and Keychain PRESERVED.
  #   4. RECOVERY        — RECOVERABLE_INCOMPLETE resumes exactly (sentinel
  #      + PG_VERSION preserved); INCOMPLETE_EXISTING fails CLOSED with
  #      nothing altered (two flavors: pending+unexpected state, valid
  #      cluster without the trust anchor); stale pending marker
  #      reconciles to VALID. All driven from the INSTALLED app's packaged
  #      provisioner (the frozen provision-lifecycle pattern, at the app
  #      level). A valid database is NEVER destroyed as a shortcut.
  #   5. UNINSTALL       — remove the app only; Application Support, PG
  #      cluster, logs and keychain items PRESERVED; sentinel row proven
  #      by starting the preserved cluster with the reference PG runtime.
  #   +. PROCESS SAFETY  — unrelated postgres/pg_ctl/node processes planted
  #      up front must survive EVERY stop/restart cycle (owned-process
  #      rules only; never kill by executable name).
  # ---------------------------------------------------------------------------
  reinstall-acceptance:
    name: "reinstall-acceptance (${{ matrix.label }})"
    if: github.event.inputs.mode == 'reinstall-acceptance'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'
      MV_APP_SUPPORT: '/Users/runner/Library/Application Support/MediVault'
      MV_LOG_DIR: '/Users/runner/Library/Logs/MediVault'
      MV_INSTALL_APP: '/Users/runner/Applications/MediVault.app'
      MV_PGPORT: '55451'
      MV_API_PORT: '4593'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native runner architecture + macOS 26 proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion) ($(sw_vers -productName) $(sw_vers -buildVersion))"
          case "$(sw_vers -productVersion)" in
            26*) echo "runner OS is macOS 26 (Tahoe)" ;;
            *) echo "::error::expected macOS 26 on label ${{ matrix.runner }}, got $(sw_vers -productVersion)"; exit 1 ;;
          esac
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build A (app bundle v0.1.0, per-arch)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/medivault-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/prisma-cli-stage"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Merge the backend into the Tauri MediVault.app (build A)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/tauri-app.env
          . /tmp/node-tarball.env
          . /tmp/api-stage.env
          . /tmp/prisma-stage.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            bash macos/scripts/stage-app-bundle.sh

          cat > "$APP/Contents/Resources/supervisor-config.json" <<EOF
          {
            "version": 1,
            "paths": {
              "pg_bundle": "$APP/Contents/Resources/runtime/postgresql/17",
              "node_binary": "$APP/Contents/Resources/runtime/nodejs/bin/node",
              "api_entry": "$APP/Contents/Resources/api/dist/index.js",
              "api_working_dir": "$APP/Contents/Resources/api",
              "app_support_dir": "$MV_APP_SUPPORT",
              "log_dir": "$MV_LOG_DIR"
            },
            "postgres": {
              "host": "127.0.0.1",
              "port": $MV_PGPORT,
              "superuser": "postgres",
              "app_user": "medivault",
              "app_database": "medivault",
              "pgdata_rel": "PostgreSQL/17/data"
            },
            "api": { "host": "127.0.0.1", "port": $MV_API_PORT, "allowed_origins": "http://localhost:3000" },
            "secrets": { "source": "keychain" },
            "provisioner": {
              "entry": "$APP/Contents/Resources/provision/dist/index.js",
              "prisma_cli": "$APP/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js",
              "prisma_schema": "$APP/Contents/Resources/prisma/schema.prisma",
              "timeout_sec": 600
            },
            "limits": { "pg_start_timeout_sec": 120, "api_start_timeout_sec": 90, "health_interval_sec": 5 }
          }
          EOF
          echo "APP_ROOT=$APP" | tee /tmp/app-root.env
          echo "bundle size: $(du -sh "$APP" | cut -f1)"

      - name: Ad-hoc codesign + Mach-O gates (build A)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          codesign --force --sign - "$APP/Contents/MacOS/MediVault"
          codesign --verify --strict "$APP/Contents/MacOS/MediVault"
          MACHO_RECORDS=/tmp/macho-gate-r7-a3.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-a4.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-a5.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-a6.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      - name: Build + verify DMG A (v0.1.0)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          DMG_A="$RUNNER_TEMP/MediVault-A-${{ matrix.label }}.dmg"
          APP_ROOT="$APP" DMG_OUT="$DMG_A" bash macos/scripts/build-dmg.sh
          echo "DMG_A=$DMG_A" | tee /tmp/dmg-a.env
          test -f "$DMG_A.sha256"

      - name: Write the r7 helper library (shared case functions)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/r7-lib.sh <<'LIBEOF'
          # r7-lib.sh — shared helpers for the reinstall/uninstall acceptance
          # matrix. No secret VALUES are ever printed by these helpers.
          r7_status() { jq -r '.state // "none"' "$1" 2>/dev/null || echo none; }

          r7_wait_healthy() { # $1 status file, $2 exit file, $3 max half-seconds (default 900)
            local STATUS="$1" EXITF="$2" MAX="${3:-900}" I S
            for I in $(seq 1 "$MAX"); do
              S=$(r7_status "$STATUS")
              if [ "$S" = "healthy" ]; then return 0; fi
              if [ "$S" = "failed" ] || [ -f "$EXITF" ]; then return 1; fi
              sleep 0.5
            done
            return 1
          }

          r7_run_supervisor() { # $1 config, $2 exit file, $3 log tag
            local CONFIG="$1" EXITF="$2" TAG="${3:-case}"
            rm -f "$EXITF"
            ( "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor" run --config "$CONFIG" \
                > "$RUNNER_TEMP/r7-supervisor-$TAG.log" 2>&1; echo $? > "$EXITF" ) &
          }

          r7_graceful_stop() { # $1 status file, $2 exit file
            local STATUS="$1" EXITF="$2" I EXIT_CODE LEFT
            kill -TERM "$(jq -r .pid "$STATUS")" 2>/dev/null || true
            for I in $(seq 1 180); do [ -f "$EXITF" ] && break; sleep 0.5; done
            EXIT_CODE=$(cat "$EXITF" 2>/dev/null || echo MISSING)
            echo "  supervisor exit code: $EXIT_CODE"
            [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor exit $EXIT_CODE (expected 0)"; return 1; }
            [ "$(r7_status "$STATUS")" = "stopped" ] || { echo "::error::status not stopped"; return 1; }
            LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
            [ -z "$LEFT" ] || { echo "::error::orphan postgres: $LEFT"; return 1; }
            echo "  graceful stop: exit 0, state stopped, zero orphans"
            return 0
          }

          r7_plants_alive() {
            local BAD=0 f PID
            for f in /tmp/r7-plant-pg.pid /tmp/r7-plant-ctl.pid /tmp/r7-plant-node.pid; do
              [ -f "$f" ] || continue
              PID="$(cat "$f")"
              if kill -0 "$PID" 2>/dev/null; then
                echo "  unrelated process alive: $PID ($(ps -p "$PID" -o comm= | tr -d ' '))"
              else
                echo "::error::unrelated process $PID ($f) was killed — process-safety violation"
                BAD=1
              fi
            done
            [ "$BAD" = "0" ]
          }

          r7_sentinel_count() { # $1 psql bin dir, $2 sentinel id; reads the seeded app password from env
            PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$1/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -t -A \
              -c "SELECT count(*) FROM ci_reinstall_sentinel WHERE id = '$2'"
          }

          r7_api_probe() {
            local CODE
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$MV_API_PORT/health" || echo 000)
            echo "  /health -> $CODE"; [ "$CODE" = "200" ] || return 1
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$MV_API_PORT/ready" || echo 000)
            echo "  /ready -> $CODE"; [ "$CODE" = "200" ] || return 1
            return 0
          }

          r7_summary() { echo "$*" | tee -a /tmp/r7-summary.txt; }
          LIBEOF
          bash -n /tmp/r7-lib.sh
          echo "r7-lib.sh written + syntax-checked"

      - name: Plant unrelated control processes (naive-kill witnesses)
        shell: bash
        run: |
          set -euo pipefail
          # Unrelated processes whose NAMES match our managed executables.
          # If any flow in this job ever killed by executable NAME (naive
          # pkill postgres / pkill node / pkill pg_ctl), these would die and
          # r7_plants_alive would fail the job. Our contract: only
          # MediVault-owned PIDs/process trees/canonical paths are stopped.
          mkdir -p /tmp/r7-unrelated
          cp /bin/sleep /tmp/r7-unrelated/postgres
          cp /bin/sleep /tmp/r7-unrelated/pg_ctl
          /tmp/r7-unrelated/postgres 4321 &
          echo $! > /tmp/r7-plant-pg.pid
          /tmp/r7-unrelated/pg_ctl 4322 &
          echo $! > /tmp/r7-plant-ctl.pid
          node -e 'setInterval(function(){}, 60000)' &
          echo $! > /tmp/r7-plant-node.pid
          sleep 1
          ps -p "$(cat /tmp/r7-plant-pg.pid)" -p "$(cat /tmp/r7-plant-ctl.pid)" -p "$(cat /tmp/r7-plant-node.pid)" -o pid,comm
          echo "plants recorded (pids in /tmp/r7-plant-*.pid)"

      - name: Generate CI keychain seed values (values never printed)
        shell: bash
        run: |
          set -euo pipefail
          # CI-only test credentials, seeded INTO the runner login keychain by
          # the supervisor's own bootstrap-secrets (proven SecItemAdd path,
          # shape-validated). They let the harness create/verify the DB
          # sentinel and drive the provisioner directly. Never echoed, never
          # uploaded; the runner is ephemeral; doctor machines never set them.
          {
            echo "export MV_KEYCHAIN_SEED_PG_APP_PASSWORD=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_PG_BOOTSTRAP=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_MASTER_KEY=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_JWT_SECRET=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_CSRF_SECRET=$(openssl rand -hex 32)"
          } > /tmp/r7-seeds.env
          chmod 600 /tmp/r7-seeds.env
          echo "seed file written (values never printed): /tmp/r7-seeds.env"
          rm -f /tmp/r7-summary.txt
          touch /tmp/r7-summary.txt

      - name: "CASE 1 — FRESH INSTALL: mount DMG A, install, first-run provisioning, sentinel"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/dmg-a.env
          SENTINEL_ID="CI_REINSTALL_SENTINEL_${GITHUB_RUN_ID}_${{ matrix.label }}_$(date +%s)"
          echo "SENTINEL_ID=$SENTINEL_ID" > /tmp/r7-sentinel.env
          r7_summary "SENTINEL ID: $SENTINEL_ID"

          echo "[1.1] mount DMG A and install to ~/Applications (per-user install)"
          rm -rf "$MV_INSTALL_APP"
          mkdir -p "$(dirname "$MV_INSTALL_APP")"
          MOUNT="$(mktemp -d /tmp/mv-r7-mount-a.XXXXXX)"
          hdiutil attach "$DMG_A" -mountpoint "$MOUNT" -nobrowse -readonly
          test -x "$MOUNT/MediVault.app/Contents/MacOS/MediVault"
          cp -R "$MOUNT/MediVault.app" "$MV_INSTALL_APP"
          hdiutil detach "$MOUNT" -force >/dev/null
          rmdir "$MOUNT" 2>/dev/null || true
          codesign --verify --strict "$MV_INSTALL_APP"
          codesign --verify --strict "$MV_INSTALL_APP/Contents/MacOS/MediVault"
          codesign --verify --strict "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor"
          VER_A="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MV_INSTALL_APP/Contents/Info.plist")"
          echo "installed version: $VER_A (expect 0.1.0)"
          [ "$VER_A" = "0.1.0" ] || { echo "::error::unexpected version $VER_A"; exit 1; }
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          MACHO_RECORDS=/tmp/macho-gate-r7-b1.txt bash macos/scripts/macho-gate.sh "$MV_INSTALL_APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-b2.txt bash macos/scripts/macho-gate.sh "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          r7_summary "FRESH INSTALL: GREEN (v0.1.0 from DMG A, ad-hoc signature + Mach-O gates pass)"

          echo "[1.2] re-point the installed config to the REAL user data paths"
          CONFIG="$MV_INSTALL_APP/Contents/Resources/supervisor-config.json"
          python3 - "$CONFIG" "$MV_INSTALL_APP" <<'PYEOF'
          import json, sys
          path, new_root = sys.argv[1], sys.argv[2]
          cfg = json.load(open(path))
          cfg["paths"]["pg_bundle"] = f"{new_root}/Contents/Resources/runtime/postgresql/17"
          cfg["paths"]["node_binary"] = f"{new_root}/Contents/Resources/runtime/nodejs/bin/node"
          cfg["paths"]["api_entry"] = f"{new_root}/Contents/Resources/api/dist/index.js"
          cfg["paths"]["api_working_dir"] = f"{new_root}/Contents/Resources/api"
          cfg["provisioner"]["entry"] = f"{new_root}/Contents/Resources/provision/dist/index.js"
          cfg["provisioner"]["prisma_cli"] = f"{new_root}/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js"
          cfg["provisioner"]["prisma_schema"] = f"{new_root}/Contents/Resources/prisma/schema.prisma"
          json.dump(cfg, open(path, "w"), indent=2)
          PYEOF
          echo "CONFIG=$CONFIG" | tee /tmp/r7-config.env
          cat "$CONFIG"

          echo "[1.3] fresh simulated user state (no Application Support, no logs)"
          rm -rf "$MV_APP_SUPPORT" "$MV_LOG_DIR"
          test ! -e "$MV_APP_SUPPORT"

          echo "[1.4] keychain bootstrap (seeded CI values, REAL login keychain)"
          "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor" bootstrap-secrets --config "$CONFIG" | tee /tmp/r7-bootstrap-1.log
          [ "$(grep -c 'created keychain item' /tmp/r7-bootstrap-1.log)" = "5" ] || {
            echo "::error::expected 5 created items"; exit 1
          }
          "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor" bootstrap-secrets --config "$CONFIG" | tee /tmp/r7-bootstrap-2.log
          [ "$(grep -c 'already present' /tmp/r7-bootstrap-2.log)" = "5" ] || {
            echo "::error::expected 5 already-present items (no-overwrite)"; exit 1
          }
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security find-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || {
              echo "::error::keychain item missing: $account"; exit 1
            }
          done
          r7_summary "KEYCHAIN BOOTSTRAP: GREEN (5 created; no-overwrite idempotence 5/5)"

          echo "[1.5] first-run provisioning through the supervisor (CLEAN delegation)"
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          EXITF=/tmp/r7-case1.exit
          r7_run_supervisor "$CONFIG" "$EXITF" case1
          if ! r7_wait_healthy "$STATUS" "$EXITF" 900; then
            echo "::error::CASE 1: first-run provisioning did not reach healthy"
            echo "--- supervisor.log:"; tail -30 "$MV_LOG_DIR/supervisor.log" 2>/dev/null || true
            echo "--- provision.log:"; tail -30 "$MV_LOG_DIR/provision.log" 2>/dev/null || true
            echo "--- stdout:"; tail -40 "$RUNNER_TEMP/r7-supervisor-case1.log" 2>/dev/null || true
            exit 1
          fi
          echo "  state: $(r7_status "$STATUS")"
          r7_summary "FIRST-RUN PROVISIONING: GREEN (delegated CLEAN bootstrap to healthy)"

          echo "[1.6] PG + API probes"
          "$PGBIN/pg_isready" -h 127.0.0.1 -p "$MV_PGPORT"
          ONE=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -t -A -c "SELECT 1")
          [ "$ONE" = "1" ] || { echo "::error::authenticated SELECT 1 failed"; exit 1; }
          pgrep -f "$MV_INSTALL_APP/Contents/Resources/runtime/nodejs/bin/node" >/dev/null || {
            echo "::error::API not running on the packaged node"; exit 1
          }
          r7_api_probe
          r7_summary "PG HEALTHY: GREEN" "API /health + /ready: GREEN"

          echo "[1.7] create the synthetic DB sentinel"
          PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -v ON_ERROR_STOP=1 <<SQL
          CREATE TABLE ci_reinstall_sentinel (id TEXT PRIMARY KEY, created_at TIMESTAMPTZ NOT NULL DEFAULT now());
          INSERT INTO ci_reinstall_sentinel (id) VALUES ('$SENTINEL_ID');
          SQL
          CNT=$(r7_sentinel_count "$PGBIN" "$SENTINEL_ID")
          echo "  sentinel rows: $CNT (expect 1)"
          [ "$CNT" = "1" ] || { echo "::error::sentinel not created"; exit 1; }
          r7_summary "SENTINEL CREATED: YES"

          echo "[1.8] capture preservation witnesses"
          PGDATA="$MV_APP_SUPPORT/PostgreSQL/17/data"
          shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}' | tee /tmp/r7-pgversion.sha
          jq -r .createdAt "$MV_APP_SUPPORT/config/provisioned.json" | tee /tmp/r7-provisioned-created.txt
          echo "  initdb occurrences in provision.log so far: $(grep -c 'initdb' "$MV_LOG_DIR/provision.log" 2>/dev/null || echo 0)"
          (grep -c 'initdb' "$MV_LOG_DIR/provision.log" 2>/dev/null || echo 0) > /tmp/r7-initdb-count.txt
          shasum -a 256 "$MV_LOG_DIR/provision.log" | awk '{print $1}' | tee /tmp/r7-provisionlog.sha

          echo "[1.9] close/stop the app (graceful ladder)"
          r7_graceful_stop "$STATUS" "$EXITF"
          test ! -e "$PGDATA/postmaster.pid"
          r7_plants_alive
          r7_summary "APP STOP: GREEN (graceful exit 0, zero orphans)"

      - name: "CASE 2 — APP RESTART: VALID_EXISTING, sentinel persists"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-sentinel.env
          . /tmp/r7-config.env
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          PGDATA="$MV_APP_SUPPORT/PostgreSQL/17/data"

          echo "[2.1] restart the app/backend (VALID_EXISTING path)"
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          EXITF=/tmp/r7-case2.exit
          r7_run_supervisor "$CONFIG" "$EXITF" case2
          if ! r7_wait_healthy "$STATUS" "$EXITF" 600; then
            echo "::error::CASE 2: restart did not reach healthy"
            tail -30 "$MV_LOG_DIR/supervisor.log" 2>/dev/null || true
            tail -30 "$MV_LOG_DIR/provision.log" 2>/dev/null || true
            exit 1
          fi
          r7_api_probe
          r7_summary "APP RESTART: GREEN (VALID_EXISTING to healthy)"

          echo "[2.2] sentinel must persist"
          CNT=$(r7_sentinel_count "$PGBIN" "$SENTINEL_ID")
          echo "  sentinel rows: $CNT (expect 1)"
          [ "$CNT" = "1" ] || { echo "::error::sentinel lost after restart"; exit 1; }
          r7_summary "SENTINEL AFTER RESTART: PRESENT"

          echo "[2.3] cluster NOT re-initialized"
          PGV_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          PGV_WAS=$(cat /tmp/r7-pgversion.sha)
          [ "$PGV_NOW" = "$PGV_WAS" ] || { echo "::error::PG_VERSION changed ($PGV_WAS -> $PGV_NOW)"; exit 1; }
          CREATED_NOW=$(jq -r .createdAt "$MV_APP_SUPPORT/config/provisioned.json")
          CREATED_WAS=$(cat /tmp/r7-provisioned-created.txt)
          [ "$CREATED_NOW" = "$CREATED_WAS" ] || { echo "::error::provisioned.json createdAt changed"; exit 1; }
          # The frozen supervisor NEVER re-invokes the provisioner when
          # PG_VERSION exists (delegate_provisioning is skipped, fail-closed
          # by design), so the restart's VALID_EXISTING proof is: provision.log
          # byte-identical to the case-1 capture (provisioner not re-invoked)
          # — together with the marker/cluster/sentinel/initdb assertions above.
          PLG_NOW=$(shasum -a 256 "$MV_LOG_DIR/provision.log" | awk '{print $1}')
          PLG_WAS=$(cat /tmp/r7-provisionlog.sha)
          [ "$PLG_NOW" = "$PLG_WAS" ] || {
            echo "::error::provisioner re-invoked during restart (provision.log changed: $PLG_WAS -> $PLG_NOW)"; exit 1
          }
          r7_summary "RESTART CLASSIFICATION: VALID_EXISTING (provisioner not re-invoked; marker+cluster+sentinel intact)"
          INITDBS=$(grep -c 'initdb' "$MV_LOG_DIR/provision.log" 2>/dev/null || echo 0)
          INITDBS_BASE=$(cat /tmp/r7-initdb-count.txt 2>/dev/null || echo 0)
          echo "  initdb occurrences in provision.log: $INITDBS (baseline $INITDBS_BASE — must not grow)"
          [ "$INITDBS" -le "$INITDBS_BASE" ] || { echo "::error::cluster was re-initialized during restart"; exit 1; }
          r7_summary "PG CLUSTER REINITIALIZED (restart): NO"

          echo "[2.4] graceful stop + plants"
          r7_graceful_stop "$STATUS" "$EXITF"
          r7_plants_alive

      - name: "CASE 3a — BUILD B: the newly built version (CFBundleVersion 0.1.1)"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/node-tarball.env
          . /tmp/api-stage.env
          . /tmp/prisma-stage.env
          # The app is STOPPED (case 2 ended gracefully) — its data tree is idle.

          echo "[3a.1] bump the bundle version for the replacement build"
          python3 - <<'PYEOF'
          import json
          p = "src-tauri/tauri.conf.json"
          cfg = json.load(open(p))
          assert cfg["version"] == "0.1.0", f"unexpected base version {cfg['version']!r}"
          cfg["version"] = "0.1.1"
          json.dump(cfg, open(p, "w"), indent=2)
          print("version bumped for build B: 0.1.0 -> 0.1.1")
          PYEOF

          echo "[3a.2] tauri rebuild (freshly built replacement)"
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/tauri-build-b.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::build B desktop binary missing"
            tail -40 /tmp/tauri-build-b.log
            exit 1
          }
          cd ..
          VER_B="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PWD/src-tauri/target/release/bundle/macos/MediVault.app/Contents/Info.plist")"
          echo "build B version: $VER_B (expect 0.1.1)"
          [ "$VER_B" = "0.1.1" ] || { echo "::error::build B version is $VER_B"; exit 1; }
          echo "APP_B=$PWD/src-tauri/target/release/bundle/macos/MediVault.app" | tee /tmp/tauri-app-b.env

          echo "[3a.3] merge the backend into build B (same frozen staging contracts)"
          . /tmp/tauri-app-b.env
          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP_B/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh
          APP_ROOT="$APP_B" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            bash macos/scripts/stage-app-bundle.sh
          cat > "$APP_B/Contents/Resources/supervisor-config.json" <<EOF
          {
            "version": 1,
            "paths": {
              "pg_bundle": "$APP_B/Contents/Resources/runtime/postgresql/17",
              "node_binary": "$APP_B/Contents/Resources/runtime/nodejs/bin/node",
              "api_entry": "$APP_B/Contents/Resources/api/dist/index.js",
              "api_working_dir": "$APP_B/Contents/Resources/api",
              "app_support_dir": "$MV_APP_SUPPORT",
              "log_dir": "$MV_LOG_DIR"
            },
            "postgres": {
              "host": "127.0.0.1",
              "port": $MV_PGPORT,
              "superuser": "postgres",
              "app_user": "medivault",
              "app_database": "medivault",
              "pgdata_rel": "PostgreSQL/17/data"
            },
            "api": { "host": "127.0.0.1", "port": $MV_API_PORT, "allowed_origins": "http://localhost:3000" },
            "secrets": { "source": "keychain" },
            "provisioner": {
              "entry": "$APP_B/Contents/Resources/provision/dist/index.js",
              "prisma_cli": "$APP_B/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js",
              "prisma_schema": "$APP_B/Contents/Resources/prisma/schema.prisma",
              "timeout_sec": 600
            },
            "limits": { "pg_start_timeout_sec": 120, "api_start_timeout_sec": 90, "health_interval_sec": 5 }
          }
          EOF

          echo "[3a.4] codesign + Mach-O gates (build B)"
          codesign --force --sign - "$APP_B/Contents/MacOS/MediVault"
          codesign --verify --strict "$APP_B/Contents/MacOS/MediVault"
          MACHO_RECORDS=/tmp/macho-gate-r7-c1.txt bash macos/scripts/macho-gate.sh "$APP_B/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-c2.txt bash macos/scripts/macho-gate.sh "$APP_B/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-c3.txt bash macos/scripts/macho-gate.sh "$APP_B/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-r7-c4.txt bash macos/scripts/macho-gate.sh "$APP_B/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

          echo "[3a.5] build + verify DMG B (v0.1.1)"
          DMG_B="$RUNNER_TEMP/MediVault-B-${{ matrix.label }}.dmg"
          APP_ROOT="$APP_B" DMG_OUT="$DMG_B" bash macos/scripts/build-dmg.sh
          echo "DMG_B=$DMG_B" | tee /tmp/dmg-b.env
          test -f "$DMG_B.sha256"

      - name: "CASE 3b — APP REPLACEMENT: preserve data, reconcile, sentinel"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-sentinel.env
          . /tmp/dmg-b.env
          PGDATA="$MV_APP_SUPPORT/PostgreSQL/17/data"

          echo "[3b.0] owned processes already stopped gracefully (end of case 2)"
          test ! -e "$PGDATA/postmaster.pid" || { echo "::error::cluster still running before replacement"; exit 1; }
          r7_plants_alive

          echo "[3b.1] replace MediVault.app with the newly built version"
          rm -rf "$MV_INSTALL_APP"
          MOUNT="$(mktemp -d /tmp/mv-r7-mount-b.XXXXXX)"
          hdiutil attach "$DMG_B" -mountpoint "$MOUNT" -nobrowse -readonly
          test -x "$MOUNT/MediVault.app/Contents/MacOS/MediVault"
          cp -R "$MOUNT/MediVault.app" "$MV_INSTALL_APP"
          hdiutil detach "$MOUNT" -force >/dev/null
          rmdir "$MOUNT" 2>/dev/null || true
          codesign --verify --strict "$MV_INSTALL_APP"
          VER_B="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MV_INSTALL_APP/Contents/Info.plist")"
          echo "installed version after replacement: $VER_B (expect 0.1.1)"
          [ "$VER_B" = "0.1.1" ] || { echo "::error::unexpected version $VER_B"; exit 1; }
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          r7_summary "APP REPLACEMENT: GREEN (v0.1.0 -> newly built v0.1.1)"

          echo "[3b.2] reconcile/migrate from the NEW app's packaged provisioner (VALID_EXISTING)"
          CONFIG="$MV_INSTALL_APP/Contents/Resources/supervisor-config.json"
          python3 - "$CONFIG" "$MV_INSTALL_APP" <<'PYEOF'
          import json, sys
          path, new_root = sys.argv[1], sys.argv[2]
          cfg = json.load(open(path))
          cfg["paths"]["pg_bundle"] = f"{new_root}/Contents/Resources/runtime/postgresql/17"
          cfg["paths"]["node_binary"] = f"{new_root}/Contents/Resources/runtime/nodejs/bin/node"
          cfg["paths"]["api_entry"] = f"{new_root}/Contents/Resources/api/dist/index.js"
          cfg["paths"]["api_working_dir"] = f"{new_root}/Contents/Resources/api"
          cfg["provisioner"]["entry"] = f"{new_root}/Contents/Resources/provision/dist/index.js"
          cfg["provisioner"]["prisma_cli"] = f"{new_root}/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js"
          cfg["provisioner"]["prisma_schema"] = f"{new_root}/Contents/Resources/prisma/schema.prisma"
          json.dump(cfg, open(path, "w"), indent=2)
          PYEOF
          echo "CONFIG=$CONFIG" | tee /tmp/r7-config.env
          set +e
          MV_PG_APP_PASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" \
          MV_PG_SUPER_PASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" \
            "$MV_INSTALL_APP/Contents/Resources/runtime/nodejs/bin/node" \
            "$MV_INSTALL_APP/Contents/Resources/provision/dist/index.js" provision --config "$CONFIG"
          RC=$?
          set -e
          echo "provisioner exit: $RC (expect 0 — VALID_EXISTING + idempotent migrations)"
          [ "$RC" = "0" ] || { echo "::error::reconciliation from the new app failed"; exit 1; }
          grep -q "VALID_EXISTING" "$MV_LOG_DIR/provision.log" || {
            echo "::error::no VALID_EXISTING classification logged during reconciliation"; exit 1
          }

          echo "[3b.3] Application Support + Logs preserved"
          test -d "$MV_APP_SUPPORT"
          test -f "$PGDATA/PG_VERSION"
          test -f "$MV_APP_SUPPORT/config/provisioned.json"
          test -s "$MV_LOG_DIR/provision.log"
          r7_summary "APPLICATION SUPPORT PRESERVED: YES (tree + provisioned.json + logs)"

          echo "[3b.4] Keychain material preserved (never overwritten; values still authenticate)"
          "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor" bootstrap-secrets --config "$CONFIG" | tee /tmp/r7-bootstrap-3.log
          [ "$(grep -c 'already present' /tmp/r7-bootstrap-3.log)" = "5" ] || {
            echo "::error::expected 5 already-present items after replacement"; exit 1
          }
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security find-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || {
              echo "::error::keychain item missing after replacement: $account"; exit 1
            }
          done
          r7_summary "KEYCHAIN PRESERVED: YES (no-overwrite 5/5; credentials still valid)"

          echo "[3b.5] start the replaced app (supervisor) to healthy"
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          EXITF=/tmp/r7-case3.exit
          r7_run_supervisor "$CONFIG" "$EXITF" case3
          if ! r7_wait_healthy "$STATUS" "$EXITF" 600; then
            echo "::error::CASE 3: replaced app did not reach healthy"
            tail -30 "$MV_LOG_DIR/supervisor.log" 2>/dev/null || true
            tail -30 "$MV_LOG_DIR/provision.log" 2>/dev/null || true
            exit 1
          fi
          r7_api_probe

          echo "[3b.6] sentinel + cluster-preservation proofs"
          CNT=$(r7_sentinel_count "$PGBIN" "$SENTINEL_ID")
          echo "  sentinel rows: $CNT (expect 1)"
          [ "$CNT" = "1" ] || { echo "::error::sentinel lost after reinstall"; exit 1; }
          r7_summary "SENTINEL AFTER REINSTALL: PRESENT"
          PGV_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          PGV_WAS=$(cat /tmp/r7-pgversion.sha)
          [ "$PGV_NOW" = "$PGV_WAS" ] || { echo "::error::PG_VERSION changed during reinstall ($PGV_WAS -> $PGV_NOW)"; exit 1; }
          CREATED_NOW=$(jq -r .createdAt "$MV_APP_SUPPORT/config/provisioned.json")
          CREATED_WAS=$(cat /tmp/r7-provisioned-created.txt)
          [ "$CREATED_NOW" = "$CREATED_WAS" ] || { echo "::error::provisioned.json createdAt changed during reinstall"; exit 1; }
          INITDBS=$(grep -c 'initdb' "$MV_LOG_DIR/provision.log" 2>/dev/null || echo 0)
          INITDBS_BASE=$(cat /tmp/r7-initdb-count.txt 2>/dev/null || echo 0)
          echo "  initdb occurrences in provision.log: $INITDBS (baseline $INITDBS_BASE — must not grow)"
          [ "$INITDBS" -le "$INITDBS_BASE" ] || { echo "::error::cluster was re-initialized during reinstall"; exit 1; }
          r7_summary "PG CLUSTER REINITIALIZED (reinstall): MUST BE NO -> NO"

          echo "[3b.7] graceful stop + plants"
          r7_graceful_stop "$STATUS" "$EXITF"
          r7_plants_alive

      - name: "CASE 4a — RECOVERABLE_INCOMPLETE: interrupted provisioning resumes exactly"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-config.env
          ISO="$RUNNER_TEMP/mv-r7-recoverable"
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          PGDATA="$ISO/PostgreSQL/17/data"
          ISO_SENTINEL="CI_REINSTALL_ISO_A_${GITHUB_RUN_ID}_${{ matrix.label }}"

          echo "[4a.1] construct the interrupted state: cluster + role + db done, migrations NOT (app replaced before provisioning completed)"
          rm -rf "$ISO"
          mkdir -p "$(dirname "$PGDATA")"
          PWF="$(mktemp)"
          chmod 600 "$PWF"
          printf '%s\n' "$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" > "$PWF"
          "$PGBIN/initdb" -D "$PGDATA" --username=postgres --pwfile="$PWF" --auth-local=scram-sha-256 --auth-host=scram-sha-256 --encoding=UTF8 --no-instructions
          rm -f "$PWF"
          cat >> "$PGDATA/postgresql.conf" <<CONFEOF

          port = $MV_PGPORT
          listen_addresses = '127.0.0.1'
          CONFEOF
          "$PGBIN/pg_ctl" -D "$PGDATA" -w -t 120 -l "$ISO/pg-iso.log" start
          PGPASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE medivault LOGIN PASSWORD '${MV_KEYCHAIN_SEED_PG_APP_PASSWORD}';
          CREATE DATABASE medivault OWNER medivault;
          SQL
          # The app-db stays EMPTY here — the production-realistic interrupted
          # state (nothing but the provisioner writes to the app-db before
          # provisioning completes). A pre-seeded sentinel table would make the
          # schema non-empty with no migration history → prisma P3005
          # (ambiguous baseline) → the provisioner's correct fail-closed
          # refusal (first-red run 34158152261). The sentinel is seeded
          # POST-resume in [4a.5] instead, proving the recovered state is
          # writable as the app role.
          "$PGBIN/pg_ctl" -D "$PGDATA" -m fast -w -t 60 stop
          PGV_SHA_ISO=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          echo "  iso PG_VERSION sha: $PGV_SHA_ISO"

          echo "[4a.2] write the pending (interrupted) marker"
          mkdir -p "$ISO/config"
          MV_PGPORT="$MV_PGPORT" python3 - "$ISO/config/provision-pending.json" <<'PYEOF'
          import json, sys, os, datetime
          cfg = {
            "schema": 1,
            "status": "pending",
            "pgMajor": 17,
            "port": int(os.environ.get("MV_PGPORT", "55451")),
            "appUser": "medivault",
            "appDatabase": "medivault",
            "startedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "stages": {"initdb": True, "server": True, "role": True, "database": True, "migrations": False},
          }
          json.dump(cfg, open(sys.argv[1], "w"), indent=2)
          PYEOF

          echo "[4a.3] isolated config (installed app runtimes, iso app-support)"
          ISO_CONFIG="$ISO/config/iso-config.json"
          python3 - "$CONFIG" "$ISO_CONFIG" "$ISO" <<'PYEOF'
          import json, sys
          src, dst, iso = sys.argv[1], sys.argv[2], sys.argv[3]
          cfg = json.load(open(src))
          cfg["paths"]["app_support_dir"] = iso
          cfg["paths"]["log_dir"] = iso + "/logs"
          json.dump(cfg, open(dst, "w"), indent=2)
          PYEOF

          echo "[4a.4] resume through the INSTALLED app's packaged provisioner (RECOVERABLE)"
          set +e
          MV_PG_APP_PASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" \
          MV_PG_SUPER_PASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" \
            "$MV_INSTALL_APP/Contents/Resources/runtime/nodejs/bin/node" \
            "$MV_INSTALL_APP/Contents/Resources/provision/dist/index.js" provision --config "$ISO_CONFIG"
          RC=$?
          set -e
          echo "provisioner exit: $RC (expect 0 — RECOVERABLE_INCOMPLETE resume)"
          [ "$RC" = "0" ] || { echo "::error::RECOVERABLE resume failed"; exit 1; }
          test -f "$ISO/config/provisioned.json"
          test ! -e "$ISO/config/provision-pending.json"
          PGV_SHA_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          [ "$PGV_SHA_NOW" = "$PGV_SHA_ISO" ] || { echo "::error::iso cluster was re-initialized"; exit 1; }

          echo "[4a.5] the recovered state is supervisor-usable + sentinel survived"
          STATUS2="$ISO/runtime-state/supervisor-status.json"
          EXITF2=/tmp/r7-iso-a.exit
          rm -f "$EXITF2"
          ( "$MV_INSTALL_APP/Contents/MacOS/mediavault-supervisor" run --config "$ISO_CONFIG" \
              > "$RUNNER_TEMP/r7-supervisor-iso-a.log" 2>&1; echo $? > "$EXITF2" ) &
          if ! r7_wait_healthy "$STATUS2" "$EXITF2" 600; then
            echo "::error::recovered iso state did not reach healthy"
            tail -30 "$ISO/logs/supervisor.log" 2>/dev/null || true
            tail -30 "$ISO/logs/provision.log" 2>/dev/null || true
            exit 1
          fi
          r7_api_probe
          echo "  seeding the iso sentinel NOW (post-resume writability proof — the app role writes to the recovered app-db)"
          PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -v ON_ERROR_STOP=1 <<SQL
          CREATE TABLE ci_reinstall_sentinel (id TEXT PRIMARY KEY, created_at TIMESTAMPTZ NOT NULL DEFAULT now());
          INSERT INTO ci_reinstall_sentinel (id) VALUES ('$ISO_SENTINEL');
          SQL
          CNT=$(r7_sentinel_count "$PGBIN" "$ISO_SENTINEL")
          echo "  iso sentinel rows: $CNT (expect 1 — writable as the app role after recovery)"
          [ "$CNT" = "1" ] || { echo "::error::recovered app-db not writable as the app role"; exit 1; }
          r7_graceful_stop "$STATUS2" "$EXITF2"
          r7_plants_alive
          r7_summary "RECOVERABLE INCOMPLETE: GREEN (resumed exactly, migrations applied, cluster + role/db identity preserved, recovered app-db writable as the app role)"

      - name: "CASE 4b — FAIL-CLOSED: pending marker + unexpected state (nothing altered)"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-config.env
          ISO="$RUNNER_TEMP/mv-r7-fc1"
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          PGDATA="$ISO/PostgreSQL/17/data"

          echo "[4b.1] construct: pending marker + an UNEXPECTED non-template database"
          rm -rf "$ISO"
          mkdir -p "$(dirname "$PGDATA")"
          PWF="$(mktemp)"
          chmod 600 "$PWF"
          printf '%s\n' "$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" > "$PWF"
          "$PGBIN/initdb" -D "$PGDATA" --username=postgres --pwfile="$PWF" --auth-local=scram-sha-256 --auth-host=scram-sha-256 --encoding=UTF8 --no-instructions
          rm -f "$PWF"
          cat >> "$PGDATA/postgresql.conf" <<CONFEOF

          port = $MV_PGPORT
          listen_addresses = '127.0.0.1'
          CONFEOF
          "$PGBIN/pg_ctl" -D "$PGDATA" -w -t 120 -l "$ISO/pg-iso.log" start
          PGPASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE DATABASE unrelated_extra;
          SQL
          "$PGBIN/pg_ctl" -D "$PGDATA" -m fast -w -t 60 stop
          FCOUNT_BEFORE=$(find "$PGDATA" -type f | wc -l | tr -d ' ')
          PGV_SHA_ISO=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          mkdir -p "$ISO/config"
          MV_PGPORT="$MV_PGPORT" python3 - "$ISO/config/provision-pending.json" <<'PYEOF'
          import json, sys, os, datetime
          cfg = {
            "schema": 1,
            "status": "pending",
            "pgMajor": 17,
            "port": int(os.environ.get("MV_PGPORT", "55451")),
            "appUser": "medivault",
            "appDatabase": "medivault",
            "startedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "stages": {"initdb": True, "server": True, "role": False, "database": False, "migrations": False},
          }
          json.dump(cfg, open(sys.argv[1], "w"), indent=2)
          PYEOF
          ISO_CONFIG="$ISO/config/iso-config.json"
          python3 - "$CONFIG" "$ISO_CONFIG" "$ISO" <<'PYEOF'
          import json, sys
          src, dst, iso = sys.argv[1], sys.argv[2], sys.argv[3]
          cfg = json.load(open(src))
          cfg["paths"]["app_support_dir"] = iso
          cfg["paths"]["log_dir"] = iso + "/logs"
          json.dump(cfg, open(dst, "w"), indent=2)
          PYEOF

          echo "[4b.2] provisioner must FAIL CLOSED (exit 5) and alter NOTHING"
          set +e
          MV_PG_APP_PASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" \
          MV_PG_SUPER_PASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" \
            "$MV_INSTALL_APP/Contents/Resources/runtime/nodejs/bin/node" \
            "$MV_INSTALL_APP/Contents/Resources/provision/dist/index.js" provision --config "$ISO_CONFIG"
          RC=$?
          set -e
          echo "provisioner exit: $RC (expect 5 — INCOMPLETE_EXISTING)"
          [ "$RC" = "5" ] || { echo "::error::expected exit 5, got $RC"; exit 1; }
          FCOUNT_AFTER=$(find "$PGDATA" -type f | wc -l | tr -d ' ')
          echo "  cluster files: before=$FCOUNT_BEFORE after=$FCOUNT_AFTER (must be equal)"
          [ "$FCOUNT_AFTER" = "$FCOUNT_BEFORE" ] || { echo "::error::cluster state was altered"; exit 1; }
          PGV_SHA_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          [ "$PGV_SHA_NOW" = "$PGV_SHA_ISO" ] || { echo "::error::PG_VERSION altered"; exit 1; }
          test ! -f "$ISO/config/provisioned.json" || { echo "::error::provisioned.json must NOT exist"; exit 1; }
          test -f "$ISO/config/provision-pending.json" || { echo "::error::pending marker must remain"; exit 1; }
          test ! -e "$PGDATA/postmaster.pid" || { echo "::error::server left running"; exit 1; }
          r7_plants_alive
          r7_summary "FAIL-CLOSED INCOMPLETE (pending + unexpected state): GREEN (exit 5, nothing altered)"

      - name: "CASE 4c — FAIL-CLOSED: valid cluster without the trust anchor (nothing altered)"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-config.env
          ISO="$RUNNER_TEMP/mv-r7-fc2"
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          PGDATA="$ISO/PostgreSQL/17/data"

          echo "[4c.1] construct: fully valid app-db cluster, NO markers at all (missing/partial runtime state)"
          rm -rf "$ISO"
          mkdir -p "$(dirname "$PGDATA")"
          PWF="$(mktemp)"
          chmod 600 "$PWF"
          printf '%s\n' "$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" > "$PWF"
          "$PGBIN/initdb" -D "$PGDATA" --username=postgres --pwfile="$PWF" --auth-local=scram-sha-256 --auth-host=scram-sha-256 --encoding=UTF8 --no-instructions
          rm -f "$PWF"
          cat >> "$PGDATA/postgresql.conf" <<CONFEOF

          port = $MV_PGPORT
          listen_addresses = '127.0.0.1'
          CONFEOF
          "$PGBIN/pg_ctl" -D "$PGDATA" -w -t 120 -l "$ISO/pg-iso.log" start
          PGPASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" "$PGBIN/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U postgres -d postgres -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE medivault LOGIN PASSWORD '${MV_KEYCHAIN_SEED_PG_APP_PASSWORD}';
          CREATE DATABASE medivault OWNER medivault;
          SQL
          "$PGBIN/pg_ctl" -D "$PGDATA" -m fast -w -t 60 stop
          FCOUNT_BEFORE=$(find "$PGDATA" -type f | wc -l | tr -d ' ')
          PGV_SHA_ISO=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          # deliberately NO provisioned.json and NO provision-pending.json
          ISO_CONFIG="$ISO/config/iso-config.json"
          mkdir -p "$(dirname "$ISO_CONFIG")"
          python3 - "$CONFIG" "$ISO_CONFIG" "$ISO" <<'PYEOF'
          import json, sys
          src, dst, iso = sys.argv[1], sys.argv[2], sys.argv[3]
          cfg = json.load(open(src))
          cfg["paths"]["app_support_dir"] = iso
          cfg["paths"]["log_dir"] = iso + "/logs"
          json.dump(cfg, open(dst, "w"), indent=2)
          PYEOF

          echo "[4c.2] provisioner must FAIL CLOSED (exit 5) and alter NOTHING (never auto re-init)"
          set +e
          MV_PG_APP_PASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" \
          MV_PG_SUPER_PASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" \
            "$MV_INSTALL_APP/Contents/Resources/runtime/nodejs/bin/node" \
            "$MV_INSTALL_APP/Contents/Resources/provision/dist/index.js" provision --config "$ISO_CONFIG"
          RC=$?
          set -e
          echo "provisioner exit: $RC (expect 5 — INCOMPLETE_EXISTING)"
          [ "$RC" = "5" ] || { echo "::error::expected exit 5, got $RC"; exit 1; }
          FCOUNT_AFTER=$(find "$PGDATA" -type f | wc -l | tr -d ' ')
          echo "  cluster files: before=$FCOUNT_BEFORE after=$FCOUNT_AFTER (must be equal)"
          [ "$FCOUNT_AFTER" = "$FCOUNT_BEFORE" ] || { echo "::error::cluster state was altered"; exit 1; }
          PGV_SHA_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          [ "$PGV_SHA_NOW" = "$PGV_SHA_ISO" ] || { echo "::error::PG_VERSION altered"; exit 1; }
          test ! -f "$ISO/config/provisioned.json" || { echo "::error::provisioned.json must NOT be created"; exit 1; }
          test ! -f "$ISO/config/provision-pending.json" || { echo "::error::pending marker must NOT be created"; exit 1; }
          test ! -e "$PGDATA/postmaster.pid" || { echo "::error::server left running"; exit 1; }
          r7_plants_alive
          r7_summary "FAIL-CLOSED INCOMPLETE (valid cluster, missing trust anchor): GREEN (exit 5, nothing altered, never auto re-init)"

      - name: "CASE 4d — STALE PENDING MARKER: reconciles to VALID (sentinel survives)"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-sentinel.env
          . /tmp/r7-config.env
          PGBIN="$MV_INSTALL_APP/Contents/Resources/runtime/postgresql/17/bin"
          PGDATA="$MV_APP_SUPPORT/PostgreSQL/17/data"
          CONFIGDIR="$MV_APP_SUPPORT/config"

          echo "[4d.1] simulate a crash AFTER completion that left a stale pending marker"
          test -f "$CONFIGDIR/provisioned.json"
          MV_PGPORT="$MV_PGPORT" python3 - "$CONFIGDIR/provision-pending.json" <<'PYEOF'
          import json, sys, os, datetime
          cfg = {
            "schema": 1,
            "status": "pending",
            "pgMajor": 17,
            "port": int(os.environ.get("MV_PGPORT", "55451")),
            "appUser": "medivault",
            "appDatabase": "medivault",
            "startedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "stages": {"initdb": True, "server": True, "role": True, "database": True, "migrations": True},
          }
          json.dump(cfg, open(sys.argv[1], "w"), indent=2)
          PYEOF

          echo "[4d.2] provisioner reconciles (stale pending over complete install -> VALID verify)"
          set +e
          MV_PG_APP_PASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" \
          MV_PG_SUPER_PASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" \
            "$MV_INSTALL_APP/Contents/Resources/runtime/nodejs/bin/node" \
            "$MV_INSTALL_APP/Contents/Resources/provision/dist/index.js" provision --config "$CONFIG"
          RC=$?
          set -e
          echo "provisioner exit: $RC (expect 0 — stale reconcile)"
          [ "$RC" = "0" ] || { echo "::error::stale-pending reconciliation failed"; exit 1; }
          test ! -e "$CONFIGDIR/provision-pending.json" || { echo "::error::stale pending marker not removed"; exit 1; }
          test -f "$CONFIGDIR/provisioned.json"

          echo "[4d.3] sentinel survived + supervisor healthy + graceful stop"
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          EXITF=/tmp/r7-case4d.exit
          r7_run_supervisor "$CONFIG" "$EXITF" case4d
          r7_wait_healthy "$STATUS" "$EXITF" 600 || { echo "::error::post-reconcile supervisor not healthy"; exit 1; }
          r7_api_probe
          CNT=$(r7_sentinel_count "$PGBIN" "$SENTINEL_ID")
          [ "$CNT" = "1" ] || { echo "::error::sentinel lost during stale reconcile"; exit 1; }
          PGV_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          [ "$PGV_NOW" = "$(cat /tmp/r7-pgversion.sha)" ] || { echo "::error::cluster re-initialized during stale reconcile"; exit 1; }
          r7_graceful_stop "$STATUS" "$EXITF"
          r7_plants_alive
          r7_summary "STALE PENDING RECONCILE: GREEN (marker removed, sentinel + cluster preserved)"

      - name: "CASE 5 — UNINSTALL: remove the app, data + keychain PRESERVED"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/r7-lib.sh
          . /tmp/r7-seeds.env
          . /tmp/r7-sentinel.env
          PGDATA="$MV_APP_SUPPORT/PostgreSQL/17/data"
          PGBIN_REF="$PG_INSTALL/bin"

          echo "[5.1] uninstall: remove the application only"
          test -d "$MV_INSTALL_APP"
          rm -rf "$MV_INSTALL_APP"
          test ! -e "$MV_INSTALL_APP"
          r7_summary "UNINSTALL APP: GREEN (application removed)"

          echo "[5.2] data preserved under Application Support + Logs"
          test -d "$MV_APP_SUPPORT"
          test -f "$PGDATA/PG_VERSION"
          PGV_NOW=$(shasum -a 256 "$PGDATA/PG_VERSION" | awk '{print $1}')
          [ "$PGV_NOW" = "$(cat /tmp/r7-pgversion.sha)" ] || { echo "::error::cluster altered by uninstall"; exit 1; }
          test -f "$MV_APP_SUPPORT/config/provisioned.json"
          test -s "$MV_LOG_DIR/provision.log"
          test -s "$MV_LOG_DIR/supervisor.log" || true
          echo "  Application Support tree: $(find "$MV_APP_SUPPORT" -type f | wc -l | tr -d ' ') files"
          echo "  Logs: $(ls "$MV_LOG_DIR" 2>/dev/null | tr '\n' ' ')"

          echo "[5.3] keychain entries preserved"
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security find-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || {
              echo "::error::keychain item missing after uninstall: $account"; exit 1
            }
          done
          r7_summary "KEYCHAIN ENTRIES AFTER UNINSTALL: PRESERVED (5/5)"

          echo "[5.4] prove the preserved cluster still holds the sentinel (reference PG runtime)"
          "$PGBIN_REF/pg_ctl" -D "$PGDATA" -w -t 120 -l /tmp/r7-ref-pg.log start
          CNT=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_BOOTSTRAP" "$PGBIN_REF/psql" -h 127.0.0.1 -p "$MV_PGPORT" -U postgres -d medivault -t -A -c "SELECT count(*) FROM ci_reinstall_sentinel WHERE id = '$SENTINEL_ID'")
          echo "  sentinel rows (superuser, reference runtime): $CNT (expect 1)"
          [ "$CNT" = "1" ] || { echo "::error::sentinel lost after uninstall"; exit 1; }
          "$PGBIN_REF/pg_ctl" -D "$PGDATA" -m fast -w -t 60 stop
          test ! -e "$PGDATA/postmaster.pid"
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] || { echo "::error::orphans after uninstall proof: $LEFT"; exit 1; }
          r7_summary "DATA AFTER APP REMOVAL: PRESERVED (sentinel row queried from the preserved cluster)"

          echo "[5.5] final unrelated-process safety assertion"
          r7_plants_alive
          r7_summary "UNRELATED PROCESS SAFETY: GREEN (planted postgres/pg_ctl/node survived every cycle)"
          r7_summary "OVERALL (${{ matrix.label }}): GREEN"

          echo "=== CASE MATRIX SUMMARY ==="
          cat /tmp/r7-summary.txt

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          # Only MediVault-owned canonical paths are ever swept here.
          pkill -f 'Applications/MediVault.app/Contents/MacOS/MediVault' 2>/dev/null || true
          pkill -f 'Applications/MediVault.app/Contents/MacOS/mediavault-supervisor' 2>/dev/null || true
          d="/Users/runner/Library/Application Support/MediVault/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            /Users/runner/pg17-install-dt13/bin/pg_ctl -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          for iso in /Users/runner/work/_temp/mv-r7-recoverable /Users/runner/work/_temp/mv-r7-fc1 /Users/runner/work/_temp/mv-r7-fc2; do
            di="$iso/PostgreSQL/17/data"
            if [ -d "$di" ] && [ -f "$di/PG_VERSION" ]; then
              /Users/runner/pg17-install-dt13/bin/pg_ctl -D "$di" -m fast -w -t 60 stop 2>/dev/null || true
            fi
          done
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }
          # Kill the planted witnesses explicitly (they are ours; unrelated to MediVault).
          for f in /tmp/r7-plant-pg.pid /tmp/r7-plant-ctl.pid /tmp/r7-plant-node.pid; do
            [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true
          done
          # Best-effort cleanup of runner-local test state (ephemeral runner anyway).
          rm -rf "/Users/runner/Applications/MediVault.app" \
                 "/Users/runner/Library/Application Support/MediVault" \
                 "/Users/runner/Library/Logs/MediVault" 2>/dev/null || true
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security delete-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || true
          done

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reinstall-acceptance-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/r7-summary.txt
            /tmp/macho-gate-records.txt
            /tmp/macho-gate-r7-*.txt
            /tmp/tauri-build.log
            /tmp/tauri-build-b.log
            /tmp/r7-bootstrap-*.log
            /tmp/r7-pgversion.sha
            /tmp/r7-provisioned-created.txt
            /tmp/r7-ref-pg.log
            /Users/runner/Library/Application Support/MediVault/config/
            /Users/runner/Library/Logs/MediVault/
            /Users/runner/work/_temp/r7-supervisor-*.log
            /Users/runner/work/_temp/MediVault-A-${{ matrix.label }}.dmg.sha256
            /Users/runner/work/_temp/MediVault-B-${{ matrix.label }}.dmg.sha256
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # production-readiness — the production hardening / distribution
  # preparation stage (SMAppService + relocatable install model +
  # Hardened Runtime structural proof + Node JIT entitlement decision +
  # hardened lifecycle from an arbitrary install location).
  #
  # Contract: acceptance/macos-production-readiness-contract.md.
  #
  # HONESTY MODEL:
  #   * The signing here is STRUCTURAL AD-HOC (MV_ADHOC_STRUCTURAL=1):
  #     identical inside-out order, entitlements, --options runtime —
  #     explicitly NOT production signing; Gatekeeper GREEN is never
  #     claimed from ad-hoc artifacts (verify-signatures.sh enforces the
  #     honesty rule).
  #   * SMAppService registration/approval itself is interactive (Login
  #     Items UI) — this mode proves the helper, the plist contract, the
  #     status model, the state mapping, and NO legacy registration path.
  #   * The shipped supervisor-config.json is the RELOCATABLE production
  #     default (Contents/-relative; per-user ~/Library defaults). The
  #     hardened lifecycle runs FROM THE INSTALLED DMG COPY at an ODD
  #     location with NO --config (defaults only).
  # ---------------------------------------------------------------------------
  production-readiness:
    name: "production-readiness (${{ matrix.label }})"
    if: github.event.inputs.mode == 'production-readiness'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native arch + macOS 26 + Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion)"
          case "$(sw_vers -productVersion)" in
            26*) echo "runner OS is macOS 26 (Tahoe)" ;;
            *) echo "::error::expected macOS 26 on label ${{ matrix.runner }}, got $(sw_vers -productVersion)"; exit 1 ;;
          esac
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          fi
          command -v swiftc >/dev/null 2>&1 || { echo "::error::swiftc missing (Xcode toolchain)"; exit 1; }
          swiftc --version | sed -n '1p'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      # ------------------------------------------------------------------
      # Unit tests FIRST (fail fast): the supervisor's relocatable-config
      # resolution and the desktop's SMAppService status mapping.
      # ------------------------------------------------------------------
      - name: Supervisor unit tests (relocatable config resolution)
        shell: bash
        run: |
          set -euo pipefail
          cd macos/supervisor
          cargo test --locked 2>&1 | tee /tmp/supervisor-tests.log
          test "$(grep -c 'test result: ok' /tmp/supervisor-tests.log)" -ge 1
          grep -q 'full_relocatable_resolution_against_a_temp_bundle' /tmp/supervisor-tests.log

      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build (app bundle, per-arch — compiles the SMAppService commands)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Desktop unit tests (SMAppService status mapping, fail-closed parsing)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --bins --locked 2>&1 | tee /tmp/desktop-tests.log
          test "$(grep -c 'test result: ok' /tmp/desktop-tests.log)" -ge 1
          grep -q 'rejects_any_invented_or_future_status_fail_closed' /tmp/desktop-tests.log

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/medivault-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/prisma-cli-stage"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # ------------------------------------------------------------------
      # NEW: the SMAppService control helper (Swift, ServiceManagement).
      # Compiled for the lane arch with minOS 13.0 and Mach-O gated like
      # every other shipped binary.
      # ------------------------------------------------------------------
      - name: Compile the SMAppService helper (swiftc, minOS 13.0)
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          HELPER_OUT="$RUNNER_TEMP/mediavault-launchagent"
          swiftc -O macos/smappservice/medivault-launchagent.swift \
            -target ${{ matrix.expected_uname }}-apple-macos13.0 \
            -o "$HELPER_OUT"
          file "$HELPER_OUT"
          # swiftc adds LC_RPATH /usr/lib/swift (OUTSIDE the bundle — the
          # frozen Mach-O gate rejects out-of-bundle rpaths). The Swift
          # runtime dylibs resolve via their absolute /usr/lib install
          # names (system-provided, allowed as /usr/lib deps); the rpath
          # itself is redundant — delete it and re-sign after the edit.
          if otool -l "$HELPER_OUT" | grep -q 'path /usr/lib/swift'; then
            install_name_tool -delete_rpath /usr/lib/swift "$HELPER_OUT"
          fi
          codesign --force --sign - "$HELPER_OUT"
          MACHO_RECORDS=/tmp/macho-gate-helper.txt \
            bash macos/scripts/macho-gate.sh "$HELPER_OUT" "${{ matrix.expected_uname }}" 13.0
          echo "HELPER_OUT=$HELPER_OUT" | tee /tmp/smappservice-bin.env

      # ------------------------------------------------------------------
      # Merge the backend into the Tauri app. stage-app-bundle.sh now ALSO
      # stages the helper and writes the SHIPPED RELOCATABLE production
      # supervisor-config.json (Contents/-relative paths, no user
      # identity, production ports 55432/3001, keychain source). This
      # job does NOT overwrite it — the shipped shape IS the test object.
      # ------------------------------------------------------------------
      - name: Merge the backend into the Tauri MediVault.app (relocatable shape)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/tauri-app.env
          . /tmp/node-tarball.env
          . /tmp/api-stage.env
          . /tmp/prisma-stage.env
          . /tmp/smappservice-bin.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            SMAPPSERVICE_BIN="$HELPER_OUT" \
            bash macos/scripts/stage-app-bundle.sh

          echo "APP_ROOT=$APP" | tee /tmp/app-root.env
          echo "--- shipped supervisor-config.json (RELOCATABLE, production ports):"
          cat "$APP/Contents/Resources/supervisor-config.json"
          echo "--- bundle top level:"
          find "$APP" -maxdepth 3 -not -path "*/runtime/postgresql/17/*" | sed "s|$APP|<APP>|" | sort | sed -n '1,40p'

      # ------------------------------------------------------------------
      # NEW (production-readiness first-red #3): the PREBUILT prisma query
      # engines ship with their BUILD MACHINE's absolute install ID
      # (/Users/runner/work/prisma-engines/…/libquery_engine.dylib) baked
      # into LC_ID_DYLIB — a build-machine absolute path inside a shipped
      # Mach-O (never surfaced before: the frozen gates never covered the
      # prisma engines; they are dlopen'ed by node, not linked). The ID is
      # irrelevant for dlopen semantics, but the no-build-path contract
      # still demands scrubbing: rewrite to @loader_path/<name> and
      # re-sign (the same repair family stage-pg-bundle applies to PG).
      # ------------------------------------------------------------------
      - name: Prisma engine install-ID hygiene (scrub build-machine paths)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          REPAIRED=0
          while IFS= read -r -d '' f; do
            ID_LINE="$(otool -l "$f" 2>/dev/null | awk '/LC_ID_DYLIB/{id=1} id && $1=="name"{print $2; id=0}' | head -1)"
            if [ -n "$ID_LINE" ] && [[ "$ID_LINE" == /* ]]; then
              base="$(basename "$f")"
              echo "  repair: $(basename "$f") id '$ID_LINE' -> @loader_path/$base"
              install_name_tool -id "@loader_path/$base" "$f"
              codesign --force --sign - "$f" >/dev/null
              REPAIRED=$((REPAIRED + 1))
            fi
          done < <(find "$APP/Contents/Resources/api/node_modules/.prisma" \
                        "$APP/Contents/Resources/prisma-cli/node_modules/@prisma/engines" \
                        -type f -name '*.dylib.node' -print0 2>/dev/null)
          echo "prisma install-IDs repaired: $REPAIRED"
          # Fail-closed residual scan: NO shipped Mach-O may carry an
          # absolute build-path install ID or dependency afterwards.
          # otool -L line 1 is the HEADER (the inspected file's own path +
          # ':') — skip exactly that one line; line 2 is the install ID for
          # dylibs (post-repair: @loader_path) and the lines after are the
          # dependencies. Any absolute non-system path = violation.
          LEFT=$(find "$APP" -type f -print0 | xargs -0 file 2>/dev/null | grep 'Mach-O' | cut -d: -f1 | while read -r m; do
            otool -L "$m" 2>/dev/null | tail -n +2 | sed 's/(.*//' | grep -E '^/' | grep -vE '^/usr/lib/|^/System/' || true
          done | sort -u)
          if [ -n "$LEFT" ]; then
            echo "::error::absolute (non-system) Mach-O references remain:"
            echo "$LEFT"
            exit 1
          fi
          echo "PRISMA-INSTALL-ID-HYGIENE-GREEN (zero non-system absolute references)"

      - name: Mach-O gates on the merged bundle (all binaries incl. the helper)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          MACHO_RECORDS=/tmp/macho-gate-pr-1.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-pr-2.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-pr-3.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-launchagent" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-pr-4.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-pr-5.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      # ------------------------------------------------------------------
      # HARDENED RUNTIME — structural inside-out signing (STRICTFIRST:
      # zero entitlements), then the empirical Node JIT decision.
      # ------------------------------------------------------------------
      - name: Structural hardened signing (strictest-first, ZERO entitlements)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP_ROOT="$APP_ROOT" MV_ADHOC_STRUCTURAL=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=0 \
            bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/sign-strictfirst.log
          grep -q 'SIGN-STRUCTURAL-ADHOC-GREEN' /tmp/sign-strictfirst.log

      - name: Node JIT proof (strictest-first, hardened Node, NO entitlements)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          NODE="$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node"
          # JIT-tiering workload: hot function optimized by TurboFan;
          # %OptimizeFunctionOnNextCall requires --allow-natives-syntax,
          # so drive tier-up by iteration count alone.
          cat > /tmp/jit-proof.js <<'EOF'
          // Hot loop forces V8 JIT tier-up (interpreter -> Sparkplug -> Maglev/TurboFan).
          function hot(n) {
            let acc = 0;
            for (let i = 0; i < n; i++) {
              acc += (i ^ 0x5f) * 31 + (i >>> 3);
            }
            return acc;
          }
          let total = 0;
          for (let round = 0; round < 3000; round++) total += hot(20000);
          if (!Number.isFinite(total) || total === 0) throw new Error('bad result');
          console.log('JIT-WORKLOAD-OK ' + total);
          EOF
          set +e
          "$NODE" /tmp/jit-proof.js > /tmp/jit-strict.out 2>&1
          STRICT_RC=$?
          set -e
          echo "strict (no entitlement) exit: $STRICT_RC"
          cat /tmp/jit-strict.out || true
          if [ "$STRICT_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/jit-strict.out; then
            echo "NODE_ALLOW_JIT=not-needed" | tee /tmp/node-allowjit.env
            echo "V8 executed the JIT-tiering workload under Hardened Runtime WITHOUT any entitlement — zero entitlements ship."
          else
            echo "NODE_ALLOW_JIT=needed" | tee /tmp/node-allowjit.env
            echo "Strict configuration FAILED (exit $STRICT_RC) — Hardened Runtime blocked V8 JIT execution. Evidence:"
            cat /tmp/jit-strict.out || true
            echo "Re-signing Node with com.apple.security.cs.allow-jit (the ONLY entitlement, Node only) and re-proving:"
            APP_ROOT="$APP_ROOT" MV_ADHOC_STRUCTURAL=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=1 \
              bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/sign-allowjit.log
            grep -q 'SIGN-STRUCTURAL-ADHOC-GREEN' /tmp/sign-allowjit.log
            set +e
            "$NODE" /tmp/jit-proof.js > /tmp/jit-allowjit.out 2>&1
            AJ_RC=$?
            set -e
            echo "allow-jit exit: $AJ_RC"
            cat /tmp/jit-allowjit.out || true
            [ "$AJ_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/jit-allowjit.out || {
              echo "::error::Node failed EVEN WITH allow-jit — not an entitlement issue; investigate"
              exit 1
            }
          fi
          cat /tmp/node-allowjit.env

      - name: Recursive signature verification (fail-closed, final state)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          . /tmp/node-allowjit.env
          FINAL_ALLOW_JIT=0
          [ "$NODE_ALLOW_JIT" = "needed" ] && FINAL_ALLOW_JIT=1
          APP_ROOT="$APP_ROOT" EXPECTED_ARCH="${{ matrix.expected_uname }}" \
            MV_NODE_ALLOW_JIT="$FINAL_ALLOW_JIT" \
            bash macos/scripts/verify-signatures.sh 2>&1 | tee /tmp/verify-signatures.log
          grep -q 'VERIFY-SIGNATURES-GREEN' /tmp/verify-signatures.log

      # ------------------------------------------------------------------
      # SMAPPSERVICE PROOFS (what hosted CI can honestly prove).
      # ------------------------------------------------------------------
      - name: SMAppService helper proofs (bundle identity, plist, status model)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          echo "--- helper self-test from inside the built .app"
          "$APP/Contents/MacOS/mediavault-launchagent" self-test | tee /tmp/smappservice-selftest.log
          grep -q 'plist-found=YES' /tmp/smappservice-selftest.log
          echo "--- status query must return one of the FOUR documented values"
          ST="$("$APP/Contents/MacOS/mediavault-launchagent" status)"
          echo "status: $ST"
          case "$ST" in
            notRegistered|enabled|requiresApproval|notFound)
              echo "status is a documented SMAppService value" ;;
            *)
              echo "::error::status '$ST' is not one of the four documented SMAppService values"; exit 1 ;;
          esac
          echo "--- plist contract (plutil + BundleProgram + no absolute Program)"
          plutil -lint "$APP/Contents/Library/LaunchAgents/dev.medivault.supervisor.plist"
          BP="$(/usr/libexec/PlistBuddy -c 'Print :BundleProgram' "$APP/Contents/Library/LaunchAgents/dev.medivault.supervisor.plist")"
          [ "$BP" = "Contents/MacOS/mediavault-supervisor" ] || { echo "::error::BundleProgram wrong: $BP"; exit 1; }
          if /usr/libexec/PlistBuddy -c 'Print :Program' "$APP/Contents/Library/LaunchAgents/dev.medivault.supervisor.plist" >/dev/null 2>&1; then
            echo "::error::plist must not contain an absolute Program key"; exit 1
          fi
          echo "SMAPPSERVICE-HELPER-PROOFS-GREEN"

      - name: No legacy registration path (fail-closed source scan)
        shell: bash
        run: |
          set -euo pipefail
          echo "--- production tree must contain no legacy ServiceManagement/launchd registration"
          # Scan CODE, not documentation: strip line-comment lines (//, #,
          # /*, and block-continuation *) after the line-number colon, and
          # skip prose file types. A hit on real code (or a comment that
          # OPERATES, e.g. a shell command line) fails the mode.
          HITS=$(grep -rn -E 'launchctl (load|unload)|SMLoginItemSetEnabled|SMJobBless' \
            macos/ src-tauri/src/ 2>/dev/null \
            | grep -v -E '\.(md|log):' \
            | grep -v -E ':[0-9]+:[[:space:]]*(//|#|/\*|\*)' || true)
          if [ -n "$HITS" ]; then
            echo "::error::legacy registration path found:"
            echo "$HITS"
            exit 1
          fi
          echo "NO-LEGACY-REGISTRATION-GREEN"
          echo "--- the notarization pipeline must use notarytool (never altool)"
          if grep -rn 'altool' macos/scripts/ 2>/dev/null | grep -v -E '\.(md):|never|NOT|deprecated' ; then
            echo "::error::altool reference found in the pipeline scripts"; exit 1
          fi
          echo "NO-ALTOOL-GREEN"

      - name: Build + verify the DMG (frozen contract)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/app-root.env
          APP="$APP_ROOT"
          DMG_OUT="$RUNNER_TEMP/MediVault-macOS-${{ matrix.label }}.dmg"
          APP_ROOT="$APP" DMG_OUT="$DMG_OUT" bash macos/scripts/build-dmg.sh
          echo "DMG_OUT=$DMG_OUT" | tee /tmp/dmg.env
          test -f "$DMG_OUT.sha256"

      # ------------------------------------------------------------------
      # THE RELOCATABILITY + HARDENED LIFECYCLE PROOF: install the DMG
      # content at an ODD location and run the supervisor with NO
      # --config (the LaunchAgent shape: BundleProgram + defaults). The
      # shipped config's production ports (PG 55432, API 3001) and the
      # per-user ~/Library defaults apply. Keychain seeds use the frozen
      # proven bootstrap pattern (values never printed).
      # ------------------------------------------------------------------
      - name: Generate CI keychain seed values (values never printed)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "export MV_KEYCHAIN_SEED_PG_APP_PASSWORD=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_PG_BOOTSTRAP=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_MASTER_KEY=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_JWT_SECRET=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_CSRF_SECRET=$(openssl rand -hex 32)"
          } > /tmp/pr-seeds.env
          chmod 600 /tmp/pr-seeds.env
          echo "seed file written (values never printed): /tmp/pr-seeds.env"

      - name: Install the app at an ODD location from the mounted DMG
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/dmg.env
          MOUNT="$(mktemp -d /tmp/mv-pr-mount.XXXXXX)"
          hdiutil attach "$DMG_OUT" -mountpoint "$MOUNT" -nobrowse -readonly
          test -x "$MOUNT/MediVault.app/Contents/MacOS/MediVault"
          INSTALLED="$RUNNER_TEMP/OddPlaces/deep/MediVault.app"
          rm -rf "$RUNNER_TEMP/OddPlaces"
          mkdir -p "$RUNNER_TEMP/OddPlaces/deep"
          cp -R "$MOUNT/MediVault.app" "$INSTALLED"
          hdiutil detach "$MOUNT" -force >/dev/null
          echo "INSTALLED=$INSTALLED" | tee /tmp/pr-installed.env
          echo "odd install location: $INSTALLED"
          codesign --verify --strict "$INSTALLED"
          codesign --verify --strict "$INSTALLED/Contents/MacOS/mediavault-launchagent"

      - name: Default-config resolution proof (NO --config, odd location)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/pr-installed.env
          # `status` with NO arguments: must load the exe-relative shipped
          # config successfully. Exit 2 = config fine + no status file yet
          # (the supervisor's documented contract). Exit 4 = config error.
          set +e
          "$INSTALLED/Contents/MacOS/mediavault-supervisor" status > /tmp/pr-status.out 2>&1
          RC=$?
          set -e
          echo "status (no --config) exit: $RC"
          cat /tmp/pr-status.out || true
          [ "$RC" -eq 2 ] || {
            echo "::error::default-config resolution failed (expected exit 2 = valid config, no status yet; got $RC)"
            exit 1
          }
          echo "DEFAULT-CONFIG-RESOLUTION-GREEN (relocatable, install-location independent)"

      - name: Hardened lifecycle from the odd install (shipped config, CLEAN provisioning)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/pr-installed.env
          . /tmp/pr-seeds.env
          # The per-user defaults resolve to $HOME/Library/… on the runner.
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          rm -rf "$SUP" "$HOME/Library/Logs/MediVault"
          rm -f /tmp/pr-supervisor.exit

          echo "[bootstrap] keychain seeding via the shipped supervisor (NO --config — defaults)"
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets \
              > /tmp/pr-bootstrap.log 2>&1 ) || { cat /tmp/pr-bootstrap.log; exit 1; }
          [ "$(grep -c 'created keychain item' /tmp/pr-bootstrap.log)" = "5" ] || {
            echo "::error::expected 5 created keychain items"; cat /tmp/pr-bootstrap.log; exit 1
          }

          echo "[run] supervisor with NO arguments (LaunchAgent shape) — hardened binaries"
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" \
              > "$RUNNER_TEMP/pr-supervisor-stdout.log" 2>&1; echo $? > /tmp/pr-supervisor.exit ) &

          echo "[poll] bounded wait (300s) for healthy"
          HEALTHY=0
          for i in $(seq 1 600); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            if [ "$S" = "failed" ]; then break; fi
            if [ -f /tmp/pr-supervisor.exit ]; then break; fi
            sleep 0.5
          done
          echo "final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::hardened supervisor did not reach healthy from the odd install location"
            echo "--- supervisor.log:"; tail -30 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
            echo "--- provision.log:"; tail -30 "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || true
            echo "--- stdout:"; tail -40 "$RUNNER_TEMP/pr-supervisor-stdout.log" 2>/dev/null || true
            exit 1
          fi

          PGBIN="$INSTALLED/Contents/Resources/runtime/postgresql/17/bin"
          echo "[proof] PG healthy on the SHIPPED production port (55432)"
          "$PGBIN/pg_isready" -h 127.0.0.1 -p 55432
          echo "[proof] authenticated SELECT 1 as the app role (seeded credential)"
          ONE=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p 55432 -U medivault -d medivault -t -A -c "SELECT 1")
          [ "$ONE" = "1" ] || { echo "::error::authenticated SELECT 1 failed"; exit 1; }
          MIG=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p 55432 -U medivault -d medivault -t -A -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          echo "applied migrations: $MIG (expect 8)"
          [ "$MIG" = "8" ] || { echo "::error::expected 8 applied migrations"; exit 1; }

          echo "[proof] the API runs on the PACKAGED hardened node binary"
          pgrep -f "$INSTALLED/Contents/Resources/runtime/nodejs/bin/node" >/dev/null || {
            echo "::error::the API is not running on the packaged node binary"; exit 1
          }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/health" || echo 000)
          echo "/health -> $CODE"; test "$CODE" = "200"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/ready" || echo 000)
          echo "/ready -> $CODE"; test "$CODE" = "200"
          test -f "$SUP/config/provisioned.json"
          echo "HARDENED-LIFECYCLE-GREEN (odd location + shipped relocatable config + hardened runtime)"

          echo "[shutdown] graceful SIGTERM + zero owned orphans"
          kill -TERM "$(jq -r .pid "$STATUS")"
          for i in $(seq 1 180); do [ -f /tmp/pr-supervisor.exit ] && break; sleep 0.5; done
          EXIT_CODE=$(cat /tmp/pr-supervisor.exit 2>/dev/null || echo MISSING)
          echo "supervisor exit code: $EXIT_CODE (expect 0)"
          [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor did not exit 0"; exit 1; }
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "zero postgres orphans" || { echo "$LEFT"; exit 1; }
          [ ! -f "$SUP/PostgreSQL/17/data/postmaster.pid" ] || {
            echo "::error::postmaster.pid still present"; exit 1
          }

      - name: Production-readiness summary (machine-readable)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/node-allowjit.env
          . /tmp/pr-installed.env
          {
            echo "PR-ARCH: ${{ matrix.expected_uname }}"
            echo "PR-OS: macOS 26 (native)"
            echo "PR-NODE-ALLOW-JIT: $NODE_ALLOW_JIT"
            echo "PR-INSTALL-LOCATION: $INSTALLED"
            echo "PR-DEFAULT-CONFIG: relocatable GREEN"
            echo "PR-HARDENED-LIFECYCLE: GREEN"
            echo "PR-SIGNING-MODE: structural ad-hoc (production identity pending credentials)"
            echo "PR-SMAPPSERVICE: helper + plist + status model + no-legacy GREEN"
          } | tee /tmp/pr-summary.txt

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pkill -f 'OddPlaces/deep/MediVault.app/Contents/MacOS/mediavault-supervisor' 2>/dev/null || true
          pkill -f 'MediVault.app/Contents/MacOS/MediVault' 2>/dev/null || true
          d="$HOME/Library/Application Support/MediVault/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            PGRT=""
            for cand in "$RUNNER_TEMP/OddPlaces/deep/MediVault.app/Contents/Resources/runtime/postgresql/17/bin" \
                        "/Users/runner/work/_temp/MediVault-installed.app/Contents/Resources/runtime/postgresql/17/bin"; do
              [ -x "$cand/pg_ctl" ] && PGRT="$cand" && break
            done
            [ -n "$PGRT" ] && "$PGRT/pg_ctl" -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }
          rm -rf "/Users/runner/Applications/MediVault.app" \
                 "$HOME/Library/Application Support/MediVault" \
                 "$HOME/Library/Logs/MediVault" 2>/dev/null || true
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security delete-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || true
          done

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/pr-summary.txt
            /tmp/node-allowjit.env
            /tmp/sign-strictfirst.log
            /tmp/sign-allowjit.log
            /tmp/jit-strict.out
            /tmp/jit-allowjit.out
            /tmp/verify-signatures.log
            /tmp/smappservice-selftest.log
            /tmp/supervisor-tests.log
            /tmp/desktop-tests.log
            /tmp/macho-gate-pr-*.txt
            /tmp/macho-gate-helper.txt
            /tmp/tauri-build.log
            /tmp/pr-bootstrap.log
            /tmp/pr-status.out
            /Users/runner/work/_temp/MediVault-macOS-${{ matrix.label }}.dmg.sha256
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # localhost-security mode — the Model A localhost-security contract
  # (approved 2026-09-08), implemented and proven BEFORE Apple credentials:
  # API 127.0.0.1-only, PostgreSQL 127.0.0.1-only, LAN OFF, strict Origin
  # validation, auth/session/CSRF preserved, NO trustedLocalTlsTermination,
  # NO TLS-terminator claim, NO 0.0.0.0, trustProxy=false — with the unsafe
  # non-loopback matrix failing closed at BOTH levels.
  # Contract: acceptance/macos-localhost-security-contract.md
  # ---------------------------------------------------------------------------
  localhost-security:
    name: "localhost-security (${{ matrix.label }})"
    if: github.event.inputs.mode == 'localhost-security'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'
      MV_APP_SUPPORT: '/Users/runner/work/_temp/mv-localhost-appsupport'
      MV_PGPORT: '55432'
      MV_API_PORT: '3001'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native arch proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion)"
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      # ------------------------------------------------------------------
      # Unit tests FIRST (fail fast): the supervisor's Model A loopback
      # config gate + the API's localhost-production mode matrix.
      # ------------------------------------------------------------------
      - name: Supervisor unit tests (incl. the Model A loopback fail-closed gate)
        shell: bash
        run: |
          set -euo pipefail
          cd macos/supervisor
          cargo test --locked 2>&1 | tee /tmp/ls-supervisor-tests.log
          test "$(grep -c 'test result: ok' /tmp/ls-supervisor-tests.log)" -ge 1
          grep -q 'rejects_non_loopback_api_host_fail_closed' /tmp/ls-supervisor-tests.log
          grep -q 'rejects_wildcard_and_remote_postgres_hosts_fail_closed' /tmp/ls-supervisor-tests.log
          grep -q 'accepts_ipv6_loopback_and_localhost_name_past_the_gate' /tmp/ls-supervisor-tests.log

      - name: Model A unit tests (localhost-production mode, fail-closed matrix)
        shell: bash
        run: |
          set -euo pipefail
          # First-red fix (run 34235952324, both arches): vitest 4 writes ANSI
          # SGR codes into piped output on CI runners, so the summary-line
          # grep failed although all 24 tests passed. NO_COLOR removes the
          # codes at the source and the assertions grep an ANSI-stripped
          # copy — belt and braces, proven against the raw bytes of that run.
          NO_COLOR=1 bunx vitest run tests/model-a-localhost-production.test.ts 2>&1 | tee /tmp/ls-model-a-tests.log
          ESC=$(printf '\033')
          sed "s/${ESC}\[[0-9;]*[a-zA-Z]//g" /tmp/ls-model-a-tests.log > /tmp/ls-model-a-tests.clean.log
          grep -q 'tests/model-a-localhost-production.test.ts' /tmp/ls-model-a-tests.clean.log
          grep -qE 'Tests[[:space:]]+[0-9]+ passed \([0-9]+\)' /tmp/ls-model-a-tests.clean.log

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/medivault-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/prisma-cli-stage"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # ------------------------------------------------------------------
      # The synthetic .app (no Tauri shell needed for this contract — the
      # object under test is the supervisor + API + PG runtime posture).
      # ------------------------------------------------------------------
      - name: Stage the PG bundle + supervisor into the synthetic app
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/MediVault.app/Contents/Resources/runtime/postgresql/17"
          PG_INSTALL="$PG_INSTALL" BUNDLE="$BUNDLE" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh
          echo "BUNDLE=$BUNDLE" | tee /tmp/ls-bundle.env

      - name: Assemble the complete MediVault.app tree
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/api-stage.env
          . /tmp/prisma-stage.env
          . /tmp/node-tarball.env
          APP_ROOT="$RUNNER_TEMP/MediVault.app"
          APP_ROOT="$APP_ROOT" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            bash macos/scripts/stage-app-bundle.sh
          echo "APP_ROOT=$APP_ROOT" | tee /tmp/ls-app-root.env

      - name: Mach-O gate — node + supervisor + PG
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/ls-app-root.env
          MACHO_RECORDS=/tmp/macho-gate-ls-1.txt bash macos/scripts/macho-gate.sh "$APP_ROOT/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-ls-2.txt bash macos/scripts/macho-gate.sh "$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/macho-gate-ls-3.txt bash macos/scripts/macho-gate.sh "$APP_ROOT/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      # ------------------------------------------------------------------
      # The Model A production-shaped config: loopback hosts, the SHIPPED
      # production ports (PG 55432, API 3001) and the SHIPPED origin
      # semantics (tauri://localhost + the dev origin).
      # ------------------------------------------------------------------
      - name: Write the localhost-security supervisor config
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/ls-app-root.env
          cat > "$APP_ROOT/Contents/Resources/supervisor-config.json" <<EOF
          {
            "version": 1,
            "paths": {
              "pg_bundle": "$APP_ROOT/Contents/Resources/runtime/postgresql/17",
              "node_binary": "$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node",
              "api_entry": "$APP_ROOT/Contents/Resources/api/dist/index.js",
              "api_working_dir": "$APP_ROOT/Contents/Resources/api",
              "app_support_dir": "$MV_APP_SUPPORT",
              "log_dir": "$MV_APP_SUPPORT/logs"
            },
            "postgres": {
              "host": "127.0.0.1",
              "port": $MV_PGPORT,
              "superuser": "postgres",
              "app_user": "medivault",
              "app_database": "medivault",
              "pgdata_rel": "PostgreSQL/17/data"
            },
            "api": { "host": "127.0.0.1", "port": $MV_API_PORT, "allowed_origins": "tauri://localhost,http://localhost:3000" },
            "secrets": { "source": "keychain" },
            "provisioner": {
              "entry": "$APP_ROOT/Contents/Resources/provision/dist/index.js",
              "prisma_cli": "$APP_ROOT/Contents/Resources/prisma-cli/node_modules/prisma/build/index.js",
              "prisma_schema": "$APP_ROOT/Contents/Resources/prisma/schema.prisma",
              "timeout_sec": 600
            },
            "limits": { "pg_start_timeout_sec": 120, "api_start_timeout_sec": 90, "health_interval_sec": 5 }
          }
          EOF
          cat "$APP_ROOT/Contents/Resources/supervisor-config.json"
          echo "CONFIG=$APP_ROOT/Contents/Resources/supervisor-config.json" | tee /tmp/ls-config.env

      - name: Generate CI keychain seed values (values never printed)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "export MV_KEYCHAIN_SEED_PG_APP_PASSWORD=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_PG_BOOTSTRAP=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_MASTER_KEY=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_JWT_SECRET=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_CSRF_SECRET=$(openssl rand -hex 32)"
          } > /tmp/ls-seeds.env
          chmod 600 /tmp/ls-seeds.env
          echo "seed file written (values never printed): /tmp/ls-seeds.env"

      - name: Keychain bootstrap (REAL login keychain, 5/5)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/ls-app-root.env
          . /tmp/ls-config.env
          . /tmp/ls-seeds.env
          "$APP_ROOT/Contents/MacOS/mediavault-supervisor" bootstrap-secrets --config "$CONFIG" | tee /tmp/ls-bootstrap.log
          [ "$(grep -c 'created keychain item' /tmp/ls-bootstrap.log)" = "5" ] || {
            echo "::error::expected 5 created keychain items"; cat /tmp/ls-bootstrap.log; exit 1
          }
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security find-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || {
              echo "::error::keychain item missing: $account"
              exit 1
            }
          done
          echo "keychain items: 5/5 present"

      # ------------------------------------------------------------------
      # TESTS 1 + 12: the APPROVED localhost production configuration
      # STARTS under full supervisor management (delegated CLEAN
      # provisioning → healthy → /health + /ready 200 on the packaged
      # hardened Node, production ports).
      # ------------------------------------------------------------------
      - name: "T1/T12: run the packaged bundle — supervisor-managed startup to healthy"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/ls-app-root.env
          . /tmp/ls-config.env
          . /tmp/ls-seeds.env
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          rm -rf "$MV_APP_SUPPORT"
          rm -f /tmp/ls-supervisor.exit

          ( "$APP_ROOT/Contents/MacOS/mediavault-supervisor" run --config "$CONFIG" \
              > "$RUNNER_TEMP/ls-supervisor-stdout.log" 2>&1; echo $? > /tmp/ls-supervisor.exit ) &

          echo "[poll] bounded wait (300s) for healthy — full packaged bootstrap"
          HEALTHY=0
          for i in $(seq 1 600); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            if [ "$S" = "failed" ]; then break; fi
            if [ -f /tmp/ls-supervisor.exit ]; then break; fi
            sleep 0.5
          done
          echo "final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::packaged bundle did not reach healthy under Model A"
            echo "--- supervisor.log:"; tail -30 "$MV_APP_SUPPORT/logs/supervisor.log" 2>/dev/null || true
            echo "--- provision.log:"; tail -30 "$MV_APP_SUPPORT/logs/provision.log" 2>/dev/null || true
            echo "--- api.log:"; tail -30 "$MV_APP_SUPPORT/logs/api.log" 2>/dev/null || true
            echo "--- stdout:"; tail -40 "$RUNNER_TEMP/ls-supervisor-stdout.log" 2>/dev/null || true
            exit 1
          fi

          echo "[proof] PG healthy on the production port $MV_PGPORT"
          "$APP_ROOT/Contents/Resources/runtime/postgresql/17/bin/pg_isready" -h 127.0.0.1 -p "$MV_PGPORT"
          echo "[proof] API /health + /ready 200 on the production port $MV_API_PORT"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$MV_API_PORT/health" || echo 000)
          echo "/health -> $CODE"; test "$CODE" = "200"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$MV_API_PORT/ready" || echo 000)
          echo "/ready -> $CODE"; test "$CODE" = "200"
          MIG=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$APP_ROOT/Contents/Resources/runtime/postgresql/17/bin/psql" \
            -h 127.0.0.1 -p "$MV_PGPORT" -U medivault -d medivault -t -A \
            -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          echo "applied migrations: $MIG (expect 8)"
          [ "$MIG" = "8" ] || { echo "::error::expected 8 applied migrations"; exit 1; }
          echo "T1/T12-STARTUP-GREEN (approved localhost production config, supervisor-managed)"

      # ------------------------------------------------------------------
      # TESTS 2/3/4/5/6: the live network + environment posture.
      # ------------------------------------------------------------------
      - name: "T2-T6: Model A live posture (exact loopback listeners, forbidden env, trustProxy)"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/ls-app-root.env
          . /tmp/ls-config.env
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          API_PID=$(jq -r '.api_pid // empty' "$STATUS")
          PG_PID=$(jq -r '.pg_pid // empty' "$STATUS")
          [ -n "$API_PID" ] && [ -n "$PG_PID" ] || { echo "::error::status file missing api_pid/pg_pid"; jq . "$STATUS"; exit 1; }
          echo "API pid: $API_PID, PG pid: $PG_PID"

          echo "== T2: the API listens ONLY on 127.0.0.1:$MV_API_PORT =="
          API_LISTENERS=$(lsof -nP -iTCP:"$MV_API_PORT" -sTCP:LISTEN | tail -n +2 | awk '{print $1" pid="$2" addr="$(NF-1)}')
          echo "API listeners:"; echo "$API_LISTENERS"
          [ -n "$API_LISTENERS" ] || { echo "::error::no API listener found on port $MV_API_PORT"; exit 1; }
          BAD=$(echo "$API_LISTENERS" | grep -v "127.0.0.1:$MV_API_PORT" || true)
          [ -z "$BAD" ] || { echo "::error::API listener on a non-contract address:"; echo "$BAD"; exit 1; }
          echo "$API_LISTENERS" | grep -q "pid=$API_PID" || { echo "::error::the API listener is not owned by the supervised API process"; exit 1; }

          echo "== T3: PostgreSQL listens ONLY on 127.0.0.1:$MV_PGPORT =="
          PG_LISTENERS=$(lsof -nP -iTCP:"$MV_PGPORT" -sTCP:LISTEN | tail -n +2 | awk '{print $1" pid="$2" addr="$(NF-1)}')
          echo "PG listeners:"; echo "$PG_LISTENERS"
          [ -n "$PG_LISTENERS" ] || { echo "::error::no PG listener found on port $MV_PGPORT"; exit 1; }
          BAD=$(echo "$PG_LISTENERS" | grep -v "127.0.0.1:$MV_PGPORT" || true)
          [ -z "$BAD" ] || { echo "::error::PG listener on a non-contract address:"; echo "$BAD"; exit 1; }

          echo "== T4: NO wildcard / non-loopback listener for the supervised tree =="
          WILD=$(lsof -nP -iTCP -sTCP:LISTEN | awk '{print $(NF-1)}' | grep -E '^\*:' || true)
          WILD_OURS=$(echo "$WILD" | grep -E ":(3001|55432)$" || true)
          [ -z "$WILD_OURS" ] || { echo "::error::wildcard listener on a contract port:"; echo "$WILD_OURS"; exit 1; }
          for pid in "$API_PID" "$PG_PID"; do
            # First-red fix (run 34236597907, both arches): without -a, lsof
            # ORs the process selection (-p) with the network selection
            # (-iTCP), so the pid's non-TCP fds (kqueues, pipes — 'count=0,',
            # 'unit', '0t0' junk fields) pollute the address column and the
            # non-loopback grep trips. -a ANDs the selectors; the awk also
            # extracts the address ONLY from true '(LISTEN)' lines.
            OWNED=$(lsof -a -nP -p "$pid" -iTCP -sTCP:LISTEN 2>/dev/null | tail -n +2 | awk '$NF=="(LISTEN)"{print $(NF-1)}' || true)
            [ -z "$OWNED" ] && continue
            BAD=$(echo "$OWNED" | grep -v '^127\.0\.0\.1:' || true)
            [ -z "$BAD" ] || { echo "::error::pid $pid owns a NON-loopback listener (0.0.0.0/::/LAN):"; echo "$BAD"; exit 1; }
          done
          echo "T2/T3/T4-LISTENERS-GREEN (exactly 127.0.0.1:$MV_API_PORT + 127.0.0.1:$MV_PGPORT; no wildcard, no LAN)"

          echo "== T5: TRUSTED_LOCAL_TLS_TERMINATION absent / MEDIVAULT_LOCALHOST_ONLY present =="
          # Direct process-environment read (macOS: ps 'e' modifier). The
          # output contains SECRET values — capture WITHOUT printing and
          # assert on variable NAMES only.
          PS_ENV="$(ps eww -o command= -p "$API_PID" 2>/dev/null || true)"
          if printf '%s' "$PS_ENV" | grep -q 'MEDIVAULT_LOCALHOST_ONLY'; then
            if printf '%s' "$PS_ENV" | grep -q 'TRUSTED_LOCAL_TLS_TERMINATION'; then
              echo "::error::TRUSTED_LOCAL_TLS_TERMINATION is PRESENT in the live API environment (forbidden by Model A)"
              exit 1
            fi
            echo "T5-ENV-DIRECT-GREEN (MEDIVAULT_LOCALHOST_ONLY present; TRUSTED_LOCAL_TLS_TERMINATION absent — checked on the live process env, values never printed)"
          else
            # ps env display unavailable on this runner: the startup
            # fail-closed contract stands as the proof — the API reaches
            # healthy ONLY in localhost-production mode, which CRASHES on
            # TRUSTED_LOCAL_TLS_TERMINATION=true (proven in the T11 matrix
            # below); the MODEL-A startup line is the runtime assertion.
            grep -q 'MODEL-A-LOCALHOST-PRODUCTION' "$MV_APP_SUPPORT/logs/api.log" || {
              echo "::error::MODEL-A-LOCALHOST-PRODUCTION startup line missing from api.log"
              tail -20 "$MV_APP_SUPPORT/logs/api.log" 2>/dev/null || true
              exit 1
            }
            echo "T5-ENV-CONTRACT-GREEN (ps env display unavailable; startup fail-closed contract + MODEL-A startup line prove the forbidden flag absent)"
          fi

          echo "== T6: trustProxy is FALSE (the API's own startup posture) =="
          grep -q 'MODEL-A-LOCALHOST-PRODUCTION' "$MV_APP_SUPPORT/logs/api.log" || {
            echo "::error::MODEL-A-LOCALHOST-PRODUCTION startup line missing from api.log"
            exit 1
          }
          grep -q '"trustProxy":false' "$MV_APP_SUPPORT/logs/api.log" || {
            echo "::error::trustProxy is not false in the Model A startup posture"
            grep 'MODEL-A-LOCALHOST-PRODUCTION' "$MV_APP_SUPPORT/logs/api.log" || true
            exit 1
          }
          echo "T6-TRUSTPROXY-GREEN (false — no proxy exists; X-Forwarded-* never trusted)"
          echo "T2-T6-LIVE-POSTURE-GREEN"

      # ------------------------------------------------------------------
      # TESTS 7/8/9/10: Origin + auth/session/CSRF behavior (live HTTP).
      # ------------------------------------------------------------------
      - name: "T7-T10: Origin policy + auth/session/CSRF live proofs"
        shell: bash
        run: |
          set -euo pipefail
          API="http://127.0.0.1:$MV_API_PORT"
          JAR="$RUNNER_TEMP/ls-cookies.txt"
          rm -f "$JAR"

          echo "== T7: the VALID MediVault desktop Origin succeeds =="
          HDRS=$(curl -s -D - -o /dev/null -H 'Origin: tauri://localhost' "$API/health")
          echo "$HDRS" | head -1 | grep -q ' 200 ' || { echo "::error::valid-origin /health not 200"; echo "$HDRS"; exit 1; }
          echo "$HDRS" | grep -qi '^access-control-allow-origin: tauri://localhost' || {
            echo "::error::CORS grant missing for the desktop origin"; echo "$HDRS"; exit 1
          }
          echo "T7-VALID-ORIGIN-GREEN (tauri://localhost granted)"

          echo "== T8: hostile / unapproved Origins are rejected =="
          # (a) state-changing endpoint + hostile Origin → app-level 403
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H 'Origin: https://evil.invalid' \
            -H 'Content-Type: application/json' -d '{}' "$API/api/auth/setup" || echo 000)
          echo "hostile-origin POST /api/auth/setup -> $CODE (expect 403)"
          [ "$CODE" = "403" ] || { echo "::error::hostile Origin was NOT rejected by the app"; exit 1; }
          # (b) state-changing endpoint with NO Origin → 403 (Origin is REQUIRED)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H 'Content-Type: application/json' \
            -d '{}' "$API/api/auth/setup" || echo 000)
          echo "no-origin POST /api/auth/setup -> $CODE (expect 403)"
          [ "$CODE" = "403" ] || { echo "::error::missing Origin was NOT rejected"; exit 1; }
          # (c) read-side: hostile Origin gets NO CORS grant (browser-blocked)
          HDRS=$(curl -s -D - -o /dev/null -H 'Origin: https://evil.invalid' "$API/health")
          if echo "$HDRS" | grep -qi '^access-control-allow-origin:'; then
            echo "::error::CORS grant leaked to a hostile origin"; echo "$HDRS"; exit 1
          fi
          # (d) preflight with hostile Origin gets NO CORS grant
          HDRS=$(curl -s -D - -o /dev/null -X OPTIONS -H 'Origin: https://evil.invalid' \
            -H 'Access-Control-Request-Method: POST' "$API/api/auth/setup")
          if echo "$HDRS" | grep -qi '^access-control-allow-origin:'; then
            echo "::error::preflight CORS grant leaked to a hostile origin"; echo "$HDRS"; exit 1
          fi
          echo "T8-HOSTILE-ORIGIN-REJECTED-GREEN (403 app-level + no CORS grant + no preflight grant)"

          echo "== T9: authentication + session protections remain active =="
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/auth/me" || echo 000)
          echo "unauthenticated GET /api/auth/me -> $CODE (expect 401)"
          [ "$CODE" = "401" ] || { echo "::error::auth not enforced (expected 401)"; exit 1; }
          SETUP=$(curl -s "$API/api/auth/setup")
          echo "setup check: $SETUP"
          echo "$SETUP" | grep -q '"needsSetup":true' || { echo "::error::expected a fresh DB (needsSetup true)"; exit 1; }

          echo "== T10: session issue + CSRF protections live =="
          # First admin via the app's own setup route (valid Origin required) → session + csrf cookies
          CODE=$(curl -s -o /tmp/ls-setup-body.json -w "%{http_code}" -c "$JAR" -X POST \
            -H 'Origin: tauri://localhost' -H 'Content-Type: application/json' \
            -d '{"name":"Model A CI","email":"model-a@medivault.local","password":"MediVault!ModelA2026"}' \
            "$API/api/auth/setup" || echo 000)
          echo "POST /api/auth/setup -> $CODE (expect 201)"
          [ "$CODE" = "201" ] || { echo "::error::first-admin setup failed"; cat /tmp/ls-setup-body.json; exit 1; }
          grep -q 'mvlt_session' "$JAR" || { echo "::error::session cookie not issued"; cat "$JAR"; exit 1; }
          grep -q 'mvlt_csrf' "$JAR" || { echo "::error::csrf cookie not issued"; cat "$JAR"; exit 1; }
          # Authenticated request with the session cookie works
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -b "$JAR" -H 'Origin: tauri://localhost' "$API/api/auth/me" || echo 000)
          echo "authenticated GET /api/auth/me -> $CODE (expect 200)"
          [ "$CODE" = "200" ] || { echo "::error::session authentication failed"; exit 1; }
          # CSRF-negative: mutating request WITHOUT the X-CSRF-Token header → 403
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -b "$JAR" -X POST \
            -H 'Origin: tauri://localhost' -H 'Content-Type: application/json' -d '{}' \
            "$API/api/auth/logout" || echo 000)
          echo "logout WITHOUT X-CSRF-Token -> $CODE (expect 403)"
          [ "$CODE" = "403" ] || { echo "::error::CSRF protection not enforced (expected 403)"; exit 1; }
          # CSRF extraction (double-submit): the header value for the flows below
          CSRF=$(awk '$6=="mvlt_csrf" {print $7}' "$JAR")
          [ -n "$CSRF" ] || { echo "::error::could not read the csrf cookie from the jar"; cat "$JAR"; exit 1; }
          # Hostile Origin beats a fully-valid session+CSRF (origin gate first).
          # (First-red fix of run 34239760593: this must run BEFORE the
          # CSRF-positive logout — the successful logout revokes the session,
          # and a dead session answers 401 from the auth guard, which proves
          # nothing about the ORIGIN gate. With a live session the auth guard
          # passes and the origin gate must be the one to answer 403.)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -b "$JAR" -X POST \
            -H 'Origin: https://evil.invalid' -H 'Content-Type: application/json' -d '{}' \
            -H "X-CSRF-Token: $CSRF" "$API/api/auth/sessions/revoke-all" || echo 000)
          echo "hostile-origin revoke-all WITH valid session+CSRF -> $CODE (expect 403)"
          [ "$CODE" = "403" ] || { echo "::error::hostile Origin overrode a valid session"; exit 1; }
          # CSRF-positive: the double-submit token completes the logout.
          # (-d '{}' matches the CSRF-negative control and the real frontend:
          # Fastify answers 400 to a bodyless application/json POST before the
          # route ever runs — first-red fix of run 34238773249. Runs LAST —
          # it consumes the session.)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -b "$JAR" -X POST \
            -H 'Origin: tauri://localhost' -H 'Content-Type: application/json' -d '{}' \
            -H "X-CSRF-Token: $CSRF" "$API/api/auth/logout" || echo 000)
          echo "logout WITH X-CSRF-Token -> $CODE (expect 200)"
          [ "$CODE" = "200" ] || { echo "::error::CSRF-positive logout failed"; exit 1; }
          echo "T9/T10-AUTH-SESSION-CSRF-GREEN"

      # ------------------------------------------------------------------
      # TEST 11: the unsafe non-loopback production matrix fails closed
      # at BOTH levels — API startup (packaged Node + packaged API) and
      # supervisor config resolution.
      # ------------------------------------------------------------------
      - name: "T11: unsafe non-loopback production configurations FAIL CLOSED"
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/ls-app-root.env
          . /tmp/ls-config.env
          . /tmp/ls-seeds.env
          NODE="$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node"
          API_ENTRY="$APP_ROOT/Contents/Resources/api/dist/index.js"
          [ -x "$NODE" ] && [ -f "$API_ENTRY" ] || { echo "::error::packaged node/API missing"; exit 1; }

          dburl="postgresql://medivault:$MV_KEYCHAIN_SEED_PG_APP_PASSWORD@127.0.0.1:$MV_PGPORT/medivault"

          api_neg() { # label, extra-env assignments…
            LABEL="$1"; shift
            set +e
            OUT=$(env "$@" NODE_ENV=production MEDIVAULT_LOCALHOST_ONLY=true \
              PORT=3999 DATABASE_URL="$dburl" \
              "$NODE" "$API_ENTRY" 2>&1)
            RC=$?
            set -e
            echo "[$LABEL] exit=$RC"
            echo "$OUT" | tail -3
            [ "$RC" -ne 0 ] || { echo "::error::$LABEL did NOT fail closed (exit 0)"; exit 1; }
            echo "$OUT" | grep -q 'FATAL (localhost-production mode)' || {
              echo "::error::$LABEL failed for an unexpected reason (not the Model A gate)"; exit 1
            }
          }

          echo "== T11a: API startup — non-loopback bind hosts fail closed =="
          api_neg "HOST=0.0.0.0"      HOST=0.0.0.0 ALLOWED_ORIGINS=tauri://localhost
          api_neg "HOST=::"            HOST=:: ALLOWED_ORIGINS=tauri://localhost
          api_neg "HOST=LAN address"   HOST=192.168.1.20 ALLOWED_ORIGINS=tauri://localhost
          echo "== T11b: API startup — forbidden flag / origin policy combinations fail closed =="
          api_neg "TRUSTED_LOCAL_TLS_TERMINATION=true" HOST=127.0.0.1 ALLOWED_ORIGINS=tauri://localhost TRUSTED_LOCAL_TLS_TERMINATION=true
          api_neg "HTTPS=true"          HOST=127.0.0.1 ALLOWED_ORIGINS=tauri://localhost HTTPS=true
          api_neg "wildcard origins"    HOST=127.0.0.1 'ALLOWED_ORIGINS=*'
          api_neg "non-local origins"   HOST=127.0.0.1 ALLOWED_ORIGINS=https://evil.invalid
          api_neg "missing origins"     HOST=127.0.0.1 ALLOWED_ORIGINS=

          echo "== T11c: supervisor config resolution — non-loopback hosts fail closed =="
          SUP="$APP_ROOT/Contents/MacOS/mediavault-supervisor"
          sup_neg() { # label, jq filter
            LABEL="$1"; FILTER="$2"
            BADCFG="$RUNNER_TEMP/ls-bad-config.json"
            jq "$FILTER" "$CONFIG" > "$BADCFG"
            set +e
            OUT=$("$SUP" status --config "$BADCFG" 2>&1)
            RC=$?
            set -e
            echo "[$LABEL] exit=$RC"
            echo "$OUT" | tail -2
            [ "$RC" -ne 0 ] || { echo "::error::$LABEL did NOT fail closed (exit 0)"; exit 1; }
            echo "$OUT" | grep -q 'loopback' || {
              echo "::error::$LABEL failed for an unexpected reason (not the loopback gate)"; exit 1
            }
          }
          sup_neg "api.host=0.0.0.0"        '.api.host = "0.0.0.0"'
          sup_neg "api.host=LAN address"    '.api.host = "192.168.1.20"'
          sup_neg "postgres.host=0.0.0.0"   '.postgres.host = "0.0.0.0"'
          sup_neg "postgres.host=::"        '.postgres.host = "::"'
          sup_neg "postgres.host=remote"    '.postgres.host = "db.lan.invalid"'
          echo "T11-FAIL-CLOSED-GREEN (API startup + supervisor resolution, both levels)"

      - name: "T12 (tail): graceful SIGTERM + zero owned orphans"
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$MV_APP_SUPPORT/runtime-state/supervisor-status.json"
          kill -TERM "$(jq -r .pid "$STATUS")"
          for i in $(seq 1 180); do [ -f /tmp/ls-supervisor.exit ] && break; sleep 0.5; done
          EXIT_CODE=$(cat /tmp/ls-supervisor.exit 2>/dev/null || echo MISSING)
          echo "supervisor exit code: $EXIT_CODE (expect 0)"
          [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor did not exit 0"; exit 1; }
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "zero postgres orphans" || { echo "$LEFT"; exit 1; }
          [ ! -f "$MV_APP_SUPPORT/PostgreSQL/17/data/postmaster.pid" ] || {
            echo "::error::postmaster.pid still present"; exit 1
          }
          echo "T12-SHUTDOWN-GREEN (graceful ladder, zero orphans)"

      - name: Localhost-security summary (machine-readable)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "LS-ARCH: ${{ matrix.expected_uname }}"
            echo "LS-OS: macOS 26 (native)"
            echo "LS-CONTRACT: Model A localhost-security (approved 2026-09-08)"
            echo "LS-T1-STARTUP: GREEN"
            echo "LS-T2-API-LISTEN: 127.0.0.1:$MV_API_PORT only"
            echo "LS-T3-PG-LISTEN: 127.0.0.1:$MV_PGPORT only"
            echo "LS-T4-NO-WILDCARD-NO-LAN: GREEN"
            echo "LS-T5-TRUSTED-LOCAL-TLS-TERMINATION: ABSENT"
            echo "LS-T6-TRUST-PROXY: FALSE"
            echo "LS-T7-VALID-ORIGIN: GREEN"
            echo "LS-T8-HOSTILE-ORIGIN: REJECTED"
            echo "LS-T9-AUTH-SESSION: GREEN"
            echo "LS-T10-CSRF: GREEN"
            echo "LS-T11-UNSAFE-CONFIG: FAILS CLOSED"
            echo "LS-T12-SUPERVISOR-STARTUP-SHUTDOWN: GREEN"
          } | tee /tmp/ls-summary.txt

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pkill -f 'MediVault.app/Contents/MacOS/mediavault-supervisor' 2>/dev/null || true
          pkill -f 'MediVault.app/Contents/Resources/runtime/nodejs' 2>/dev/null || true
          d="$MV_APP_SUPPORT/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            PGRT="$RUNNER_TEMP/MediVault.app/Contents/Resources/runtime/postgresql/17/bin"
            [ -x "$PGRT/pg_ctl" ] && "$PGRT/pg_ctl" -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }
          rm -rf "$MV_APP_SUPPORT" 2>/dev/null || true
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security delete-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || true
          done

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localhost-security-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/ls-summary.txt
            /tmp/ls-supervisor-tests.log
            /tmp/ls-model-a-tests.log
            /tmp/macho-gate-ls-*.txt
            /tmp/ls-bootstrap.log
            /tmp/ls-setup-body.json
            ${{ env.MV_APP_SUPPORT }}/logs/supervisor.log
            ${{ env.MV_APP_SUPPORT }}/logs/provision.log
            ${{ env.MV_APP_SUPPORT }}/logs/api.log
            ${{ env.MV_APP_SUPPORT }}/logs/postgres.log
            /tmp/ls-bad-config.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # zero-cost-release mode — the ZERO-COST release artifact gate
  # (acceptance/macos-zero-cost-release-contract.md): release ad-hoc
  # signing (Hardened Runtime, inside-out, zero entitlements), the
  # release DMG (MediVault-arm64.dmg / MediVault-x86_64.dmg) + SHA-256
  # sidecar + deterministic integrity manifest, the OFFLINE pre-install
  # verification proof (verify-release.sh — self-audited network-free)
  # plus tamper negative controls, Gatekeeper assessment recorded as
  # information (ad-hoc is NOT trusted — by contract), and the hardened
  # launch lifecycle from the canonical per-user install of the EXACT
  # release artifact. NO Developer ID, NO notarization, NO Gatekeeper
  # claims; first-install manual approval is the documented contract.
  # ---------------------------------------------------------------------------
  zero-cost-release:
    name: "zero-cost-release (${{ matrix.label }})"
    if: github.event.inputs.mode == 'zero-cost-release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
            artifact_arch: arm64
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
            artifact_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native runner architecture proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion)"
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      - name: Supervisor unit tests (relocatable config resolution)
        shell: bash
        run: |
          set -euo pipefail
          cd macos/supervisor
          cargo test --locked 2>&1 | tee /tmp/zc-supervisor-tests.log
          test "$(grep -c 'test result: ok' /tmp/zc-supervisor-tests.log)" -ge 1
          grep -q 'full_relocatable_resolution_against_a_temp_bundle' /tmp/zc-supervisor-tests.log

      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build (app bundle, per-arch — compiles the SMAppService commands)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/zc-tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/zc-tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/zc-tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Desktop unit tests (SMAppService status mapping, fail-closed parsing)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --bins --locked 2>&1 | tee /tmp/zc-desktop-tests.log
          test "$(grep -c 'test result: ok' /tmp/zc-desktop-tests.log)" -ge 1
          grep -q 'rejects_any_invented_or_future_status_fail_closed' /tmp/zc-desktop-tests.log

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/zc-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/zc-api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/zc-prisma-cli"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/zc-prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/zc-node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Compile the SMAppService helper (swiftc, minOS 13.0)
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          HELPER_OUT="$RUNNER_TEMP/zc-mediavault-launchagent"
          swiftc -O macos/smappservice/medivault-launchagent.swift \
            -target ${{ matrix.expected_uname }}-apple-macos13.0 \
            -o "$HELPER_OUT"
          file "$HELPER_OUT"
          if otool -l "$HELPER_OUT" | grep -q 'path /usr/lib/swift'; then
            install_name_tool -delete_rpath /usr/lib/swift "$HELPER_OUT"
          fi
          codesign --force --sign - "$HELPER_OUT"
          MACHO_RECORDS=/tmp/zc-macho-gate-helper.txt \
            bash macos/scripts/macho-gate.sh "$HELPER_OUT" "${{ matrix.expected_uname }}" 13.0
          echo "HELPER_OUT=$HELPER_OUT" | tee /tmp/zc-smappservice-bin.env

      - name: Merge the backend into the Tauri MediVault.app (relocatable shape)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-tauri-app.env
          . /tmp/zc-node-tarball.env
          . /tmp/zc-api-stage.env
          . /tmp/zc-prisma-stage.env
          . /tmp/zc-smappservice-bin.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            SMAPPSERVICE_BIN="$HELPER_OUT" \
            bash macos/scripts/stage-app-bundle.sh

          echo "APP_ROOT=$APP" | tee /tmp/zc-app-root.env
          echo "--- shipped supervisor-config.json (RELOCATABLE, production ports):"
          cat "$APP/Contents/Resources/supervisor-config.json"
          echo "--- bundle top level:"
          find "$APP" -maxdepth 3 -not -path "*/runtime/postgresql/17/*" | sed "s|$APP|<APP>|" | sort | sed -n '1,40p'

      - name: Prisma engine install-ID hygiene (scrub build-machine paths)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP="$APP_ROOT"
          REPAIRED=0
          while IFS= read -r -d '' f; do
            ID_LINE="$(otool -l "$f" 2>/dev/null | awk '/LC_ID_DYLIB/{id=1} id && $1=="name"{print $2; id=0}' | head -1)"
            if [ -n "$ID_LINE" ] && [[ "$ID_LINE" == /* ]]; then
              base="$(basename "$f")"
              echo "  repair: $(basename "$f") id '$ID_LINE' -> @loader_path/$base"
              install_name_tool -id "@loader_path/$base" "$f"
              codesign --force --sign - "$f" >/dev/null
              REPAIRED=$((REPAIRED + 1))
            fi
          done < <(find "$APP/Contents/Resources/api/node_modules/.prisma" \
                        "$APP/Contents/Resources/prisma-cli/node_modules/@prisma/engines" \
                        -type f -name '*.dylib.node' -print0 2>/dev/null)
          echo "prisma install-IDs repaired: $REPAIRED"
          LEFT=$(find "$APP" -type f -print0 | xargs -0 file 2>/dev/null | grep 'Mach-O' | cut -d: -f1 | while read -r m; do
            otool -L "$m" 2>/dev/null | tail -n +2 | sed 's/(.*//' | grep -E '^/' | grep -vE '^/usr/lib/|^/System/' || true
          done | sort -u)
          if [ -n "$LEFT" ]; then
            echo "::error::absolute (non-system) Mach-O references remain:"
            echo "$LEFT"
            exit 1
          fi
          echo "PRISMA-INSTALL-ID-HYGIENE-GREEN (zero non-system absolute references)"

      - name: Mach-O gates on the merged bundle (all binaries incl. the helper)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP="$APP_ROOT"
          MACHO_RECORDS=/tmp/zc-macho-gate-1.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-2.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-3.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-launchagent" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-4.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-5.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      - name: ZERO-COST RELEASE SIGNING (ad-hoc + Hardened Runtime, inside-out)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP_ROOT="$APP_ROOT" MV_ADHOC_RELEASE=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=0 \
            bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/zc-sign-release.log
          grep -q 'SIGN-ZERO-COST-RELEASE-GREEN' /tmp/zc-sign-release.log
          # The zero-cost honesty contract: the ad-hoc release signature is
          # integrity + Hardened Runtime — NOT identity, NOT Gatekeeper trust.
          if grep -q 'Gatekeeper' /tmp/zc-sign-release.log && grep -qE 'GREEN.*Gatekeeper' /tmp/zc-sign-release.log; then
            echo "::error::a Gatekeeper claim appeared in the signing output — forbidden"
            exit 1
          fi
          echo "ZERO-COST-RELEASE-SIGNING-GREEN (ad-hoc identity, Hardened Runtime, inside-out, zero entitlements)"

      - name: Node JIT proof (strictest-first, hardened Node, NO entitlements)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          NODE="$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node"
          cat > /tmp/zc-jit-proof.js <<'EOF'
          // Hot loop forces V8 JIT tier-up (interpreter -> Sparkplug -> Maglev/TurboFan).
          function hot(n) {
            let acc = 0;
            for (let i = 0; i < n; i++) {
              acc += (i ^ 0x5f) * 31 + (i >>> 3);
            }
            return acc;
          }
          let total = 0;
          for (let round = 0; round < 3000; round++) total += hot(20000);
          if (!Number.isFinite(total) || total === 0) throw new Error('bad result');
          console.log('JIT-WORKLOAD-OK ' + total);
          EOF
          set +e
          "$NODE" /tmp/zc-jit-proof.js > /tmp/zc-jit-strict.out 2>&1
          STRICT_RC=$?
          set -e
          echo "strict (no entitlement) exit: $STRICT_RC"
          cat /tmp/zc-jit-strict.out || true
          if [ "$STRICT_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/zc-jit-strict.out; then
            echo "NODE_ALLOW_JIT=not-needed" | tee /tmp/zc-node-allowjit.env
            echo "V8 executed the JIT-tiering workload under Hardened Runtime WITHOUT any entitlement — zero entitlements ship."
          else
            echo "NODE_ALLOW_JIT=needed" | tee /tmp/zc-node-allowjit.env
            echo "Strict configuration FAILED (exit $STRICT_RC) — re-signing Node with allow-jit (the ONLY entitlement, Node only):"
            APP_ROOT="$APP_ROOT" MV_ADHOC_RELEASE=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=1 \
              bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/zc-sign-allowjit.log
            grep -q 'SIGN-ZERO-COST-RELEASE-GREEN' /tmp/zc-sign-allowjit.log
            set +e
            "$NODE" /tmp/zc-jit-proof.js > /tmp/zc-jit-allowjit.out 2>&1
            AJ_RC=$?
            set -e
            [ "$AJ_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/zc-jit-allowjit.out || {
              echo "::error::Node failed EVEN WITH allow-jit — not an entitlement issue; investigate"
              exit 1
            }
          fi
          cat /tmp/zc-node-allowjit.env

      - name: Recursive signature verification (fail-closed, final release state)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          . /tmp/zc-node-allowjit.env
          FINAL_ALLOW_JIT=0
          [ "$NODE_ALLOW_JIT" = "needed" ] && FINAL_ALLOW_JIT=1
          APP_ROOT="$APP_ROOT" EXPECTED_ARCH="${{ matrix.expected_uname }}" \
            MV_NODE_ALLOW_JIT="$FINAL_ALLOW_JIT" \
            bash macos/scripts/verify-signatures.sh 2>&1 | tee /tmp/zc-verify-signatures.log
          grep -q 'VERIFY-SIGNATURES-GREEN' /tmp/zc-verify-signatures.log

      # ------------------------------------------------------------------
      # The release artifacts: DMG + sidecar + manifest + the offline
      # verification tool itself, then the OFFLINE verification proof
      # against the REAL artifact (the exact doctor-facing flow) with
      # tamper negative controls.
      # ------------------------------------------------------------------
      - name: Offline self-audit of verify-release.sh (no network by construction)
        shell: bash
        run: |
          set -euo pipefail
          bash macos/scripts/verify-release.sh --offline-audit | tee /tmp/zc-offline-audit.log
          grep -q 'OFFLINE-AUDIT-GREEN' /tmp/zc-offline-audit.log

      - name: Build the release DMG (drag layout + shipped disclosure + first-install)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          DMG_OUT="/Users/runner/work/_temp/MediVault-${{ matrix.artifact_arch }}.dmg"
          APP_ROOT="$APP_ROOT" DMG_OUT="$DMG_OUT" \
            RELEASE_DOCS_DIR="$PWD/macos/release" \
            bash macos/scripts/build-release-dmg.sh 2>&1 | tee /tmp/zc-build-release-dmg.log
          grep -q 'BUILD-RELEASE-DMG-GREEN' /tmp/zc-build-release-dmg.log
          echo "DMG_OUT=$DMG_OUT" | tee /tmp/zc-dmg.env
          test -f "$DMG_OUT.sha256"

      - name: Generate the deterministic release integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-dmg.env
          MANIFEST_OUT="/Users/runner/work/_temp/MediVault-${{ matrix.artifact_arch }}.manifest.txt"
          DMG="$DMG_OUT" MANIFEST_OUT="$MANIFEST_OUT" \
            bash macos/scripts/release-manifest.sh 2>&1 | tee /tmp/zc-release-manifest.log
          grep -q 'RELEASE-MANIFEST-GREEN' /tmp/zc-release-manifest.log
          echo "MANIFEST_OUT=$MANIFEST_OUT" | tee /tmp/zc-manifest.env
          echo "--- manifest head:"
          sed -n '1,16p' "$MANIFEST_OUT"

      - name: OFFLINE pre-install verification of the real release artifact
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-dmg.env
          . /tmp/zc-manifest.env
          DMG="$DMG_OUT" MANIFEST="$MANIFEST_OUT" EXPECTED_ARCH="${{ matrix.expected_uname }}" \
            bash macos/scripts/verify-release.sh 2>&1 | tee /tmp/zc-verify-release.log
          grep -q 'VERIFY-RELEASE-GREEN' /tmp/zc-verify-release.log

      - name: Tamper negative controls (verification MUST fail closed)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-dmg.env
          . /tmp/zc-manifest.env
          echo "--- control 1: a corrupted DMG copy must be RED"
          cp "$DMG_OUT" /tmp/zc-tampered.dmg
          printf 'X' >> /tmp/zc-tampered.dmg
          set +e
          DMG=/tmp/zc-tampered.dmg MANIFEST="$MANIFEST_OUT" \
            bash macos/scripts/verify-release.sh > /tmp/zc-tamper1.log 2>&1
          RC1=$?
          set -e
          echo "tampered-DMG verify exit: $RC1 (expect non-zero)"
          [ "$RC1" -ne 0 ] || { echo "::error::a corrupted DMG passed verification"; exit 1; }
          grep -q 'VERIFY-RELEASE-RED' /tmp/zc-tamper1.log || true
          echo "--- control 2: a forged manifest hash must be RED"
          FORGED_HASH="$(printf '0%.0s' $(seq 1 64))"
          sed "s/^dmg-sha256: .*/dmg-sha256: $FORGED_HASH/" "$MANIFEST_OUT" > /tmp/zc-forged.manifest.txt
          set +e
          DMG="$DMG_OUT" MANIFEST=/tmp/zc-forged.manifest.txt \
            bash macos/scripts/verify-release.sh > /tmp/zc-tamper2.log 2>&1
          RC2=$?
          set -e
          echo "forged-manifest verify exit: $RC2 (expect non-zero)"
          [ "$RC2" -ne 0 ] || { echo "::error::a forged manifest passed verification"; exit 1; }
          echo "TAMPER-NEGATIVE-CONTROLS-GREEN (both corruptions detected, fail-closed)"

      - name: Gatekeeper assessment recorded (informational — ad-hoc is NOT trusted, by contract)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-dmg.env
          echo "--- syspolicy_check distribution on the release DMG (expected: REJECTED — the zero-cost contract; recorded, never a failure)"
          if command -v syspolicy_check >/dev/null 2>&1; then
            if syspolicy_check distribution "$DMG_OUT" --verbose > /tmp/zc-syspolicy.log 2>&1; then
              echo "::warning::syspolicy_check ACCEPTED an ad-hoc non-notarized DMG — UNEXPECTED; record and investigate"
            else
              echo "syspolicy_check rejected the ad-hoc DMG (expected; the Open-Anyway manual approval is the acceptance contract)"
            fi
            tail -5 /tmp/zc-syspolicy.log || true
          else
            echo "syspolicy_check not available on this runner — skipped (informational only)"
          fi

      # ------------------------------------------------------------------
      # THE HARDENED LAUNCH LIFECYCLE from the CANONICAL per-user install
      # of the EXACT release artifact (installed from the mounted DMG,
      # like a doctor): CLEAN delegated provisioning with keychain
      # secrets (seeded harness pattern — values never printed), healthy
      # /health + /ready on 127.0.0.1, authenticated SELECT 1, graceful
      # SIGTERM exit 0, zero orphans.
      # ------------------------------------------------------------------
      - name: Generate CI keychain seed values (values never printed)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "export MV_KEYCHAIN_SEED_PG_APP_PASSWORD=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_PG_BOOTSTRAP=$(openssl rand -hex 12)"
            echo "export MV_KEYCHAIN_SEED_MASTER_KEY=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_JWT_SECRET=$(openssl rand -hex 32)"
            echo "export MV_KEYCHAIN_SEED_CSRF_SECRET=$(openssl rand -hex 32)"
          } > /tmp/zc-seeds.env
          chmod 600 /tmp/zc-seeds.env
          echo "seed file written (values never printed): /tmp/zc-seeds.env"

      - name: Install the release artifact at the canonical per-user location
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-dmg.env
          MOUNT="$(mktemp -d /tmp/mv-zc-mount.XXXXXX)"
          hdiutil attach "$DMG_OUT" -mountpoint "$MOUNT" -nobrowse -readonly
          test -x "$MOUNT/MediVault.app/Contents/MacOS/MediVault"
          INSTALLED="/Users/runner/Applications/MediVault.app"
          rm -rf "$INSTALLED"
          mkdir -p /Users/runner/Applications
          cp -R "$MOUNT/MediVault.app" "$INSTALLED"
          hdiutil detach "$MOUNT" -force >/dev/null
          echo "INSTALLED=$INSTALLED" | tee /tmp/zc-installed.env
          echo "canonical per-user install: $INSTALLED"
          codesign --verify --strict "$INSTALLED"
          codesign --verify --strict "$INSTALLED/Contents/MacOS/mediavault-launchagent"

      - name: Hardened lifecycle from the installed release artifact
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-installed.env
          . /tmp/zc-seeds.env
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          rm -rf "$SUP" "$HOME/Library/Logs/MediVault"
          rm -f /tmp/zc-supervisor.exit

          echo "[bootstrap] keychain seeding via the installed supervisor (NO --config — defaults)"
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets \
              > /tmp/zc-bootstrap.log 2>&1 ) || { cat /tmp/zc-bootstrap.log; exit 1; }
          [ "$(grep -c 'created keychain item' /tmp/zc-bootstrap.log)" = "5" ] || {
            echo "::error::expected 5 created keychain items"; cat /tmp/zc-bootstrap.log; exit 1
          }

          echo "[run] supervisor with NO arguments (LaunchAgent shape) — the release artifact"
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" \
              > "$RUNNER_TEMP/zc-supervisor-stdout.log" 2>&1; echo $? > /tmp/zc-supervisor.exit ) &

          echo "[poll] bounded wait (600s) for healthy"
          HEALTHY=0
          for i in $(seq 1 1200); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            if [ "$S" = "failed" ]; then break; fi
            if [ -f /tmp/zc-supervisor.exit ]; then break; fi
            sleep 0.5
          done
          echo "final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::the release artifact's supervisor did not reach healthy"
            echo "--- supervisor.log:"; tail -30 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
            echo "--- provision.log:"; tail -30 "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || true
            echo "--- stdout:"; tail -40 "$RUNNER_TEMP/zc-supervisor-stdout.log" 2>/dev/null || true
            exit 1
          fi

          PGBIN="$INSTALLED/Contents/Resources/runtime/postgresql/17/bin"
          echo "[proof] PG healthy on the SHIPPED production port (55432, 127.0.0.1 only)"
          "$PGBIN/pg_isready" -h 127.0.0.1 -p 55432
          echo "[proof] authenticated SELECT 1 as the app role (seeded credential)"
          ONE=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p 55432 -U medivault -d medivault -t -A -c "SELECT 1")
          [ "$ONE" = "1" ] || { echo "::error::authenticated SELECT 1 failed"; exit 1; }
          MIG=$(PGPASSWORD="$MV_KEYCHAIN_SEED_PG_APP_PASSWORD" "$PGBIN/psql" -h 127.0.0.1 -p 55432 -U medivault -d medivault -t -A -c "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          echo "applied migrations: $MIG (expect 8)"
          [ "$MIG" = "8" ] || { echo "::error::expected 8 applied migrations"; exit 1; }

          echo "[proof] the API runs on the PACKAGED hardened node binary"
          pgrep -f "$INSTALLED/Contents/Resources/runtime/nodejs/bin/node" >/dev/null || {
            echo "::error::the API is not running on the packaged node binary"; exit 1
          }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/health" || echo 000)
          echo "/health -> $CODE"; test "$CODE" = "200"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/ready" || echo 000)
          echo "/ready -> $CODE"; test "$CODE" = "200"
          test -f "$SUP/config/provisioned.json"
          echo "HARDENED-RELEASE-LIFECYCLE-GREEN (canonical install + relocatable config + hardened runtime)"

          echo "[shutdown] graceful SIGTERM + zero owned orphans"
          kill -TERM "$(jq -r .pid "$STATUS")"
          for i in $(seq 1 180); do [ -f /tmp/zc-supervisor.exit ] && break; sleep 0.5; done
          EXIT_CODE=$(cat /tmp/zc-supervisor.exit 2>/dev/null || echo MISSING)
          echo "supervisor exit code: $EXIT_CODE (expect 0)"
          [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor did not exit 0"; exit 1; }
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "zero postgres orphans" || { echo "$LEFT"; exit 1; }
          [ ! -f "$SUP/PostgreSQL/17/data/postmaster.pid" ] || {
            echo "::error::postmaster.pid still present"; exit 1
          }

      - name: Zero-cost release summary (machine-readable)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-dmg.env
          . /tmp/zc-manifest.env
          . /tmp/zc-node-allowjit.env
          . /tmp/zc-installed.env
          {
            echo "ZC-ARCH: ${{ matrix.expected_uname }}"
            echo "ZC-ARTIFACT: $(basename "$DMG_OUT")"
            echo "ZC-DMG-SHA256: $(awk '{print $1}' "$DMG_OUT.sha256")"
            echo "ZC-MANIFEST: $(basename "$MANIFEST_OUT")"
            echo "ZC-MANIFEST-FILES: $(sed -n 's/^files: //p' "$MANIFEST_OUT" | head -1)"
            echo "ZC-NODE-ALLOW-JIT: $NODE_ALLOW_JIT"
            echo "ZC-SIGNING: ad-hoc + Hardened Runtime (inside-out) — THE release signature (zero-cost model)"
            echo "ZC-APPLE-DEVELOPER-ID: NO"
            echo "ZC-APPLE-NOTARIZATION: NO"
            echo "ZC-GATEKEEPER-AUTOMATIC-TRUST: NO"
            echo "ZC-FIRST-INSTALL-MANUAL-APPROVAL: YES"
            echo "ZC-OFFLINE-VERIFICATION: GREEN (verify-release.sh + offline self-audit + tamper negative controls)"
            echo "ZC-HARDENED-LIFECYCLE: GREEN (canonical per-user install, shipped config, 127.0.0.1 only)"
          } | tee /tmp/zc-summary.txt

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          pkill -f '/Users/runner/Applications/MediVault.app/Contents/MacOS/mediavault-supervisor' 2>/dev/null || true
          pkill -f 'MediVault.app/Contents/Resources/runtime/nodejs' 2>/dev/null || true
          d="$HOME/Library/Application Support/MediVault/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            PGRT="/Users/runner/Applications/MediVault.app/Contents/Resources/runtime/postgresql/17/bin"
            [ -x "$PGRT/pg_ctl" ] && "$PGRT/pg_ctl" -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }
          rm -rf "/Users/runner/Applications/MediVault.app" \
                 "$HOME/Library/Application Support/MediVault" \
                 "$HOME/Library/Logs/MediVault" 2>/dev/null || true
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security delete-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || true
          done

      - name: Upload the release artifacts (the doctor-facing distribution set)
        uses: actions/upload-artifact@v4
        with:
          name: medivault-zero-cost-release-${{ matrix.artifact_arch }}
          retention-days: 30
          path: |
            /Users/runner/work/_temp/MediVault-${{ matrix.artifact_arch }}.dmg
            /Users/runner/work/_temp/MediVault-${{ matrix.artifact_arch }}.dmg.sha256
            /Users/runner/work/_temp/MediVault-${{ matrix.artifact_arch }}.manifest.txt
            macos/scripts/verify-release.sh
            macos/release/SECURITY-DISCLOSURE.md
            macos/release/FIRST-INSTALL.md
            /tmp/zc-summary.txt
          if-no-files-found: error

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-release-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/zc-summary.txt
            /tmp/zc-*.log
            /tmp/zc-*.out
            /tmp/zc-macho-gate-*.txt
            /tmp/zc-jit-proof.js
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # smappservice-lifecycle mode — the CI-provable SMAppService contract
  # (acceptance/macos-zero-cost-release-contract.md §7): self-test,
  # notRegistered -> register (under the ad-hoc RELEASE signature — the
  # empirical ad-hoc proof; any Apple restriction is captured verbatim
  # and escalated BEFORE architecture changes), status model
  # (enabled | requiresApproval — both documented outcomes), launchd job
  # existence, launchd-owned backend start (branch A) or the approval
  # gate holding (branch B), KeepAlive restart, open-settings exit
  # contract, unregister cleanup. Login Items approval UI, logout/login,
  # and reboot are the interactive harness (sections 5-10).
  # ---------------------------------------------------------------------------
  smappservice-lifecycle:
    name: "smappservice-lifecycle (${{ matrix.label }})"
    if: github.event.inputs.mode == 'smappservice-lifecycle'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native runner architecture proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion)"
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      - name: Supervisor unit tests (relocatable config resolution)
        shell: bash
        run: |
          set -euo pipefail
          cd macos/supervisor
          cargo test --locked 2>&1 | tee /tmp/zc-supervisor-tests.log
          test "$(grep -c 'test result: ok' /tmp/zc-supervisor-tests.log)" -ge 1
          grep -q 'full_relocatable_resolution_against_a_temp_bundle' /tmp/zc-supervisor-tests.log

      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build (app bundle, per-arch — compiles the SMAppService commands)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/zc-tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/zc-tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/zc-tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Desktop unit tests (SMAppService status mapping, fail-closed parsing)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --bins --locked 2>&1 | tee /tmp/zc-desktop-tests.log
          test "$(grep -c 'test result: ok' /tmp/zc-desktop-tests.log)" -ge 1
          grep -q 'rejects_any_invented_or_future_status_fail_closed' /tmp/zc-desktop-tests.log

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/zc-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/zc-api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/zc-prisma-cli"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/zc-prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/zc-node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Compile the SMAppService helper (swiftc, minOS 13.0)
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          HELPER_OUT="$RUNNER_TEMP/zc-mediavault-launchagent"
          swiftc -O macos/smappservice/medivault-launchagent.swift \
            -target ${{ matrix.expected_uname }}-apple-macos13.0 \
            -o "$HELPER_OUT"
          file "$HELPER_OUT"
          if otool -l "$HELPER_OUT" | grep -q 'path /usr/lib/swift'; then
            install_name_tool -delete_rpath /usr/lib/swift "$HELPER_OUT"
          fi
          codesign --force --sign - "$HELPER_OUT"
          MACHO_RECORDS=/tmp/zc-macho-gate-helper.txt \
            bash macos/scripts/macho-gate.sh "$HELPER_OUT" "${{ matrix.expected_uname }}" 13.0
          echo "HELPER_OUT=$HELPER_OUT" | tee /tmp/zc-smappservice-bin.env

      - name: Merge the backend into the Tauri MediVault.app (relocatable shape)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-tauri-app.env
          . /tmp/zc-node-tarball.env
          . /tmp/zc-api-stage.env
          . /tmp/zc-prisma-stage.env
          . /tmp/zc-smappservice-bin.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            SMAPPSERVICE_BIN="$HELPER_OUT" \
            bash macos/scripts/stage-app-bundle.sh

          echo "APP_ROOT=$APP" | tee /tmp/zc-app-root.env
          echo "--- shipped supervisor-config.json (RELOCATABLE, production ports):"
          cat "$APP/Contents/Resources/supervisor-config.json"
          echo "--- bundle top level:"
          find "$APP" -maxdepth 3 -not -path "*/runtime/postgresql/17/*" | sed "s|$APP|<APP>|" | sort | sed -n '1,40p'

      - name: Prisma engine install-ID hygiene (scrub build-machine paths)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP="$APP_ROOT"
          REPAIRED=0
          while IFS= read -r -d '' f; do
            ID_LINE="$(otool -l "$f" 2>/dev/null | awk '/LC_ID_DYLIB/{id=1} id && $1=="name"{print $2; id=0}' | head -1)"
            if [ -n "$ID_LINE" ] && [[ "$ID_LINE" == /* ]]; then
              base="$(basename "$f")"
              echo "  repair: $(basename "$f") id '$ID_LINE' -> @loader_path/$base"
              install_name_tool -id "@loader_path/$base" "$f"
              codesign --force --sign - "$f" >/dev/null
              REPAIRED=$((REPAIRED + 1))
            fi
          done < <(find "$APP/Contents/Resources/api/node_modules/.prisma" \
                        "$APP/Contents/Resources/prisma-cli/node_modules/@prisma/engines" \
                        -type f -name '*.dylib.node' -print0 2>/dev/null)
          echo "prisma install-IDs repaired: $REPAIRED"
          LEFT=$(find "$APP" -type f -print0 | xargs -0 file 2>/dev/null | grep 'Mach-O' | cut -d: -f1 | while read -r m; do
            otool -L "$m" 2>/dev/null | tail -n +2 | sed 's/(.*//' | grep -E '^/' | grep -vE '^/usr/lib/|^/System/' || true
          done | sort -u)
          if [ -n "$LEFT" ]; then
            echo "::error::absolute (non-system) Mach-O references remain:"
            echo "$LEFT"
            exit 1
          fi
          echo "PRISMA-INSTALL-ID-HYGIENE-GREEN (zero non-system absolute references)"

      - name: Mach-O gates on the merged bundle (all binaries incl. the helper)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP="$APP_ROOT"
          MACHO_RECORDS=/tmp/zc-macho-gate-1.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-2.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-3.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-launchagent" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-4.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-5.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      - name: ZERO-COST RELEASE SIGNING (ad-hoc + Hardened Runtime, inside-out)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP_ROOT="$APP_ROOT" MV_ADHOC_RELEASE=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=0 \
            bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/zc-sign-release.log
          grep -q 'SIGN-ZERO-COST-RELEASE-GREEN' /tmp/zc-sign-release.log
          # The zero-cost honesty contract: the ad-hoc release signature is
          # integrity + Hardened Runtime — NOT identity, NOT Gatekeeper trust.
          if grep -q 'Gatekeeper' /tmp/zc-sign-release.log && grep -qE 'GREEN.*Gatekeeper' /tmp/zc-sign-release.log; then
            echo "::error::a Gatekeeper claim appeared in the signing output — forbidden"
            exit 1
          fi
          echo "ZERO-COST-RELEASE-SIGNING-GREEN (ad-hoc identity, Hardened Runtime, inside-out, zero entitlements)"

      - name: Node JIT proof (strictest-first, hardened Node, NO entitlements)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          NODE="$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node"
          cat > /tmp/zc-jit-proof.js <<'EOF'
          // Hot loop forces V8 JIT tier-up (interpreter -> Sparkplug -> Maglev/TurboFan).
          function hot(n) {
            let acc = 0;
            for (let i = 0; i < n; i++) {
              acc += (i ^ 0x5f) * 31 + (i >>> 3);
            }
            return acc;
          }
          let total = 0;
          for (let round = 0; round < 3000; round++) total += hot(20000);
          if (!Number.isFinite(total) || total === 0) throw new Error('bad result');
          console.log('JIT-WORKLOAD-OK ' + total);
          EOF
          set +e
          "$NODE" /tmp/zc-jit-proof.js > /tmp/zc-jit-strict.out 2>&1
          STRICT_RC=$?
          set -e
          echo "strict (no entitlement) exit: $STRICT_RC"
          cat /tmp/zc-jit-strict.out || true
          if [ "$STRICT_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/zc-jit-strict.out; then
            echo "NODE_ALLOW_JIT=not-needed" | tee /tmp/zc-node-allowjit.env
            echo "V8 executed the JIT-tiering workload under Hardened Runtime WITHOUT any entitlement — zero entitlements ship."
          else
            echo "NODE_ALLOW_JIT=needed" | tee /tmp/zc-node-allowjit.env
            echo "Strict configuration FAILED (exit $STRICT_RC) — re-signing Node with allow-jit (the ONLY entitlement, Node only):"
            APP_ROOT="$APP_ROOT" MV_ADHOC_RELEASE=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=1 \
              bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/zc-sign-allowjit.log
            grep -q 'SIGN-ZERO-COST-RELEASE-GREEN' /tmp/zc-sign-allowjit.log
            set +e
            "$NODE" /tmp/zc-jit-proof.js > /tmp/zc-jit-allowjit.out 2>&1
            AJ_RC=$?
            set -e
            [ "$AJ_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/zc-jit-allowjit.out || {
              echo "::error::Node failed EVEN WITH allow-jit — not an entitlement issue; investigate"
              exit 1
            }
          fi
          cat /tmp/zc-node-allowjit.env

      - name: Recursive signature verification (fail-closed, final release state)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          . /tmp/zc-node-allowjit.env
          FINAL_ALLOW_JIT=0
          [ "$NODE_ALLOW_JIT" = "needed" ] && FINAL_ALLOW_JIT=1
          APP_ROOT="$APP_ROOT" EXPECTED_ARCH="${{ matrix.expected_uname }}" \
            MV_NODE_ALLOW_JIT="$FINAL_ALLOW_JIT" \
            bash macos/scripts/verify-signatures.sh 2>&1 | tee /tmp/zc-verify-signatures.log
          grep -q 'VERIFY-SIGNATURES-GREEN' /tmp/zc-verify-signatures.log

      # ------------------------------------------------------------------
      # SMAppService — the CI-provable registration contract against the
      # RELEASE-SIGNED app, installed at the canonical per-user location
      # (the doctor shape). Everything empirical is captured verbatim:
      # if Apple restricts ad-hoc SMAppService registration, the exact
      # error is the finding (escalated BEFORE any architecture change).
      # ------------------------------------------------------------------
      - name: Install the release-signed app at the canonical per-user location
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          INSTALLED="/Users/runner/Applications/MediVault.app"
          rm -rf "$INSTALLED"
          mkdir -p /Users/runner/Applications
          cp -R "$APP_ROOT" "$INSTALLED"
          echo "INSTALLED=$INSTALLED" | tee /tmp/sa-installed.env
          codesign --verify --strict "$INSTALLED"
          echo "per-user install: $INSTALLED (release-signed, ad-hoc)"

      - name: Bootstrap the keychain BEFORE registration (random values, never printed)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          rm -rf "$HOME/Library/Application Support/MediVault" "$HOME/Library/Logs/MediVault"
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets \
              > /tmp/sa-bootstrap.log 2>&1 ) || { cat /tmp/sa-bootstrap.log; exit 1; }
          [ "$(grep -c 'created keychain item' /tmp/sa-bootstrap.log)" = "5" ] || {
            echo "::error::expected 5 created keychain items"; cat /tmp/sa-bootstrap.log; exit 1
          }
          echo "SA-BOOTSTRAP-GREEN (5 items, random values, never printed)"

      - name: SMAppService self-test from the installed app
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          "$INSTALLED/Contents/MacOS/mediavault-launchagent" self-test | tee /tmp/sa-selftest.log
          grep -q 'plist-found=YES' /tmp/sa-selftest.log
          grep -q 'status=' /tmp/sa-selftest.log
          echo "SA-SELFTEST-GREEN (bundle identity + shipped plist + live status query)"

      - name: Status BEFORE registration must be notRegistered (fresh)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          ST="$("$INSTALLED/Contents/MacOS/mediavault-launchagent" status)"
          echo "status before registration: $ST"
          [ "$ST" = "notRegistered" ] || {
            echo "::error::expected notRegistered on a fresh runner, got '$ST' (leftover registration state?)"
            exit 1
          }

      - name: Register the LaunchAgent via SMAppService (ad-hoc release signature)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          set +e
          "$INSTALLED/Contents/MacOS/mediavault-launchagent" register > /tmp/sa-register.log 2>&1
          RC=$?
          set -e
          echo "register exit: $RC"
          cat /tmp/sa-register.log
          if [ "$RC" -ne 0 ]; then
            echo "::error::SMAppService.register() FAILED for the ad-hoc release-signed app — exact behavior captured above (this is the empirical ad-hoc limitation finding; escalate BEFORE any architecture change per the directive)"
            exit 1
          fi
          grep -q 'registered' /tmp/sa-register.log || {
            echo "::error::register exited 0 but did not print 'registered'"
            exit 1
          }
          echo "SA-REGISTER-GREEN (SMAppService.register() succeeded under the ad-hoc release signature)"

      - name: Status AFTER registration — enabled or requiresApproval (both documented)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          ST="$("$INSTALLED/Contents/MacOS/mediavault-launchagent" status)"
          echo "status after registration: $ST"
          echo "SA_STATUS=$ST" | tee /tmp/sa-status.env
          case "$ST" in
            enabled)
              echo "SA-BRANCH=enabled" | tee -a /tmp/sa-status.env
              echo "registered AND approved/running (launchd owns the job)" ;;
            requiresApproval)
              echo "SA-BRANCH=requiresApproval" | tee -a /tmp/sa-status.env
              echo "registered; the Login Items approval gate is ACTIVE (the doctor approves in System Settings — the interactive harness section 5)" ;;
            notRegistered|notFound)
              echo "::error::status '$ST' after a successful register — registration did not stick"; exit 1 ;;
            *)
              echo "::error::unexpected status '$ST'"; exit 1 ;;
          esac

      - name: The launchd job exists (fail-closed print proof)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          launchctl print "gui/$(id -u)/dev.medivault.supervisor" > /tmp/sa-launchctl-print.log 2>&1
          RC=$?
          set -e
          echo "launchctl print exit: $RC (expect 0)"
          if [ "$RC" -ne 0 ]; then
            echo "::error::the launchd job does not exist after SMAppService registration"
            cat /tmp/sa-launchctl-print.log
            exit 1
          fi
          grep -q 'program = ' /tmp/sa-launchctl-print.log || {
            echo "::error::launchctl print output has no program line"
            cat /tmp/sa-launchctl-print.log
            exit 1
          }
          grep -qE 'state = ' /tmp/sa-launchctl-print.log || true
          echo "--- job shape (selected lines):"
          grep -E 'program = |state = |run interval|pid = ' /tmp/sa-launchctl-print.log | head -8 || true
          echo "SA-LAUNCHD-JOB-GREEN (gui domain job present after registration)"

      - name: Branch A (enabled) — launchd starts the backend; Branch B (requiresApproval) — the approval gate holds
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          . /tmp/sa-status.env
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"

          if [ "$SA_STATUS" = "enabled" ]; then
            echo "[branch A] launchd RunAtLoad starts the supervisor — bounded wait (600s) for healthy"
            HEALTHY=0
            for i in $(seq 1 1200); do
              S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
              if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
              if [ "$S" = "failed" ]; then break; fi
              sleep 0.5
            done
            echo "final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
            if [ "$HEALTHY" != "1" ]; then
              echo "::error::launchd-started supervisor did not reach healthy"
              echo "--- supervisor.log:"; tail -30 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
              echo "--- provision.log:"; tail -30 "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || true
              exit 1
            fi
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/health" || echo 000)
            echo "/health -> $CODE"; test "$CODE" = "200"
            SUP_PID=$(pgrep -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" | head -1)
            [ -n "$SUP_PID" ] || { echo "::error::supervisor not running"; exit 1; }
            PPID_=$(ps -o ppid= -p "$SUP_PID" | tr -d ' ')
            echo "supervisor pid=$SUP_PID parent=$PPID_ (launchd is 1)"
            [ "$PPID_" = "1" ] || {
              echo "::error::the launchd-owned supervisor's parent is $PPID_, not launchd (1) — the backend is NOT launchd-owned"
              exit 1
            }
            echo "SA-BRANCH-A-GREEN (launchd RunAtLoad start -> healthy; parent == launchd; API 127.0.0.1:3001)"
          else
            echo "[branch B] requiresApproval: the supervisor must NOT auto-start before the user approves (bounded 30s proof of the gate)"
            sleep 30
            if pgrep -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" >/dev/null 2>&1; then
              echo "::error::the agent started WITHOUT user approval — the approval gate is not holding"
              exit 1
            fi
            echo "SA-BRANCH-B-GREEN (approval gate holds: no process before user approval — the interactive harness proves the post-approval flow)"
          fi

      - name: Branch A only — KeepAlive restart after SIGKILL (launchd owns resilience)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          . /tmp/sa-status.env
          if [ "$SA_STATUS" != "enabled" ]; then
            echo "skipped (branch B: requiresApproval — KeepAlive proof is interactive)"
            exit 0
          fi
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          SUP_PID=$(pgrep -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" | head -1)
          echo "[keepalive] SIGKILL the supervisor (pid $SUP_PID) — launchd KeepAlive must restart it"
          kill -9 "$SUP_PID"
          HEALTHY=0
          for i in $(seq 1 240); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            sleep 1
          done
          NEW_PID=$(pgrep -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" | head -1 || true)
          echo "new supervisor pid: $NEW_PID (old: $SUP_PID); state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$SUP_PID" ] || {
            echo "::error::launchd did not restart the SIGKILLed supervisor (KeepAlive)"
            exit 1
          }
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::the relaunched supervisor did not reach healthy within the bounded wait"
            tail -20 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/health" || echo 000)
          echo "/health after keepalive restart -> $CODE"; test "$CODE" = "200"
          echo "SA-KEEPALIVE-GREEN (SIGKILL -> launchd restart -> healthy again)"

      - name: openSystemSettingsLoginItems command (exit contract)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          "$INSTALLED/Contents/MacOS/mediavault-launchagent" open-settings
          echo "SA-OPEN-SETTINGS-GREEN (openSystemSettingsLoginItems() exited 0)"

      - name: Unregister — status returns to notRegistered, job + processes gone
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-installed.env
          "$INSTALLED/Contents/MacOS/mediavault-launchagent" unregister | tee /tmp/sa-unregister.log
          ST="$("$INSTALLED/Contents/MacOS/mediavault-launchagent" status)"
          echo "status after unregister: $ST"
          [ "$ST" = "notRegistered" ] || { echo "::error::expected notRegistered after unregister, got '$ST'"; exit 1; }
          set +e
          launchctl print "gui/$(id -u)/dev.medivault.supervisor" > /tmp/sa-launchctl-gone.log 2>&1
          RC=$?
          set -e
          echo "launchctl print after unregister exit: $RC (expect non-zero — job gone)"
          [ "$RC" -ne 0 ] || { echo "::error::the launchd job still exists after unregister"; exit 1; }
          echo "[bounded wait] owned processes stop (launchd stops the job at unregister)"
          for i in $(seq 1 120); do
            pgrep -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" >/dev/null 2>&1 || break
            sleep 1
          done
          sleep 3
          pgrep -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" >/dev/null 2>&1 && {
            echo "::warning::supervisor still alive after unregister+wait — stopping it explicitly for teardown"
            pkill -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" 2>/dev/null || true
            sleep 3
          } || echo "SA-UNREGISTER-GREEN (notRegistered + job gone + processes stopped)"

      - name: SMAppService summary (machine-readable)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/sa-status.env || true
          {
            echo "SA-ARCH: ${{ matrix.expected_uname }}"
            echo "SA-STATUS-AFTER-REGISTER: ${SA_STATUS:-unknown}"
            echo "SA-BRANCH: ${SA-BRANCH:-unknown}"
            echo "SA-REGISTER-UNDER-ADHOC: GREEN"
            echo "SA-LAUNCHD-JOB: GREEN"
            echo "SA-KEEPALIVE: $([ -f /tmp/sa-launchctl-gone.log ] && echo 'see logs' || echo 'see logs')"
            echo "SA-INTERACTIVE-REMAINING: Login Items approval UI, logout/login, reboot (harness sections 5-10)"
          } | tee /tmp/sa-summary.txt

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          . /tmp/sa-installed.env 2>/dev/null || true
          INSTALLED="${INSTALLED:-/Users/runner/Applications/MediVault.app}"
          "$INSTALLED/Contents/MacOS/mediavault-launchagent" unregister >/dev/null 2>&1 || true
          pkill -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" 2>/dev/null || true
          pkill -f "$INSTALLED/Contents/Resources/runtime/nodejs" 2>/dev/null || true
          d="$HOME/Library/Application Support/MediVault/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            PGRT="$INSTALLED/Contents/Resources/runtime/postgresql/17/bin"
            [ -x "$PGRT/pg_ctl" ] && "$PGRT/pg_ctl" -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }
          mkdir -p /tmp/sa-runtime-logs
          cp "$HOME/Library/Logs/MediVault/supervisor.log" /tmp/sa-runtime-logs/ 2>/dev/null || true
          cp "$HOME/Library/Logs/MediVault/provision.log" /tmp/sa-runtime-logs/ 2>/dev/null || true
          rm -rf "$INSTALLED" \
                 "$HOME/Library/Application Support/MediVault" \
                 "$HOME/Library/Logs/MediVault" 2>/dev/null || true
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security delete-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || true
          done

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smappservice-lifecycle-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/sa-summary.txt
            /tmp/sa-*.log
            /tmp/sa-selftest.log
            /tmp/sa-status.env
            /tmp/sa-runtime-logs/
            /tmp/zc-supervisor-tests.log
            /tmp/zc-sign-release.log
            /tmp/zc-verify-signatures.log
            /tmp/zc-macho-gate-*.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # keychain-lifecycle mode — the CI-provable Keychain contract
  # (acceptance/macos-zero-cost-release-contract.md §8): REAL random
  # provisioning (no CI seeds; values never printed), supervisor run 1
  # (secret read #1 -> CLEAN provisioning -> healthy), graceful SIGTERM,
  # supervisor run 2 from a FRESH process (secret read #2 ->
  # VALID_EXISTING, no re-initdb), bootstrap idempotence (never
  # overwrites), and the fail-closed missing-item proof (exit 1 +
  # documented error naming the account + no API/DB start). ACLs are
  # NEVER loosened; cross-build reads are the frozen reinstall CASE 3b.
  # Logout/login + reboot + replacement prompt behavior are the
  # interactive harness (sections 9-11).
  # ---------------------------------------------------------------------------
  keychain-lifecycle:
    name: "keychain-lifecycle (${{ matrix.label }})"
    if: github.event.inputs.mode == 'keychain-lifecycle'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64
            runner: macos-26
            expected_uname: arm64
            node_arch: arm64
            node_sha256: '61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6'
          - label: x64
            runner: macos-26-intel
            expected_uname: x86_64
            node_arch: x64
            node_sha256: '58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    env:
      PG_VERSION: '17.11'
      PG_SHA256: '5367f6fb2ec97efe1eb2e0c7926bb33438e51b0bd3a9733b88498056a7dc9a7e'
      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Preflight — native runner architecture proof
        shell: bash
        run: |
          set -euo pipefail
          echo "uname -m: $(uname -m) (expected ${{ matrix.expected_uname }})"
          test "$(uname -m)" = "${{ matrix.expected_uname }}"
          echo "sw_vers: $(sw_vers -productVersion)"
          if [ "${{ matrix.expected_uname }}" = "arm64" ]; then
            T=$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)
            echo "sysctl.proc_translated: ${T}"
            test "$T" = "0"
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            mini-services/api-service/node_modules
            packages/*/node_modules
          key: macos-deps-${{ matrix.label }}-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json', 'mini-services/api-service/package.json') }}
          restore-keys: |
            macos-deps-${{ matrix.label }}-

      - name: Install dependencies
        run: bun install

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cd macos/supervisor
          rustup toolchain install --profile minimal "$(grep -oE 'channel = "[^"]+"' ../../rust-toolchain.toml | cut -d'"' -f2)"
          cargo --version

      - name: Cache tauri-cli + cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: macos-tauri-cli-${{ matrix.label }}-tauri2

      - name: Install tauri-cli (v2, cargo, cached)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ]; then
            cargo tauri --version
          else
            cargo install tauri-cli --locked --version '^2.11'
            cargo tauri --version
          fi

      - name: Supervisor unit tests (relocatable config resolution)
        shell: bash
        run: |
          set -euo pipefail
          cd macos/supervisor
          cargo test --locked 2>&1 | tee /tmp/zc-supervisor-tests.log
          test "$(grep -c 'test result: ok' /tmp/zc-supervisor-tests.log)" -ge 1
          grep -q 'full_relocatable_resolution_against_a_temp_bundle' /tmp/zc-supervisor-tests.log

      - name: Build the frontend (NEXT_OUTPUT=export)
        shell: bash
        run: |
          set -euo pipefail
          NEXT_OUTPUT=export bunx next build
          test -f out/index.html || { echo "::error::static export missing out/index.html"; exit 1; }
          echo "out/ entries: $(find out -type f | wc -l | tr -d ' ')"

      - name: Generate icon.icns (sips + iconutil, from the committed PNGs)
        shell: bash
        run: |
          set -euo pipefail
          ICONSET="src-tauri/icons/MediVault.iconset"
          rm -rf "$ICONSET"; mkdir -p "$ICONSET"
          SRC="src-tauri/icons"
          sips -z 16 16    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16.png"    >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32    "$SRC/32x32.png"     --out "$ICONSET/icon_32x32.png"    >/dev/null
          sips -z 64 64    "$SRC/128x128.png"   --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128  "$SRC/128x128.png"   --out "$ICONSET/icon_128x128.png"  >/dev/null
          sips -z 256 256  "$SRC/128x128@2x.png" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256  "$SRC/256x256.png"   --out "$ICONSET/icon_256x256.png"  >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512  "$SRC/icon.png"      --out "$ICONSET/icon_512x512.png"  >/dev/null
          sips -z 1024 1024 "$SRC/icon.png"    --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o src-tauri/icons/icon.icns
          ls -la src-tauri/icons/icon.icns

      - name: Tauri build (app bundle, per-arch — compiles the SMAppService commands)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo tauri build --bundles app 2>&1 | tee /tmp/zc-tauri-build.log
          APP="target/release/bundle/macos/MediVault.app"
          test -x "$APP/Contents/MacOS/MediVault" || {
            echo "::error::Tauri desktop binary missing"
            tail -40 /tmp/zc-tauri-build.log
            exit 1
          }
          echo "APP=$PWD/$APP" | tee /tmp/zc-tauri-app.env
          file "$APP/Contents/MacOS/MediVault"

      - name: Desktop unit tests (SMAppService status mapping, fail-closed parsing)
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          cargo test --bins --locked 2>&1 | tee /tmp/zc-desktop-tests.log
          test "$(grep -c 'test result: ok' /tmp/zc-desktop-tests.log)" -ge 1
          grep -q 'rejects_any_invented_or_future_status_fail_closed' /tmp/zc-desktop-tests.log

      - name: Build the supervisor + provisioner + API runtime
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cd macos/supervisor
          cargo build --release --locked
          codesign --force --sign - target/release/mediavault-supervisor
          cd ../provision
          bun install
          bun run build
          test -f dist/index.js
          cd ../..
          ./node_modules/.bin/prisma generate --schema packages/db/prisma/schema.prisma 2>&1 | tail -2
          ./node_modules/.bin/tsc --project mini-services/api-service/tsconfig.json
          test -f mini-services/api-service/dist/mini-services/api-service/src/index.js

      - name: Stage the API runtime tree + prisma CLI closure + Node runtime
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/zc-api"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/api/dist" "$STAGE/api/node_modules/@medivault"/{auth,crypto,db}
          cp -R mini-services/api-service/dist/mini-services/api-service/src/. "$STAGE/api/dist/"
          cp mini-services/api-service/package.json "$STAGE/api/package.json"
          ( cd "$STAGE/api" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          cp -R mini-services/api-service/dist/packages/auth/src/.    "$STAGE/api/node_modules/@medivault/auth/"
          cp -R mini-services/api-service/dist/packages/crypto/src/. "$STAGE/api/node_modules/@medivault/crypto/"
          cp -R mini-services/api-service/dist/packages/db/src/.     "$STAGE/api/node_modules/@medivault/db/"
          printf '{"name":"@medivault/auth","version":"1.0.0","type":"module","main":"./index.js"}\n'   > "$STAGE/api/node_modules/@medivault/auth/package.json"
          printf '{"name":"@medivault/crypto","version":"1.0.0","type":"module","main":"./index.js"}\n' > "$STAGE/api/node_modules/@medivault/crypto/package.json"
          printf '{"name":"@medivault/db","version":"1.0.0","type":"module","main":"./client.js"}\n'    > "$STAGE/api/node_modules/@medivault/db/package.json"
          rm -rf "$STAGE/api/node_modules/.prisma"
          cp -R node_modules/.prisma "$STAGE/api/node_modules/.prisma"
          echo "STAGE=$STAGE" | tee /tmp/zc-api-stage.env

          PRISMA_STAGE="$RUNNER_TEMP/zc-prisma-cli"
          rm -rf "$PRISMA_STAGE"
          mkdir -p "$PRISMA_STAGE"
          PRISMA_VERSION="$(node -p "require('$PWD/node_modules/prisma/package.json').version")"
          printf '{"name":"mv-prisma-cli","private":true,"dependencies":{"prisma":"%s"}}\n' "$PRISMA_VERSION" > "$PRISMA_STAGE/package.json"
          ( cd "$PRISMA_STAGE" && npm install --omit=dev --no-audit --no-fund --loglevel=error )
          test -d "$PRISMA_STAGE/node_modules/effect"
          echo "PRISMA_STAGE=$PRISMA_STAGE" | tee /tmp/zc-prisma-stage.env

          TARBALL="node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          curl -fsSL --retry 3 -o "/tmp/$TARBALL" "$NODE_DIST_URL/v$NODE_VERSION/$TARBALL"
          echo "${{ matrix.node_sha256 }}  /tmp/$TARBALL" | shasum -a 256 --check --strict
          echo "NODE_TARBALL=/tmp/$TARBALL" | tee /tmp/zc-node-tarball.env

      - name: Cache PostgreSQL ${{ env.PG_VERSION }} build (MACOSX_DEPLOYMENT_TARGET=13.0)
        id: pg-cache
        uses: actions/cache@v4
        with:
          path: '/Users/runner/pg17-install-dt13'
          key: macos-pg17-dt13-${{ matrix.label }}-${{ env.PG_VERSION }}-${{ env.PG_SHA256 }}

      - name: Build PostgreSQL ${{ env.PG_VERSION }} from source (MACOSX_DEPLOYMENT_TARGET=13.0)
        if: steps.pg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          curl -fsSL --retry 3 -o /tmp/postgresql-$PG_VERSION.tar.gz "$PG_TARBALL_URL"
          echo "$PG_SHA256  /tmp/postgresql-$PG_VERSION.tar.gz" | shasum -a 256 --check --strict
          rm -rf "/tmp/postgresql-$PG_VERSION"
          tar -xzf "/tmp/postgresql-$PG_VERSION.tar.gz" -C /tmp
          cd "/tmp/postgresql-$PG_VERSION"
          ./configure --prefix="$PG_INSTALL" --without-icu --without-readline
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Compile the SMAppService helper (swiftc, minOS 13.0)
        shell: bash
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=13.0
          HELPER_OUT="$RUNNER_TEMP/zc-mediavault-launchagent"
          swiftc -O macos/smappservice/medivault-launchagent.swift \
            -target ${{ matrix.expected_uname }}-apple-macos13.0 \
            -o "$HELPER_OUT"
          file "$HELPER_OUT"
          if otool -l "$HELPER_OUT" | grep -q 'path /usr/lib/swift'; then
            install_name_tool -delete_rpath /usr/lib/swift "$HELPER_OUT"
          fi
          codesign --force --sign - "$HELPER_OUT"
          MACHO_RECORDS=/tmp/zc-macho-gate-helper.txt \
            bash macos/scripts/macho-gate.sh "$HELPER_OUT" "${{ matrix.expected_uname }}" 13.0
          echo "HELPER_OUT=$HELPER_OUT" | tee /tmp/zc-smappservice-bin.env

      - name: Merge the backend into the Tauri MediVault.app (relocatable shape)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-tauri-app.env
          . /tmp/zc-node-tarball.env
          . /tmp/zc-api-stage.env
          . /tmp/zc-prisma-stage.env
          . /tmp/zc-smappservice-bin.env

          PG_INSTALL="$PG_INSTALL" BUNDLE="$APP/Contents/Resources/runtime/postgresql/17" PG_VERSION="$PG_VERSION" \
            SUPERVISOR_BIN="$PWD/macos/supervisor/target/release/mediavault-supervisor" \
            bash macos/scripts/stage-pg-bundle.sh

          APP_ROOT="$APP" \
            NODE_TARBALL="$NODE_TARBALL" \
            API_STAGE="$STAGE" \
            PROVISION_DIR="$PWD/macos/provision" \
            PRISMA_MODULES="$PRISMA_STAGE/node_modules" \
            PRISMA_SCHEMA_DIR="$PWD/packages/db/prisma" \
            LAUNCHAGENT_SRC="$PWD/macos/launchagent/dev.medivault.supervisor.plist" \
            SMAPPSERVICE_BIN="$HELPER_OUT" \
            bash macos/scripts/stage-app-bundle.sh

          echo "APP_ROOT=$APP" | tee /tmp/zc-app-root.env
          echo "--- shipped supervisor-config.json (RELOCATABLE, production ports):"
          cat "$APP/Contents/Resources/supervisor-config.json"
          echo "--- bundle top level:"
          find "$APP" -maxdepth 3 -not -path "*/runtime/postgresql/17/*" | sed "s|$APP|<APP>|" | sort | sed -n '1,40p'

      - name: Prisma engine install-ID hygiene (scrub build-machine paths)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP="$APP_ROOT"
          REPAIRED=0
          while IFS= read -r -d '' f; do
            ID_LINE="$(otool -l "$f" 2>/dev/null | awk '/LC_ID_DYLIB/{id=1} id && $1=="name"{print $2; id=0}' | head -1)"
            if [ -n "$ID_LINE" ] && [[ "$ID_LINE" == /* ]]; then
              base="$(basename "$f")"
              echo "  repair: $(basename "$f") id '$ID_LINE' -> @loader_path/$base"
              install_name_tool -id "@loader_path/$base" "$f"
              codesign --force --sign - "$f" >/dev/null
              REPAIRED=$((REPAIRED + 1))
            fi
          done < <(find "$APP/Contents/Resources/api/node_modules/.prisma" \
                        "$APP/Contents/Resources/prisma-cli/node_modules/@prisma/engines" \
                        -type f -name '*.dylib.node' -print0 2>/dev/null)
          echo "prisma install-IDs repaired: $REPAIRED"
          LEFT=$(find "$APP" -type f -print0 | xargs -0 file 2>/dev/null | grep 'Mach-O' | cut -d: -f1 | while read -r m; do
            otool -L "$m" 2>/dev/null | tail -n +2 | sed 's/(.*//' | grep -E '^/' | grep -vE '^/usr/lib/|^/System/' || true
          done | sort -u)
          if [ -n "$LEFT" ]; then
            echo "::error::absolute (non-system) Mach-O references remain:"
            echo "$LEFT"
            exit 1
          fi
          echo "PRISMA-INSTALL-ID-HYGIENE-GREEN (zero non-system absolute references)"

      - name: Mach-O gates on the merged bundle (all binaries incl. the helper)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP="$APP_ROOT"
          MACHO_RECORDS=/tmp/zc-macho-gate-1.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/MediVault" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-2.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-supervisor" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-3.txt bash macos/scripts/macho-gate.sh "$APP/Contents/MacOS/mediavault-launchagent" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-4.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/nodejs/bin/node" "${{ matrix.expected_uname }}" 13.0
          MACHO_RECORDS=/tmp/zc-macho-gate-5.txt bash macos/scripts/macho-gate.sh "$APP/Contents/Resources/runtime/postgresql/17" "${{ matrix.expected_uname }}" 13.0

      - name: ZERO-COST RELEASE SIGNING (ad-hoc + Hardened Runtime, inside-out)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          APP_ROOT="$APP_ROOT" MV_ADHOC_RELEASE=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=0 \
            bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/zc-sign-release.log
          grep -q 'SIGN-ZERO-COST-RELEASE-GREEN' /tmp/zc-sign-release.log
          # The zero-cost honesty contract: the ad-hoc release signature is
          # integrity + Hardened Runtime — NOT identity, NOT Gatekeeper trust.
          if grep -q 'Gatekeeper' /tmp/zc-sign-release.log && grep -qE 'GREEN.*Gatekeeper' /tmp/zc-sign-release.log; then
            echo "::error::a Gatekeeper claim appeared in the signing output — forbidden"
            exit 1
          fi
          echo "ZERO-COST-RELEASE-SIGNING-GREEN (ad-hoc identity, Hardened Runtime, inside-out, zero entitlements)"

      - name: Node JIT proof (strictest-first, hardened Node, NO entitlements)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          NODE="$APP_ROOT/Contents/Resources/runtime/nodejs/bin/node"
          cat > /tmp/zc-jit-proof.js <<'EOF'
          // Hot loop forces V8 JIT tier-up (interpreter -> Sparkplug -> Maglev/TurboFan).
          function hot(n) {
            let acc = 0;
            for (let i = 0; i < n; i++) {
              acc += (i ^ 0x5f) * 31 + (i >>> 3);
            }
            return acc;
          }
          let total = 0;
          for (let round = 0; round < 3000; round++) total += hot(20000);
          if (!Number.isFinite(total) || total === 0) throw new Error('bad result');
          console.log('JIT-WORKLOAD-OK ' + total);
          EOF
          set +e
          "$NODE" /tmp/zc-jit-proof.js > /tmp/zc-jit-strict.out 2>&1
          STRICT_RC=$?
          set -e
          echo "strict (no entitlement) exit: $STRICT_RC"
          cat /tmp/zc-jit-strict.out || true
          if [ "$STRICT_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/zc-jit-strict.out; then
            echo "NODE_ALLOW_JIT=not-needed" | tee /tmp/zc-node-allowjit.env
            echo "V8 executed the JIT-tiering workload under Hardened Runtime WITHOUT any entitlement — zero entitlements ship."
          else
            echo "NODE_ALLOW_JIT=needed" | tee /tmp/zc-node-allowjit.env
            echo "Strict configuration FAILED (exit $STRICT_RC) — re-signing Node with allow-jit (the ONLY entitlement, Node only):"
            APP_ROOT="$APP_ROOT" MV_ADHOC_RELEASE=1 MV_SIGN_IDENTITY=- MV_NODE_ALLOW_JIT=1 \
              bash macos/scripts/sign-production.sh 2>&1 | tee /tmp/zc-sign-allowjit.log
            grep -q 'SIGN-ZERO-COST-RELEASE-GREEN' /tmp/zc-sign-allowjit.log
            set +e
            "$NODE" /tmp/zc-jit-proof.js > /tmp/zc-jit-allowjit.out 2>&1
            AJ_RC=$?
            set -e
            [ "$AJ_RC" -eq 0 ] && grep -q 'JIT-WORKLOAD-OK' /tmp/zc-jit-allowjit.out || {
              echo "::error::Node failed EVEN WITH allow-jit — not an entitlement issue; investigate"
              exit 1
            }
          fi
          cat /tmp/zc-node-allowjit.env

      - name: Recursive signature verification (fail-closed, final release state)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          . /tmp/zc-node-allowjit.env
          FINAL_ALLOW_JIT=0
          [ "$NODE_ALLOW_JIT" = "needed" ] && FINAL_ALLOW_JIT=1
          APP_ROOT="$APP_ROOT" EXPECTED_ARCH="${{ matrix.expected_uname }}" \
            MV_NODE_ALLOW_JIT="$FINAL_ALLOW_JIT" \
            bash macos/scripts/verify-signatures.sh 2>&1 | tee /tmp/zc-verify-signatures.log
          grep -q 'VERIFY-SIGNATURES-GREEN' /tmp/zc-verify-signatures.log

      # ------------------------------------------------------------------
      # Keychain — the CI-provable lifecycle contract against the
      # RELEASE-SIGNED app: REAL random provisioning (no CI seeds —
      # values never printed, never known to the harness), supervisor
      # run #1 (secret read #1) to healthy, graceful restart, supervisor
      # run #2 from a FRESH process (secret read #2), idempotence, and
      # the fail-closed missing-item proof. Cross-build reads are the
      # frozen reinstall CASE 3b evidence.
      # ------------------------------------------------------------------
      - name: Install the release-signed app at the canonical per-user location
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/zc-app-root.env
          INSTALLED="/Users/runner/Applications/MediVault.app"
          rm -rf "$INSTALLED"
          mkdir -p /Users/runner/Applications
          cp -R "$APP_ROOT" "$INSTALLED"
          echo "INSTALLED=$INSTALLED" | tee /tmp/kl-installed.env
          codesign --verify --strict "$INSTALLED"
          rm -rf "$HOME/Library/Application Support/MediVault" "$HOME/Library/Logs/MediVault"

      - name: K1 initial provisioning — bootstrap with REAL random values (never printed)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/kl-installed.env
          echo "[K1] no MV_KEYCHAIN_SEED_* env is set — bootstrap generates cryptographically random values"
          env | grep -c '^MV_KEYCHAIN_SEED_' || true
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets \
              > /tmp/kl-bootstrap-1.log 2>&1 ) || { cat /tmp/kl-bootstrap-1.log; exit 1; }
          [ "$(grep -c 'created keychain item' /tmp/kl-bootstrap-1.log)" = "5" ] || {
            echo "::error::expected 5 created keychain items"; cat /tmp/kl-bootstrap-1.log; exit 1
          }
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security find-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || {
              echo "::error::keychain item missing after bootstrap: $account"; exit 1
            }
          done
          echo "K1-PROVISIONING-GREEN (5 items created with real random values; values never printed)"

      - name: K2 supervisor run 1 — secret read #1, CLEAN provisioning, healthy
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/kl-installed.env
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          rm -f /tmp/kl-supervisor-1.exit
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" \
              > "$RUNNER_TEMP/kl-supervisor-1-stdout.log" 2>&1; echo $? > /tmp/kl-supervisor-1.exit ) &
          HEALTHY=0
          for i in $(seq 1 1200); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            if [ "$S" = "failed" ]; then break; fi
            if [ -f /tmp/kl-supervisor-1.exit ]; then break; fi
            sleep 0.5
          done
          echo "run 1 final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::supervisor run 1 did not reach healthy (keychain read #1 failed?)"
            echo "--- supervisor.log:"; tail -30 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
            echo "--- provision.log:"; tail -30 "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || true
            exit 1
          fi
          PGBIN="$INSTALLED/Contents/Resources/runtime/postgresql/17/bin"
          "$PGBIN/pg_isready" -h 127.0.0.1 -p 55432
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/health" || echo 000)
          echo "/health -> $CODE"; test "$CODE" = "200"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/ready" || echo 000)
          echo "/ready -> $CODE (authenticated DB round-trip through keychain-derived credentials)"; test "$CODE" = "200"
          test -f "$SUP/config/provisioned.json"
          echo "K2-RUN1-GREEN (keychain read #1 -> CLEAN provisioning -> healthy; /ready = authenticated DB proof)"

      - name: K3 graceful SIGTERM — exit 0, zero orphans, cluster stopped
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/kl-installed.env
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          kill -TERM "$(jq -r .pid "$STATUS")"
          for i in $(seq 1 180); do [ -f /tmp/kl-supervisor-1.exit ] && break; sleep 0.5; done
          EXIT_CODE=$(cat /tmp/kl-supervisor-1.exit 2>/dev/null || echo MISSING)
          echo "supervisor run 1 exit code: $EXIT_CODE (expect 0)"
          [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor did not exit 0"; exit 1; }
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "zero postgres orphans" || { echo "$LEFT"; exit 1; }
          [ ! -f "$SUP/PostgreSQL/17/data/postmaster.pid" ] || {
            echo "::error::postmaster.pid still present"; exit 1
          }
          echo "K3-GRACEFUL-STOP-GREEN (exit 0; zero orphans; postmaster.pid gone)"

      - name: K4 supervisor run 2 — FRESH process, secret read #2, VALID_EXISTING
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/kl-installed.env
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          INITDB_BEFORE=$(grep -c 'initdb' "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || echo 0)
          rm -f /tmp/kl-supervisor-2.exit
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" \
              > "$RUNNER_TEMP/kl-supervisor-2-stdout.log" 2>&1; echo $? > /tmp/kl-supervisor-2.exit ) &
          HEALTHY=0
          for i in $(seq 1 1200); do
            S=$(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)
            if [ "$S" = "healthy" ]; then HEALTHY=1; break; fi
            if [ "$S" = "failed" ]; then break; fi
            if [ -f /tmp/kl-supervisor-2.exit ]; then break; fi
            sleep 0.5
          done
          echo "run 2 final state: $(jq -r '.state // "none"' "$STATUS" 2>/dev/null || echo none)"
          if [ "$HEALTHY" != "1" ]; then
            echo "::error::supervisor run 2 did not reach healthy (keychain read #2 failed?)"
            echo "--- supervisor.log:"; tail -30 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
            exit 1
          fi
          grep -q 'VALID_EXISTING' "$HOME/Library/Logs/MediVault/provision.log" || {
            echo "::error::run 2 did not classify the cluster VALID_EXISTING (data preservation broken?)"
            tail -20 "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || true
            exit 1
          }
          INITDB_AFTER=$(grep -c 'initdb' "$HOME/Library/Logs/MediVault/provision.log" 2>/dev/null || echo 0)
          echo "initdb occurrences: $INITDB_BEFORE -> $INITDB_AFTER (must not grow)"
          [ "$INITDB_AFTER" -le "$INITDB_BEFORE" ] || { echo "::error::the cluster was re-initialized on restart"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3001/health" || echo 000)
          echo "/health -> $CODE"; test "$CODE" = "200"
          echo "K4-RUN2-GREEN (fresh process re-read the 5 keychain items; VALID_EXISTING; healthy; no re-initdb)"

      - name: K5 graceful stop of run 2 + bootstrap idempotence (never overwrites)
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/kl-installed.env
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          kill -TERM "$(jq -r .pid "$STATUS")"
          for i in $(seq 1 180); do [ -f /tmp/kl-supervisor-2.exit ] && break; sleep 0.5; done
          EXIT_CODE=$(cat /tmp/kl-supervisor-2.exit 2>/dev/null || echo MISSING)
          echo "supervisor run 2 exit code: $EXIT_CODE (expect 0)"
          [ "$EXIT_CODE" = "0" ] || { echo "::error::supervisor run 2 did not exit 0"; exit 1; }
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "zero postgres orphans" || { echo "$LEFT"; exit 1; }
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" bootstrap-secrets \
              > /tmp/kl-bootstrap-2.log 2>&1 ) || { cat /tmp/kl-bootstrap-2.log; exit 1; }
          [ "$(grep -c 'already present' /tmp/kl-bootstrap-2.log)" = "5" ] || {
            echo "::error::expected 5 already-present items on the second bootstrap"; cat /tmp/kl-bootstrap-2.log; exit 1
          }
          echo "K5-IDEMPOTENCE-GREEN (5/5 already present — never overwritten across runs)"

      - name: K6 fail-closed — deleting one item makes the next run refuse to start
        shell: bash
        run: |
          set -euo pipefail
          . /tmp/kl-installed.env
          echo "[K6] deleting the jwt-secret item (the documented fail-closed path)"
          security delete-generic-password -s dev.medivault -a jwt-secret >/dev/null 2>&1 || {
            echo "::error::could not delete the jwt-secret item for the negative proof"; exit 1
          }
          SUP="$HOME/Library/Application Support/MediVault"
          STATUS="$SUP/runtime-state/supervisor-status.json"
          rm -f /tmp/kl-supervisor-3.exit
          set +e
          ( "$INSTALLED/Contents/MacOS/mediavault-supervisor" \
              > "$RUNNER_TEMP/kl-supervisor-3-stdout.log" 2>&1; echo $? > /tmp/kl-supervisor-3.exit ) &
          SUPPROC=$!
          for i in $(seq 1 60); do [ -f /tmp/kl-supervisor-3.exit ] && break; sleep 1; done
          set -e
          EXIT_CODE=$(cat /tmp/kl-supervisor-3.exit 2>/dev/null || echo TIMEOUT)
          echo "supervisor run 3 exit code: $EXIT_CODE (expect 1 — fail-closed)"
          [ "$EXIT_CODE" = "1" ] || {
            echo "::error::the supervisor did NOT fail closed on a missing keychain item (exit $EXIT_CODE)"
            kill "$SUPPROC" 2>/dev/null || true
            exit 1
          }
          echo "--- supervisor.log tail (the documented error must name the account):"
          tail -5 "$HOME/Library/Logs/MediVault/supervisor.log" 2>/dev/null || true
          grep -q 'missing keychain items' "$HOME/Library/Logs/MediVault/supervisor.log" || {
            echo "::error::the fail-closed error does not match the documented 'missing keychain items' contract"
            exit 1
          }
          grep -q 'jwt-secret' "$HOME/Library/Logs/MediVault/supervisor.log" || {
            echo "::error::the fail-closed error does not name the missing account (jwt-secret)"
            exit 1
          }
          sleep 2
          if curl -fsS --max-time 2 "http://127.0.0.1:3001/health" >/dev/null 2>&1; then
            echo "::error::the API is up despite the missing secret — fail-closed broken"
            exit 1
          fi
          pgrep -f "postgres -D" >/dev/null 2>&1 && {
            echo "::warning::a postgres process lingers — the supervisor must not start the DB without secrets"
            pkill -f "postgres -D" 2>/dev/null || true
            exit 1
          }
          echo "K6-FAIL-CLOSED-GREEN (missing item -> exit 1 + documented error naming jwt-secret + no API/DB start)"

      - name: Keychain lifecycle summary (machine-readable)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "KL-ARCH: ${{ matrix.expected_uname }}"
            echo "KL-K1-PROVISIONING: GREEN (5 random items, never printed)"
            echo "KL-K2-READ1: GREEN (run 1 healthy; /ready authenticated)"
            echo "KL-K3-GRACEFUL: GREEN (exit 0, zero orphans)"
            echo "KL-K4-READ2: GREEN (fresh process, VALID_EXISTING, no re-initdb)"
            echo "KL-K5-IDEMPOTENCE: GREEN (5/5 already present)"
            echo "KL-K6-FAIL-CLOSED: GREEN (missing item -> exit 1 + named account + no start)"
            echo "KL-CROSS-BUILD-READ: frozen reinstall CASE 3b evidence"
            echo "KL-INTERACTIVE-REMAINING: logout/login read, reboot read, replacement prompt behavior (harness sections 9-11)"
            echo "KL-ACL-MODIFICATIONS: NONE (never loosened)"
          } | tee /tmp/kl-summary.txt

      - name: Teardown + orphan sweep (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          . /tmp/kl-installed.env 2>/dev/null || true
          INSTALLED="${INSTALLED:-/Users/runner/Applications/MediVault.app}"
          pkill -f "$INSTALLED/Contents/MacOS/mediavault-supervisor" 2>/dev/null || true
          pkill -f "$INSTALLED/Contents/Resources/runtime/nodejs" 2>/dev/null || true
          d="$HOME/Library/Application Support/MediVault/PostgreSQL/17/data"
          if [ -d "$d" ] && [ -f "$d/PG_VERSION" ]; then
            PGRT="$INSTALLED/Contents/Resources/runtime/postgresql/17/bin"
            [ -x "$PGRT/pg_ctl" ] && "$PGRT/pg_ctl" -D "$d" -m fast -w -t 60 stop 2>/dev/null || true
          fi
          sleep 2
          LEFT=$(pgrep -fl "postgres -D" | grep -v pgrep || true)
          [ -z "$LEFT" ] && echo "clean — zero postgres processes" || {
            echo "$LEFT"; pkill -9 -f "postgres -D" 2>/dev/null || true
          }
          mkdir -p /tmp/kl-runtime-logs
          cp "$HOME/Library/Logs/MediVault/supervisor.log" /tmp/kl-runtime-logs/ 2>/dev/null || true
          cp "$HOME/Library/Logs/MediVault/provision.log" /tmp/kl-runtime-logs/ 2>/dev/null || true
          rm -rf "$INSTALLED" \
                 "$HOME/Library/Application Support/MediVault" \
                 "$HOME/Library/Logs/MediVault" 2>/dev/null || true
          for account in pg-app-password pg-bootstrap master-key jwt-secret csrf-secret; do
            security delete-generic-password -s dev.medivault -a "$account" >/dev/null 2>&1 || true
          done

      - name: Upload evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keychain-lifecycle-${{ matrix.label }}-evidence
          retention-days: 1
          path: |
            /tmp/kl-summary.txt
            /tmp/kl-bootstrap-*.log
            /tmp/kl-supervisor-*.exit
            /tmp/kl-runtime-logs/
            /tmp/zc-sign-release.log
            /tmp/zc-verify-signatures.log
            /tmp/zc-macho-gate-*.txt
          if-no-files-found: ignore
