      PG_TARBALL_URL: 'https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz'
      PG_INSTALL: '/Users/runner/pg17-install-dt13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      NODE_VERSION: '22.23.2'
      NODE_DIST_URL: 'https://nodejs.org/dist'
      MV_APP_SUPPORT: '/Users/runner/work/_temp/mv-desktop'
      MV_PGPORT: '55439'
      MV_API_PORT: '4577'

    steps:
